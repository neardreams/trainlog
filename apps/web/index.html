<!doctype html>
<html lang="zh-Hant" data-accent="volt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TrainLog · 訓練管理</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23c6f432'/%3E%3Cpath d='M20 12h-2.2a1.8 1.8 0 0 0-1.7 1.3l-1.9 6.4a.2.2 0 0 1-.4 0L10.2 4.3a.2.2 0 0 0-.4 0L7.9 10.7A1.8 1.8 0 0 1 6.2 12H4' fill='none' stroke='%230e0f11' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // React 載入前先套用深淺色、密度、側欄狀態，避免閃白（儲存格式與 src/lib/prefs.ts 相同）
      (function () {
        var R = document.documentElement, q = new URLSearchParams(location.search), s = {};
        try { s = (JSON.parse(localStorage.getItem('tl-prefs') || '{}').state) || {}; } catch (e) {}
        var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        R.dataset.m = q.get('m') || s.mode || (dark ? 'dark' : 'light');
        R.dataset.density = s.density || 'comfortable';
        if (s.collapsed) R.classList.add('sb-collapsed');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
