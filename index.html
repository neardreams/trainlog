const JOURNALS    = {"2026-01-22": "# 2026年1月22日星期四\n\n心情：平靜\n分類：健康、體能\n\n今天熱身做了滾筒放鬆，包括：\n1. 背部\n2. 大腿前側\n3. 大腿後側\n4. 臀中肌\n靜態推雪橇16公斤，15米兩趟。\n分腿蹲共四組：\n1. 前三組：抱 10 公斤啞鈴，每組 10 下\n2. 第四組：左右手各拿 7.5 公斤啞鈴，共 10 下\n第四組對腿的刺激明顯強很多，下次試試看兩手各拿 10 公斤！\n手有負重、沒有扶著桿子的時候，上半身好像也比較不會試著要去依賴手扶著桿子，可以挺得比較好一點\n換組或換腿中間大約抓 3 分鐘，心跳可以回到 130 以下。這 3 分鐘裡面，前面 1 分鐘慢走踏步，後面 2 分鐘可以坐下休息\n今天下午有吃小番茄、橘子和 30 克乳清。今天感覺大項目做完後那幾分鐘的虛弱感降低很多！但是心跳還是很容易去到150-160。\n今天發現分腿蹲時腳雖然也很痠，但是好像沒有深蹲時那種「咔咔」響的感覺。\n三組 Panatta Vertical Leg Press，一邊各加 30 公斤槓片做三組，每組 10 下。\n具體設定如下：\n1. 安全槓固定在 5\n2. 踏板從下往上數第二格\n3. 腳踩在由上往下數第四格\n4. 腳尖部位站距偏寬\n從第二組開始，就覺得腿後側越來越沒力，股四頭肌的佔比越來越高。第三組做完後，股四頭肌變得很酸，已經做不了了。\n雖然腿推放在分腿蹲後面做，但是好像心跳的狀況與負擔，都沒有分腿蹲來的高\n三樓 Impulse 坐姿外展：\n1. 重量：38 公斤（5 塊槓片）\n2. 組數：一組 10 下，共 4 組\n感覺刺激變小了，下次可以試著加重量試試看！\n四樓Impulse，坐姿內收機\n重量 38 公斤，5 片槓片，組數共三組：\n1. 前兩組：10 下\n2. 第三組：8 下\n可能是因為昨天上完教練課的關係，大腿內側有點緊繃、無力，以及輕微的延遲性痠痛。\n昨天教練課做了一個側棒式，是用腿夾板凳的動作，很厲害地刺激到大腿內側；但是要記得，不要用屁股代償。\n一樓的 Impulse SL7036 腹肌機共三組：\n1. 重量：一片 25 公斤槓片\n2. 組數：共三組\n3. 次數：每組十下\n還是有一點不太確定，我的背應該要呈現什麼樣的狀況來做這個腹肌訓練？上半身好像都會有一點想要出力。今天做的方向沒有分側面，是正面的。\n在一樓草皮區做三組棒式，沒有負重：\n1. 第一組：30 秒\n2. 後面兩組：一分鐘\n今天做棒式比較沒有像上次教練課那樣一直抖。\n在草皮區做棒式手很痛。\n", "2026-01-24": "# 2026年1月24日星期六\n\n今天早上10點教練課。\n早餐在9點前喝了一杯30克乳清，吃了小番茄、香蕉，還有一塊吐司。\n昨天吃了不少碳水跟鈉，今天體重多了快1公斤，應該有良好充碳。早上還有補充肌酸跟瓜胺酸。\n熱身：\n1.跑步機時速4公里，坡度3度，走大概5分鐘\n2.接著做滾筒放鬆：\n(a)背部、大腿前側、大腿後側\n(b)臀中肌\n(c)後腿交叉拉臀中肌\n(d)斜方肌（用槓鈴放鬆）\n今天先用跑步機走了5分鐘，就是為了想要實驗一下，是不是先做站立的動態熱身就比較不會頭脹脹發熱。確實後面在用滾筒的時候，比較沒有頭脹脹、發熱的感覺了。\n以下是教練課內容\n拉伸大腿前側的方法：\n1.用分腿蹲的方式，直接跪在地上\n2.雙手扶槓鈴，握到最寬\n3.兩腳分別做15-20秒\n分腿蹲有幾個注意事項：\n1.要注意大腿前側的比重有沒有太高\n2.要注意腳底的三個重心：\n(a)大拇指球要有辦法用力\n(b)三個重心要平均，重心才會穩\n(c)腳可以踩棒狀物，來放鬆腳底三個重心中間的那條筋\n3.前腳、後腳以及骨盆都要回正，不要歪向一邊\n4.避免用胸口附近的位置來帶動身體旋轉，應該要用髖部來帶動\n5.往下蹲的時候，上半身應該要稍微往前傾，用這個往前傾的角度來減少後腳的重心佔比\n6.可以用墊腳的對側，也就是對應另一邊的手持啞鈴做下蹲，另一手扶著槓面。\n大腿內側也要經常用滾筒放鬆。\n接下來是三樓Impulse肩推機的注意事項：\n1.先把重量調到最低，這次設置的是兩片槓片\n2.胸口要挺胸、沉肩\n3.背部不可以向前夾，要感覺肩胛骨是張開的\n4.手握的地方不能用手指往上推，要用手掌的部分往上推，像在催油門的那個姿勢。\n往上推的時候要慢慢吐氣，在上面吸飽氣再下來。下來的時候動作要慢，但不可以放掉重量。不要在下面停留，一下來就繼續往上推。\n推完之後，你應該會感覺肩部前側跟後斜方的部分會有點痠。\n斜方肌放鬆，用槓鈴放鬆的時候，槓鈴可能要上點重量\n一樓Impulse SL7036捲腹機，重量不要放得太重，今天掛10公斤的槓片一片\n動作重點如下：\n1.啟動時要有一點含胸，由胸部來帶動。\n2.不要全部都只用肚子來帶。\n3.手只要撐著就好，不要想著用手去用力。\n4.腳的部分也要盡量放鬆，不要用力。\n5.利用輕的重量多做幾組。\n如果感覺大腿前側跟後側的比例差太多（前側多很多的話），可以用筋膜球或用手指去按壓大腿前側，包含靠近膝蓋的內側以及中間的那個地方。\n課後做了20分鐘的跑步機用走的\n1.速度：3.5公里\n2.坡度：3%\n3.心率：大概120幾下\n", "2026-01-26": "# 2026年1月26日星期一\n\n今天練前熱身做了跑步機，速度3公里，坡度5以下（一直跳來跳去不知道為什麼），時間6分鐘。\n然後做運動放鬆，全身包含大腿的前側、外側、內側、後側，還有臀大肌。\n還有用跪姿分腿蹲的方式拉大腿。\n分腿蹲：\n1. 單手持 7.5 公斤啞鈴，進行三組，每組 10 下\n2. 第四組改為空手：右腳 15 下，左腳 8 下就沒力了\n3樓 impulse 坐姿外展機：\n6片 45 公斤，3 組 10 下\n2樓 Impulse 坐姿內收機：\n1. 45 公斤：\n(a) 第一組 10 下\n(b) 第二組 8 下\n2. 38 公斤：10 下\n3 樓 Impulse 肩推機：\n(a) 18 公斤兩塊槓片\n(b) 3 組各 10下\n平躺槓鈴臥推：\n1. 重量：一手 10 公斤\n2. 組數：3 組\n3. 次數：每組 10 下\n4. 跑步機：15 分鐘\n(a) 速度：3 公里/小時\n(b) 坡度：0\n(c) 心跳：控制在小於 130\n", "2026-01-27": "# 2026年1月27日星期二\n\n熱身計畫如下：\n1.滾筒放鬆背部\n2.按摩球放鬆胸外側\n3.槓鈴上兩邊各20公斤\n4.放鬆斜方肌\n5.坐姿下拉與三頭訓練（超級組）：\n(a)坐姿下拉：3組，每組10下，重量5片槓片（38公斤）\n(b)三頭下拉：前兩組每組10下（38公斤），第三組做幾下就沒力了，重量減至4片槓片（32公斤）(c)訓練細節：今天的坐姿下拉做的是「反握寬位」，主要是為了練闊背肌\n3.站姿提踵機與二頭彎舉機的超級組：\n(a)站姿提踵機：\n1.第一組：3片槓片（25公斤），25下\n2.後面三組：4片槓片（32公斤），每組20下\n(b)二頭彎舉機：\n1.前兩組（25公斤）：第一組12下，第二組10下\n2.第三組：18公斤，10下\n3. 坐姿划船（繩索）：\n3組，每組10下，38公斤（5片槓片）\n跑步機4公里，沒有坡度，10分鐘，心跳控制在130左右\n這次闊背休息了快一個禮拜，狀態很明顯比之前好。\n可以做完5片，兩個動作各三組；上次5片做完下拉就沒力做划船了。\n今天趕時間，所以做了兩個超級組。\n", "2026-01-28": "# 2026年1月28日星期三\n\n使用滾筒跟按摩球放鬆大腿：\n1.前側\n2.內側\n3.外側\n4.後側\n背部\n以下是今天教練課的內容：\n1. 大腿前側放鬆\n(a) 把彈力繩綁在槓鈴架的最高處\n(b) 呈現跪姿面對彈力繩，雙手抓住彈力繩，手不用力\n(c) 靠大腿的力量把上半身往後拉，達到髖部拉伸的效果，再利用髖部的力量往前，如此來回做動態拉伸\n2. 死蟲式\n同樣是做髖部的訓練，注意腰後方不能代償\n3. 坐姿單腿的髖部對抗\n這個動作可能需要兩個人配合操作\n4. 前抱式深蹲\n今天做前抱式深蹲，因為前面有做過一些髖部的啟動，以及比較多熱身、拉鬆、拉筋相關的動作，所以今天的重心比較穩，而且股四頭肌發力的比例也沒有一直跑出來，膝蓋的異響也比較少一點，整個做起來比之前的感覺好很多。\n再來是 Impulse 的胸推機，今天做三片槓片。\n預備姿勢：\n1. 將坐墊調到最低\n2. 腰部離開椅子往前約一個拳頭\n3. 肩胛、背部與頭部靠在椅子上\n4. 往前往上挺胸\n5. 手要實握，不能虛握\n呼吸方式類似肩推跟深蹲：\n吸飽氣之後再往下放，往上推的過程中慢慢吐氣。\n今天做這個胸推機，胸口的感覺蠻明顯的，但是往下放的時候，胸肌的拉伸感沒有很重，整體來說代償並不明顯。\n最後做砸藥球的動作：\n使用 3 公斤的藥球往下深蹲，起來時將藥球往上丟，約丟到牆面的「G」字上方。如此反覆做有氧，一組約 15 次，心跳有飆到 160 左右。\n現在我的深蹲可能最大的局限性在於心肺，需要針對心肺做一些加強。\n", "2026-01-29": "# 2026年1月29日星期四\n\n熱身：\n1.滾筒：\n(a)大腿前側\n(b)大腿後側\n(c)臀中肌\n(d)大腿外側\n(e)背部\n2.按摩球：放鬆股四頭肌\n3.槓鈴：放鬆斜方肌\n第一項訓練（三樓的Impulse）：\n1.坐姿踢腿機：38公斤\n2.組數與次數：\n(a)前兩組：各15下\n(b)第三組：12下\n3.動作要求：做慢離心訓練\n做完股四頭肌確實很痠，昨天有留下一些疲勞感\n熊抱槓深蹲，50公斤：\n1.第一組：7下\n2.第二組：8下\n3.第三組：8下\n今天在做這個動作時，感覺到背闊滿痠（昨天的疲勞還在），背闊肌的刺激感很強，好像今天有練背一樣然後手肘的不適感蠻重的。大概做到第三組左右的時候，股四頭肌就開始大量發力，後面屁股好像有點沒力了。有買了一組護肘，結果發現太小了，根本戴不上。\n3樓Impulse做肢腿後勾機38公斤：\n1.前面兩組：12下（做慢離心）\n2.第三組：8下半（做慢離心）\n好像很久沒有做腿後勾了，做的時候左膝內側那個軟組織的聲音又跑出來了。\n三樓 Impulse 坐姿外展機：\n38 公斤一組。前兩組 15 下，第三組 12 下。\n三組都做慢離心。\n一樓 Impulse 坐姿提踵機，共 7 組：\n1. 第一組：空重 25 下\n2. 第二到第四組：20 公斤，各 20 下\n棒式四組：\n1. 負重 5 公斤槓片，每組一分鐘\n2. 從第三組開始，腰就有一點沒辦法挺直，但還是可以撐著 😔\n今天最喘的就是這個棒式，一撐起來就想要一直加速呼吸 😮‍💨\n3. 二樓跑步機（目標心跳維持 130 左右）：\n(a) 前面 15 分鐘：速度 3 公里、坡度 0\n(b) 後面心跳有點掉下來，把坡度加到 3.8\n(c) 總共運動 25 分鐘\n", "2026-01-30": "# 2026年1月30日星期五\n\n輕輕熱身，滾筒放背部，槓鈴放斜方。\n第一個動作：俯身板凳划船30公斤，左右各5公斤，共三組，一組10下。\n有一點點忘記我的上半身應該要停到什麼角度？\n做這個姿勢的時候，不知道是不是角度還是閉氣的關係，會覺得頭變得有點脹。可是我的頭已經高過水平了。\n三樓 Inpulse 器械繩索下拉（滑輪下拉）三組：\n45 公斤\n1. 第一組：10 下\n2. 第二組：8 下\n3. 第三組：8 下\n這感覺應該是我能維持動作的最大重量了。\n三頭繩索下拉與剛剛的滑輪下拉做超級組。\n三頭部分共三組：\n1. 第一組：38公斤，8下\n2. 後面兩組：32公斤，7下\n不知道是不是上次記錯了，還是因為今天的下拉有加重量，用上次的重量拉起來有點拉不太動，38公斤第一組也勉強只拉了 8 下。\n三樓 Impulse 站姿提踵機跟二頭彎舉機做超級組。\n站姿提踵總共三組 32 公斤：\n1. 第一組 25 下\n2. 第二組 25 下\n3. 第三組 20 下\n二頭彎舉\n第二組：25公斤，10下\n第三組：18公斤，12下（最後兩下做不完整個行程）\n二頭感覺沒力了，可是沒有酸感也沒有脹感，就是覺得使不上勁了直接斷電\n三樓飛鳥夾胸 32 公斤，共三組：\n1. 第一組\n2. 第二組：12 下\n3. 第三組：8 下\n行程放到最短\n從第一組開始，就覺得胸部很有感覺！\n三樓肩推機18公斤\n第一組12下\n第二組12下\n第三組10下\n第四組10下\n這次斜方肌跟三角肌前束都有感覺，不過奇怪的是，機器上的圖沒有畫到斜方肌\n3樓 Impulse 機械式胸推：\n1. 重量：3片 25公斤\n2. 組數：共 3組\n3. 次數：每組 10下\n開始注意「吸氣、閉氣、吐氣」這個流程的呼吸模式之後，注意力就一直放在呼吸上面，導致一直忘記做到第幾下，甚至連第幾組都忘記了。\n二樓的跑步機做走路（速度 3 公里，坡度 4 到 5），維持心跳大約在 130 左右，持續 20 分鐘。\n不知道是身體比較適應了，還是因為我加入了這個跑步的緩和運動，現在延遲性肌肉酸痛的強度沒有那麼強，而且好像也比較快好。\n", "2026-01-31": "# 2026年1月31日星期六\n\n禮拜三練的腿，今天有點痠痛。酸痛的程度沒有很強，不過很緊繃\n今天用滾筒放鬆：\n1.背部跟開胸\n2.槓鈴放在斜方肌\n3.滾筒放鬆腿部\n先用高架的彈力繩放大腿前側\n做俯臥腿後勾的時候要注意，膝蓋要對準軸心再爬上去。如果左膝還有不舒服的彈響，要加強放鬆小腿（用坐姿的方式，按壓小腿內側）如果勾起來時屁股會馬上翹，行程就可以不用那麼長，放下去也可以不用放到那麼底，以避免膝蓋不適。\n上半身要看著板凳，胸口挺起來，並用核心支撐。重量不用重，慢慢做即可。今天只有加到兩片槓片，加上面的 3 公斤加重。忘記到底是多少重量了。\n今天做 SSB 深蹲槓的背槓深蹲，要注意幾個項目：\n1. 手要向上撐到鎖骨左右，讓這個槓靠在斜方肌，不要靠在頸椎上。\n2. 背槓的時候要站進去一點，往上背穩了、站穩了，才往後退。\n3. 往下蹲的時候，要感覺重心是壓在身體前後的正中間。\n4. 手要記得維持住、不要掉下去，不然槓就會往脊椎上壓。\n今天做 40 公斤，感覺不是很重，但是對腿後側來說，做到第二、三組就已經稍微沒力了。這種無力感也不是酸脹感，就是覺得好像要沒電了。\n這種深蹲的方式，注意力可以比較好的集中在腿跟重心的控制上面，不像熊抱槓會一直被上半身拉走注意力。\n接下來做板凳腿內收夾的訓練。跟上次比起來，這次可以夾得比較穩定，但是到後面，下面那一腳會一直往下掉，撐不太上去。\n負重 10 公斤的棒式：一组30秒，感覺強度好像還好做完沒什麼疲勞感\n要記得槓片是放在肩胛骨上面，不要放在腰上面。\n最後用跑步機 30 分鐘，速度 3，坡度 5 到 7。\n今天的心率感覺好像沒有那麼高，到後面坡度要調到 7 才能維持 130 左右的心跳。\n三樓趴姿腿勾。這跟坐姿做起來的感受度不太一樣。\n做三組，每組 10 下，三片槓片 30 公斤。最後一組最後兩下做起來有點吃力。\n哥本哈根側棒式兩組兩邊，每次 30 秒\n", "2026-02-02": "# 2026年2月2日星期一\n\n滾筒放背，滾筒放大腿前側，跟股中肌\n這兩天，我的背部不平衡感跟肋骨的緊繃感又跑出來了。\n熊抱槓深蹲：\n第一組70公斤，做了10下。感覺從第六下、第七下開始，核心就撐不太住了，這個重量可能太重了。\n第二組：50公斤，10下\n第三組：50公斤，10下\n第四組：50公斤，10下\n組間休息好像沒有控制得很好，今天做起來很吃力。心跳也蠻高的\n寬距反握滑輪下拉，32公斤共3組，1組10下\n窄距反握坐姿划船：\n32公斤，3組，1組10下\n繩索三頭：\n25公斤，3組，1組10下\n站姿提踵：\n32公斤\n1.第一組25下\n2.第二組25下\n3.第三組20下\n跑步機：\n1. 用走的 3 公里\n2. 坡度 5\n3. 心跳維持在 130 左右\n4. 20 分鐘\n", "2026-02-03": "# 2026年2月3日星期二\n\n今天的熱身\n跑步機走五分鐘速度 3 公里，坡度 5%\n動態熱身：弓箭步大迴旋，15 米兩趟\n滾筒放背，還有大腿前側\n第一項是後腳抬高蹲\n單手持重 10 公斤\n後四組，一組 10 下：\n1. 前面兩組：單手扶槓\n2. 後面兩組：靠自身平衡\n心肺的狀況應該有在恢復了，這次很明顯沒有像上次心肺那麼受不了。\n前面三組基本組間休息都小於 2 分鐘，只有最後一組 3 分鐘。\n3. 三樓 impulse 器械胸推：\n32公斤，四組，每組10下\n做這個胸推的時候，左手的肩關節會有一點怪怪的，不知道跟那個大迴旋的聲響有沒有關係。\n4. 三樓 Impulse 坐姿腿後勾：\n38 公斤，三組，每組 10 下\n最後一組的最後幾下，左腳膝蓋輕微的聲響又出現了，不過前面沒有。\n3 樓 Impulse 器械捲腹機：\n1. 第一組：38 公斤，10 下\n2. 第二組：38 公斤，10 下\n3. 第三組：32 公斤，10 下\nIn-Pose 肩推（坐姿）：\n1. 25 公斤，3 組，每組 10 下\n今天感覺三頭刺激又比較多一點，斜方比較沒有感覺，三角肌前束有感覺。\n右手的肘關節怪怪的，好像是因為三頭太緊了，按壓之後有好一點。\n負重棒式 10 公斤，三組，每組一分鐘\n跑步機用走的：\n1. 3 公里\n2. 坡度 5%\n3. 20 分鐘\n今天闊背的疲勞感比昨天練背還要明顯，是棒式的關係嗎？\n", "2026-02-04": "# 2026年2月4日星期三\n\n今天的熱身項目：\n1. 跑步機走 7分鐘\n2. 滾筒開背\n3. 大腿內側跟前側\n4. 按壓小腿\n5. 教練課內容：\n(a) 放鬆胸前側\n(b) 放鬆三角肌及肱三頭肌附近的肌肉\n(c) 使用筋膜球改善手臂彈響\n(d) 雙手扶在牆壁往上延伸（撐住彈力帶）再往下回到胸前\n不過因為阻力都集中在撐住彈力帶，所以背部的感覺沒那麼明顯\n(e) 做側棒式要加強較弱的那一邊\n(a) 身體要直，上半身要打直\n(b) 膝蓋呈 90 度，大腿、身體與膝蓋之間都要維持 90 度\n(c) 屁股不要夾，感受手穩穩地往地板推\n這樣應該是身體側面的肌群會有感受\n器械引體向上，放置重量要插在倒數第二片或第三片。\n操作重點如下：\n1. 保持手肘往下拉，感受大小圓肌的部分要有感受度。\n2. 往上拉的時候不要聳肩。\n3. 下到最底的時候，要感覺肩胛往上轉、往上延伸，但是不能鬆開。\n4. 做這個的時候，感覺到左右很不平衡：左邊力竭感已經出來了，右邊卻還沒什麼感受度\n，大拇指要出力握好。\n做坐姿肩推的動作時，拿 5 公斤的啞鈴，左手先。\n手肘要靠著身體，但不要用力夾，沿著身體旁邊往外、往上、往後方推，自然而然地手臂會往前轉，感受度應該要在大小圓肌。\n手肘如果開掉，就表示三角肌中束介入、沒力了\n做一個跪姿胸椎旋轉的動作（忘記叫什麼名字了），\n重量11或18公斤用繩索拉在胸口左右的高度，拿黑色的三角形握把，三個圓環都要扣上去。\n動作細節如下：\n1. 跪姿在地上訓練，對應腳在後，腳尖要撐著，前腳大約 90 度。\n2. 要感受肩膀跟骨盆，還有脊椎要正。\n3. 感覺往後拉的時候，應該是大圓肌、小圓肌跟前鋸肌，還有比較靠側面的闊背肌感受度會比較好一點。\n大拇指要出力握好。\n繩索二頭：\n1. 把繩索固定在最低的位置。\n2. 使用銀色金屬、中等寬度的桿子。\n3. 站的時候有點類似三頭的站法。\n4. 手肘要固定，不要一直動。\n5. 手腕維持角度，不要出力。\n6. 握在槓最兩側、靠外側的地方。\n7. 這個動作明顯比原來器械的感受度要好很多。\n今天做的訓練很明顯，都是左邊很快就沒力了，右邊比較有力。\n在進行分邊訓練的時候，要以左邊為優先，來決定右邊要練的容量。\n做重量的選擇時，如果加重之後做不了 10 下，剩下的次數可以減一格重量來補完\n今天的訓練做完，左手大迴旋的彈響明顯變小，但還是有。\n最後做 20 分鐘的跑步機，速度 3 公里，坡度 8，也是用走的，心率 130 左右。\n回家的路上發現整個左邊背部除了斜方肌都很緊繃 右邊像沒事發生\n", "2026-02-05": "# 2026年2月5日星期四\n\n今天的熱身是滾筒放鬆，包括：\n1.大腿前側\n2.大腿後側\n3.臀中肌\n4.開背\n還有推雪橇：\n1. 16公斤一趟\n2. 24公斤一趟\n第一個訓練是SSB槓（背槓深蹲），兩邊各放10公斤鋼片。空槓是不是30還是35公斤？我記不清楚了。做四組，每組十下。\n一樓 Panata 垂直腿推熱身組的時候，就發現左腳膝蓋內側的聲響又出現了。做了大腿前側與小腿的按壓之後，感覺還是有一點。\n正式組兩邊各 30 公斤槓片，共四組，每組 10 下。\n最後一組發現，下來的時候不要下到那麼低，好像就沒有聽到聲響了。\n今天第一次做腿推完感覺大腿後側是酸緊無力，而不是直接斷電的那種感覺。\n接下來做 Cable 三頭，做到一半才發現今天要做的是直臂下壓，不是 Cable 三頭。一不小心就多做了一組，變五組了\n第一組 38 公斤 10 下，後面四組 32 公斤 10 下。\n這次做的時候發現，上半身有沒有前傾、胸部有沒有往前挺，會很大地影響三頭的感受度。第一組就是因為身體沒有往前傾，胸部也沒有挺，所以三頭沒什麼感覺。\n直臂下拉，總共四組：\n1. 第一組：25 公斤\n2. 後面三組：18 公斤\n每組 10 下。今天完全找不到背的感覺，不知道為什麼後面左邊的斜方肌還跑出來幫忙\n最後做跑步機 20 分鐘。速度3 公里，坡度控制在 5 以下，並維持心跳在 130 左右。\n", "2026-02-06": "# 2026年2月6日星期五\n\n今天的放鬆包含以下項目：\n1. 滾筒：放鬆背部與開胸\n2. 槓鈴：放鬆斜方肌\n3. 動態訓練：推雪橇\n(a) 24 公斤，15 米，1 趟\n(b) 32 公斤，15 米，1 趟\n器械式蝴蝶機飛鳥夾胸（共 4 組）：\n(a) 前面兩組：32 公斤，一組 10 下，覺得有點太輕了\n(b) 後面兩組：加到 38 公斤，一組 10 下\n感覺胸部的張力感4. 器械式蝴蝶機飛鳥夾胸（共 4 組）：\n(a) 前面兩組：32 公斤，一組 10 下，覺得有點太輕了\n(b) 後面兩組：加到 38 公斤，一組 10 下\n感覺胸部的充血膨脹感沒有之前強，下次四組都直接做 38 公斤看看\n啞鈴臥推跟坐姿提踵機做超級組\n1. 啞鈴臥推：一手 12.5 公斤，共 3 組，每組 10 下\n今天胸部還是沒有什麼充血感。感覺姿勢跟發力的感覺是正常的，胸部還是有力竭感但就是充血感沒有之前來的強\n提踵小腿的充血感非常好\n一樓 Impulse 捲腹肌，正面的 10 公斤，4 組一組 10 下。好像下次可以加重量了。\n負重棒式：\n鋼片 10 公斤，3 組，每組 1 分鐘\n跑步機：\n1. 速度：3 公里\n2. 坡度：6 以下\n3. 心跳：控制在 130 左右\n4. 時間：20 分鐘\n", "2026-02-07": "# 2026年2月7日星期六\n\n今天的熱身動作是用滾筒放背、開胸，還有大腿前側、內側與臀中肌，以及用槓鈴放斜方肌。\n\n先做趴姿的胸椎活動度練習：\n\n1. 單手靠在地上，把頭放在前面的那隻手上\n\n做地板的槓鈴臥推，先躺在槓鈴槓下，眼睛對著槓。\n\n1. 預備動作：\n(a) 把屁股抬高，上半身往後塞\n(b) 肩膀位置基本不動，只動角度讓整個背可以拱起來\n(c) 腳略與肩同寬，往地板踩給身體支撐\n\n2. 握槓方式：\n(a) 雙手握住槓鈴外側的線，中指對準外側線握上去\n(b) 握法大約是「催油門」的角度，讓槓鈴可以靠在掌骨上\n\n3. 出槓與推行：\n(a) 出槓時要往外推直，一口氣將槓推直\n(b) 位置大約在胸的上方，也就是肩胛骨的正上方\n(c) 往下時不要夾肘，保持直上直下\n(d) 身體全程都要維持張力，手越往下時，胸部要越往前挺來與槓鈴抗衡\n(e) 腳要踩穩支撐\n(f) 如果感覺肩的參與度過高，可能就是胸塌了\n\n(g) 半身伏地挺身（跪姿）：\n1. 膝蓋併攏，後腳交叉且腳離地，僅剩膝蓋與手掌支撐。\n2. 手掌約 1.5 倍肩寬，位置大概在瑜伽墊外側。\n3. 上半身盡量往前，讓手掌的支撐點靠近胸部。\n4. 動作維持直下直上，感受會像是在做臥推，胸部的發力比例會比較高。\n\n5. 負重棒式的姿勢校正：\n(a) 平常在做負重棒式時，屁股可能會稍微往下垂。\n(b) 姿勢要稍微往上挺，讓整個背部可以維持水平。\n\n3. 最後做壺鈴的有氧：\n(a) 壺鈴放在雙腳中央，腿開約是深蹲的站距。\n(b) 雙手持壺鈴，手不要用力，自然擺盪。\n(c) 靠身體下蹲與往上挺的姿勢，讓壺鈴自然擺動。\n(d) 一組 20 下，重量 8 公斤。\n\n3. 伸展與恢復：\n教練說這幾天開始做「推雪橋」之後，胸椎活動度有比較好，要持續做。\n", "2026-02-09": "# 2026年2月9日星期一\n\n今天熱身用滾筒：\n1.開背\n2.開胸\n3.大腿前側\n4.臀中肌\n推雪橇：\n1. 35公斤\n2. 15米，共4趟（來回兩次）\n3.胸前抱槓深蹲60公斤四組，每組十下\n今天盡量控制上半身不要搖搖晃晃，重心確定好再往下蹲，好像有比較穩定一點。\n4.滑輪下拉：45公斤三組，每組10下\n最後一組的最後三、四下有點吃力\n坐姿划船：下次前兩組可以加個重量試試看。這次是38公斤，10下三組\n機械腿踢\n45公斤，三組10下\n下次可以做一組再加重量的試試看\n繩索三頭共三組：\n1.第一組：38公斤，10下\n2.後面兩組：32公斤，10下\n下次從32公斤開始就好，38公斤有點不太行。\n跑步機速度3公里，坡度3以下，時間20分鐘，心跳130左右\n", "2026-02-10": "# 2026年2月10日星期二\n\n今天热身用这个健身滚筒：開背、開胸、大腿前側、臀中肌。\n推雪橇：\n1.前兩趟（15米去回）：35公斤\n2.後面兩趟（去回）：39公斤\n3.後腳抬高蹲：四組\n(a)單手持啞鈴10公斤，每組10下\n(b)前面三組的前腳距離太後面，感覺都是股四頭肌在介入\n(c)最後一組前腳往前半步，後側就比較有感覺了\n3.胸部訓練：\n(a)器械臥推：4組，38公斤，每組10下\n(b)今天的胸肌充血感很好\n注意力要一直集中在胸肌上，維持胸部張力，不然手就會介入更多\n2.器械腿勾\n(a)第一組：45公斤，10下\n(b)後面兩組：38公斤，10下\n(c)今天左膝沒有聲響\n3.器械肩推：\n(a)全部都是32公斤\n(b)共三組，每組10下\n(c)今天右手肘關節一樣怪怪、卡卡的\n(d)用按摩球放鬆後好很多\n(e)下次可能要先放鬆三頭肌，再做肩推\n注意力不能一直放在手推 不然都是三頭比較多\n(f) Cable 二頭：三組，25 公斤（每組 10 下，三片就對了）\n跑步机用走的速度 3 公里，坡度 5 以下，维持心跳 130。20 分鐘\n", "2026-02-11": "# 2026年2月11日星期三\n\n今天熱身內容：\n1.滾筒放背、開胸、大腿前側\n教練課內容：\n1.靠桌子放鬆三頭肌和小手臂肌肉利用筋膜球\n2.用筋膜球放鬆臀中肌，位置類似使用滾筒放鬆的地方，靠自身體重去壓\n3.鴿式伸展：\n(a)前腳膝蓋盡量呈現90度，可以用手去調整\n(b)上半身不要駝背，要往前壓\n(c)應該要感覺到屁股有被拉長的感覺\n4.側棒式：\n(a)做側棒式時，將上面那一腳往上抬，不要靠在下面那腳上面\n(b)接著可以做髖屈與髖伸的練習\n(c)過程中應該要感覺到是屁股在用力\n3.坐羅馬椅感覺是要從腳後跟用力，然後大腿跟屁股一直往上帶。\n(a)靠著的時候，骨盆前面的骨頭不要靠在墊子上\n(b)往下的時候，應該要感覺到屁股有被拉伸\n不過今天因為會覺得膝蓋有被鎖死的感覺，所以暫時沒有做了。\n做壺鈴的硬舉，也可以感受到屁股拉伸。\n還有一個姿勢：雙腳打開，比平常深蹲的距離還要寬，大約是兩倍肩寬。接著膝蓋微彎，上半身往前做「髖屈」（Hip Hinge）。\n在這個動作中，你會感覺到大腿後側和屁股有緊繃感。維持這個姿勢，膝蓋想辦法往後用力，感覺屁股往天上、往天花板的方向延伸。過程中也可以用手去幫忙推大腿前側。\n這個是今天最有感覺、可以輕鬆拉到屁股的一個動作\n熊抱槓深蹲，蹲下去的時候要感覺屁股往後啟動。蹲下去之前，骨盆要稍微前傾，把屁股往上翹。\n上半身要有一個傾斜的角度，不能太直。\n感覺重心要在身體中間起槓的時候，用膝蓋把屁股往前帶。\n然後屁股一樣是往後翹，兩腳要併攏，起槓才會穩。肩膀要放鬆，不要聳肩。\n後腳抬高蹲跟熊抱槓深蹲類似的方式：\n1.站直的時候，屁股不要用力夾\n2.身體要往前腳側轉，強迫骨盆維持正面\n這個動作可能就會拉緊屁股，但是要記得不要夾。\n3.往下蹲的時候，上半身要有一個前傾角度，感覺是腿在踩，上半身不要主動往上晃\n这一次的练习虽然是空手，但是感觉屁股会酸，之前做的好像没有这么酸。\n三樓：站姿提踵，38公斤。\n四組，每組20下。\n跑步機用走的 3 公里。\n速度與坡度 5 以下，控制心跳在 130 左右。\n今天感覺比較累一點，不知道是不是練前只有喝乳清，沒有補碳水。\n", "2026-02-12": "# 2026年2月12日星期四\n\n今天熱身：\n1.滾筒放鬆背部\n2.開胸\n這兩天沒有睡好，精神不是很好，感覺有點累。今天先不練Day3\n地板槓鈴臥推，今天做四組，練習每組十下。\n1.前兩組30公斤\n2.後面兩組40公斤\n胸部有充血，但感覺不明顯，三頭肌介入的有點多。\n瑜珈墊跟我的衣服有點滑，往後擠的時候感覺會有一點滑掉。\n坐姿啞鈴肩推，做四組：\n1.一邊各四組\n2. 5公斤，10下\n機械飛鳥夾胸，共三組：\n1.前兩組：45公斤，10下\n2.第三組：45公斤，5下；38公斤，5下\n跑步機（走路）：\n1. 速度：3 公里\n2. 坡度：7 到 9\n3. 時間：20 分鐘\n4. 心跳：維持在 130 左右\n", "2026-02-13": "# 2026年2月13日星期五\n\n今天的熱身：\n1.用滾筒開胸、放鬆背部\n3.用筋膜球放鬆臀部\n4. SSB槓鈴深蹲：\n(a) 55公斤\n(b) 4組\n(c)每組10下\n只做了五下空槓的動態熱身，好像有點不太夠。今天沒有推雪橇\n上半身第一組做完之後有點不太舒服，不過後面好像有好一點。\n2.垂直腿推\n(a) 70公斤\n(b) 4組\n(c)每組10下\n今天左膝還有異響，好像跟行程也沒太大關係，不過異響好像有減輕一點。今天腿推做完，大腿後側很痠，不過屁股好像還好，是不是行程不夠深，所以屁股沒有刺激到？全程有想辦法把腰靠在墊子上，不過做完四組後，腰有一點點痠，但不會痛。\n最近腿練完，好像都沒有那種腿軟的感覺。\n今天感覺右腳明顯疲勞很多\n直臂下壓25公斤，共四組，每組十下。中間有試著加重，不過好像不太行，先維持25公斤就好。\n腿部伸展（Leg Extension）記錄：\n1.第一組：18公斤，10下\n2.第二組：23公斤，10下\n3.第三組：23公斤，10下\n23公斤做起來有點吃力，18公斤的感受度比較好。\n哥本哈根側棒式：兩組，30秒\n負重棒式：15公斤，4組，每組40秒\n跑步機：用走的\n1.速度：3公里\n2.坡度：5以下\n回到家才發現屁股很酸但是跟腳一樣右腳比較多\n", "2026-02-14": "# 2026年2月14日星期六\n\n今天的熱身滾筒項目：\n1.開胸\n2.放背\n3.放腿（前側、後側）\n4.屁股\n5.大腿內側\n推雪橇40公斤，4趟共60公尺\n以下是教練課內容：\n6.前鋸肌訓練\n動作要領如下：\n1.採趴姿趴在地上，雙腳成跪姿，上半身像做棒式一樣。\n2.用彈力繩撐住往外，重心要稍微靠前，過程中會感覺到前鋸肌在用力。\n感覺到呼吸時，胸背打開，不要聳肩。要用這種方式做棒式以及深蹲等等的。\n下一個動作是類似的動作，只是上半身改成趴姿，而不是用肘關節著地。\n針對右邊肩胛骨，右手壓住瑜伽磚做上面相同的動作，可以增加肩胛的活動度。\n做靠牆呼吸練習時，整個背都要貼在牆上，頭也要有意識地靠在牆上。\n下半身雙腳往前放並微蹲，上半身持重壺鈴4公斤，位置大概在胸口往前20公分處，一樣做胸腔擴張的呼吸練習，每次都要練習。\n熊抱槓深蹲，起槓前先讓重量落在手肘內側維持，肩膀放鬆。\n起槓時，屁股不要往前頂，膝蓋微彎，屁股稍微往後。往上時，只要腳往上踢，不要再想著用上半身把重量撐起來。\n往下蹲之前，先看一下自己的站距是否正確，不要站太窄。往下蹲之前，膝蓋應該要微彎，屁股稍微向後，不要靠著屁股往前頂來，向上支撐，屁股不要出力。\n要注意重心是在腳的中間，再往下蹲。\n​\n地板槓鈴臥推預備動作：\n往後擠時肩胛要有意識地用力，才不會被屁股擠走，也可以擠出比較大的胸椎角度。\n今天做到45公斤，每組6下。胸部的感覺還不錯，沒有太多三頭肌參與的感覺。\n要記得，除了胸部的張力要維持之外，雙腳踩地的張力也要一直維持，不能鬆掉。\n坐姿三頭訓練：\n1.坐在板凳上，把啞鈴放在肩上。\n2.雙手反握，將手肘夾緊。\n3.把啞鈴推到頭的上後方。\n4.將啞鈴往頭的後方放，然後再舉起來。\n5.下來時也要先放在肩上\n過程中要注意，肘關節不能打開，要感覺三頭肌在拉伸。\n要避免只有慣用手在用力，兩手要平均發力。\n以上教練課內容結束。\n站姿提踵，總計45公斤：\n1.四組\n2.每組20下\n跑步機（走）：\n1.速度：3公里\n2.坡度：12以下\n3.心跳：維持在130左右\n4.時間：20分鐘\n​\n", "2026-02-17": "# 2026年2月17日星期二\n\n今天的熱身滾筒：\n1.放背\n2.放大腿前側\n3.放大腿內側\n4.開胸\n板凳跪姿拉伸大腿前側\n雙腳半蹲放鬆後側\n5.壺鈴硬拉：24公斤，三組，每組10下\n6.熊抱槓深蹲：\n(a)四組，每組10下\n(b)第一組50公斤\n(c)後面三組60公斤\n(a) 45公斤\n(b)三組，每組10下\n(c)最後一組明顯比上週好\n3.坐姿划船：窄距反握：45公斤，三組，每組10下\n(a)今天感覺划船左邊的背比右邊的背要來的酸。\n三樓，坐姿踢腿機：52公斤，三組，每組10下\n1.後面兩組在頂峰停一秒，再慢慢放回來\n第一次做這個，做到會喘，心跳恢復得很快，但是要多喘一下。\nCable三頭：\n1.第一組：32公斤，10下\n2.第二組與第三組：25公斤，10下\n25公斤的感覺比較好，下次再降一格吧。\n三樓站姿提踵：45公斤，4組，每組10下\n這次做有一點點內八，想要加強小腿外側的肌肉。\n器械輔助引體向上：64公斤，3組\n1.前兩組：10下\n2.最後一組：8下\n3.補充筆記：左邊的背部應該是前鋸肌沒力了\n應該還有跑步機 走路 心跳130左右 30分鐘\n", "2026-02-18": "# 2026年2月18日星期三\n\n今天的熱身\n滾筒放大腿前側內側後側筋膜球放屁股\n膝蓋靠牆拉伸腳踝\n寬距微蹲放大腿後側\n壺鈴硬舉，32公斤三組每組10下\n後腳抬高蹲\n單手持12.5公斤啞鈴\n四組 每組十下\n地板槓鈴臥推\n4組\n第一組 40公斤6下\n2-3組 50公斤 8下\n第4組 50公斤 6下\n器械胸推\n第一組 38公斤 十下\n第2-3組 45公斤10下\n第四組 38公斤 10下\n今天兩個胸部動作\n肩膀代償有點多\n坐姿腿後勾\n共三組\n第1-2組 52公斤 十下\n這兩組忘記全程保持張力 到頂端時都放鬆了\n第三組 38公斤 10下\n器械肩推\n32公斤 三組 每組十下\nCable二頭 三組 25公斤 每組十下\n二頭感覺左邊出力比較多\n跑步機 用走的\n速度三公里\n波度六以內 30分鐘\n", "2026-02-20": "# 2026年2月20日星期五\n\n今天熱身：\n1.滾筒放鬆大腿前側\n2.放鬆背部與開胸\n3.筋膜球放鬆臀肌\n4.推雪橇：\n(a) 15公斤，兩趟共30米\n(b) 40公斤，兩趟共30米\n3.伸展運動：\n(a)腳踝碰牆趴姿\n(b)放臀肌雙腳交叉拉臀肌\n壺鈴硬拉32公斤，三組，每組10下\n注意髖屈主打，膝蓋不要往前太多\nSSB槓深蹲65公斤，四組，每組10下\n特別注意：髖屈，手要往上撐，讓槓落在斜方肌上面，而不是落在頸椎上。\n做到後面覺得腰也有一點痠，不過是正常的痠，沒有不適感。\n垂直腿推 80 公斤，四組，每組 10 下\n後面兩組的最後一到兩下，感覺頭很脹。\n左邊膝蓋只要有非常注意地把重心放在後面，不要讓股四頭肌的占比太高，那個輕微的聲響就會變得更輕。我有時候沒有注意，聲響就會比較明顯。\n今天做完垂直腿推，就覺得人有一點累了。\n感覺腿推好像心肺會先受不了，而不是腿先受不了了。\nCable 直臂下拉：\n1. 25 公斤\n2. 四組，每組 10 下\n繩索稍微拉開一點，不要靠太近，背部的感受度會好一點今天的感受度還不錯，但好像不適合再增加重量\n趴姿腿勾\n1. 第一組：18 公斤\n2. 第二、三組：23 公斤\n每組 10 下\n行程還是做得很不滿：\n往上勾得太高，大腿前側會騰空\n哥本哈根側棒式兩組，一組 30 秒\n這個不知道要怎麼加強度？是拉長時間，還是多做幾組？\n還是可以挑戰正常版的\n負重棒式：15 公斤，4 組，每組 40 秒\n最後一組最後一點時間會發抖\n不過，前三組的感覺下一次應該可以再加重了\n跑步機用走的三公里速度，坡度維持在0，心跳就維持在 130 左右 可能前面有點累了\n", "2026-02-23": "# 2026年2月23日星期一\n\n今天的熱身：\n\n1.滾筒\n(a)放鬆背部與開胸\n(b)放鬆大腿前側、內側\n2.筋膜球：放鬆臀部與腹股溝\n3.壺鈴硬拉：32 公斤，每組 10 下，共 3 組\n4.膝蓋靠牆：做踝關節活動度伸展\n5.推雪橇：\n(a) 15公斤，兩趟共 30 米\n(b) 39公斤，兩趟共 30 米\n\n熊抱槓深蹲\n(a) 60公斤\n(b) 4組，每組 10 下\n現在感覺都是心肺跟核心有點跟不上，腿的刺激越來越少了\n不過從上週練完開始，髖部就有一點痠痛，大概是正面到外側中間 45 度的深處。\n上週五練完後，休了兩天，到今天還沒有完全好。\n今天練完之後，又變得更酸了。\n\n滑輪下拉：\n1. 45公斤\n2.三組\n3.每組 10 下\n4.做慢離心\n做完會喘，心跳也有 150 幾，不過很快就恢復了\n\n坐姿划船，45 公斤，三組，每組 10 下\n做慢離心。\n手握著的地方會有點不舒服感覺血液不循環\n\n坐姿踢腿機，三組：\n1.第一組：59 公斤，10 下\n\nCable三頭：\n1.三組\n2. 25公斤\n3.每組 10 下\n這個重量的感受度又來得好很多，比前幾次好。\n但是三頭沒有之前一開始練的腫脹刺激的感覺\n\n本來還要做引體跟提踵，不過今天覺得有點累，就先到這裡。\n\n跑步機用走的，時速 3 公里，坡度 9 以下，控制心跳在 130 左右，時間 30 分鐘。\n", "2026-02-24": "# 2026年2月24日星期二\n\n今天熱身：\n1. 滾筒放背\n2. 開胸\n3. 筋膜球放屁股\n1. 壺鈴硬拉：32 公斤，兩組，每組 10 下\n2. 推雪橇：40 公斤，兩趟，共 30 米\n3. 單腳跪姿前挺拉伸股四頭肌\n3. 後腳抬高蹲：單手持啞鈴 15 公斤，4 組，每組 10 下\n今天試著把後面那隻腳稍微張開一點，不要靠身體那麼近，好像有比較穩，沒有之前晃得那麼嚴重。\n器械胸推：\n1. 四組\n2. 前兩組 52 公斤，每組 10 下\n3. 後兩組 45 公斤，每組 10 下\n今天胸推做完，覺得肩膀不太舒服，有點酸軟的感覺，所以沒有再做肩推。\n坐姿後勾，共三組：\n1. 第一組：52 公斤，10 下（有點難控制）\n2. 後面兩組：45 公斤，10 下（勉強還能控制）\n下次可以再嘗試一樣的重量組合看看或是從 45 公斤開始\n今天忘記放鬆小腿，左膝的那個聲音、卡卡感會有一點跑出來。\n坐姿外展機：45 公斤，3 組，每組 10 下。\n三樓InPulse 捲腹機：32 公斤，3 組，每組 10 下\nCable 二頭：25 公斤，10 下，3 組\n跑步機 用走的 速度3公里 坡度9以下 心跳130左右\n", "2026-02-25": "# 2026年2月25日星期三\n\n今天的熱身：\n1. 滾筒：放背、開胸\n2. 筋膜球：放屁股跟大腿前側\n3. 伸展：膝蓋靠牆伸展\n4. 推雪橇：40 公斤，兩趟共 30 米\n今天的教練課內容：\n1. 單腳 RDL\n(a) 用單腳足弓、大拇指球跟小指的部位踩在斜板墊子上\n(b) 五隻腳趾張開並抓牢地板，不要翹起來\n(c) 腳後跟靠牆做單腳 RDL，感覺用腳往上推\n(d) 抬起來的那隻腳要稍微往右轉，要靠腹股溝（骨頭）轉，不能只是靠身體或腰轉\n今天做的應該是退階版雙手扶在牆上\n7. 後腳抬高蹲\n(a) 重點是像剛剛一樣，腳趾要緊緊抓著地板，不要彎來彎去，這樣踩起來才會穩\n(b) 骨盆要往前側腳的方向轉，不要只是轉腰，這樣臀部才會有拉伸感，發力感會更好，腰也不會痠\n(c) 體感的感覺是身體會有一點向著前側腳那一面的方向\n3. 今天這樣做後腳抬高蹲，基本上不單手持啞鈴，可以不用扶就能做完\n熊抱槓深蹲跟剛剛一樣，腳趾頭要用力抓著地板，這樣重心會更穩。\n往上的時候，要感覺是用腳往上踩，不要想著用上半身往上帶，這樣腰才不會不舒服。\n最後一個動作是槓鈴的 RDL。把保護槓架在重訓架約一號的高度，將槓鈴放在上面。\n起槓姿勢\n1. 小腿靠在槓鈴上，然後髖屈啟動\n2. 眼睛要看向前方，不要低頭（低頭會影響胸椎，導致上半身塌掉）\n3. 上半身要放鬆，不要靠上半身去拉槓鈴，而是靠腳往上蹬\n身體到挺直就好，不要把肚子往前推，否則身體會往後傾。\n會感覺大腿後側非常的緊。這個動作可以拿來做每天的熱身動作，從 30 公斤開始。\n最後做跑步機，用走的速度 3 公里，坡度 9 以下，維持心跳 130 左右，持續 40 分鐘。\n", "2026-02-26": "# 2026年2月26日星期四\n\n過兩天要抽血，今天只有過來用跑步機走路。\n訓練菜單如下：\n1. 速度：3.5 公里\n2. 坡度：7 左右\n3. 心跳控制：130\n4. 時間：1 小時\n", "2026-02-28": "# 2026年2月28日星期六\n\n今天提早去抽血，下午來補這週的 Day 3\n今天熱身：\n1.滾筒：放背開胸、放大腿前側\n2.筋膜球：放屁股（不是筋膜槍）\n3.推雪橇：40公斤，兩趟，共30米\n4.分腿跪姿：拉伸大腿前側\nSSB背杠深蹲：\n1. 75公斤：兩組，每組10下\n2. 65公斤：兩組，每組10下\n發現每一組到最後兩三個，都會有一點上不來的感覺，就會想要用上半身代償，就是下去後剛要上來的那個地方。前面七八個都能維持正常姿勢，但是後面兩三個姿勢就跑掉了。所以今天腰也有點痠。下次先從 65開始。\n一樓垂直腿推四組：\n1.前三組：80公斤，10下\n2.最後一組：85公斤，10下\n現在比較大的瓶頸都是卡在心肺了\n直臂下拉 25 公斤：\n4 組，每組 10 下\n坐姿內收肌機45 公斤：\n3 組，每組 10 下\n參加四點的戰鬥有氧後，膝蓋內側靠近小腿的地方有點痛\n使用跑步機走 10 分鐘，速度 3 公里，坡度 0，做緩和運動。\n", "2026-03-02": "# 2026年3月2日星期一\n\n今天感冒了，加上上禮拜六的膝蓋痛還沒好，所以今天只做一些動作練習：\n1. 熱身\n2. 滾筒\n3. 放背\n4. 開胸\n(a) 找不太到感覺\n(b) 覺得槓鈴一到膝蓋位置，腳後側就非常緊繃\n(c) 再放下去就腰痠\n3. 地板槓鈴臥推：50公斤，三組，每組10下\n4. 跑步機：\n(a) 用走的方式\n(b) 速度 4 公里\n(c) 坡度 3\n(d) 時間 40 分鐘\n(e) 心跳維持在 128 左右\n今天在用跑步機的時候，覺得小手臂有點痠，不知道是前面哪一項影響的。\n", "2026-03-03": "# 2026年3月3日星期二\n\n感冒還沒好，沒什麼力\n來活動一下\n今天的熱身\n1.滾筒放背、開胸\n2.推雪橇40公斤，兩趟共30米\n推雪橇的時候，覺得今天的雪橇好沉重。\n滑輪下拉共 4 組：\n1. 前兩組 36 公斤，10 下\n2. 後兩組 45 公斤，10 下\n3. 走步機：\n時速 4 公里，坡度 4 左右\n控制心跳不超過 130\n時間 50 分鐘\n這兩天走完跑步機後，都有一點輕飄飄的感覺。\n膝蓋右膝內側的不適感，今天有再好一點，感覺應該再休息個兩三天會好。\n", "2026-03-10": "# 2026年3月10日星期二\n\n今天的熱身：\n1.滾筒放鬆背跟開胸\n2.筋膜球放鬆屁股\n3.推雪橇40公斤（兩趟共30米）\n4.熊抱槓深蹲：\n(a)第一組：40公斤\n(b)第二到第四組：50公斤\n(c)每組10下\n今天感覺跟上次感冒痊癒後一樣，開始爆心跳了，而且心跳恢復也比較慢一點。做到第四組，最後結束心跳接近170\n今天試著髖往後啟動，但是上半身不要太過於前傾。\n這個角度感覺這樣股四頭參與的比原來稍微多一些，腳的重心也算穩定，好像少了一個往前的剪力。不知道這樣的姿勢對不對，不過今天忘記錄影了。\n1. 滑輪下拉：3 組，45 公斤，每組 10 下\n2. 坐姿划船：3 組，45 公斤，每組 10 下\n充分休息過後，這兩個練背的感覺比之前拉起來輕鬆，下次可以試著做一兩組再加重。\n坐姿腿踢三組：\n1. 前面兩組 52 公斤，各 10 下\n2. 最後一組 59 公斤，10 下\n腿的部分也是一樣，覺得踢起來比之前輕鬆。\nCable 三頭：\n三組，前兩組 25 公斤 10 下，第三組 32 公斤 10 下。\n跑步機用走的速度 4 公里，坡度 0，心跳大概在 130 左右，不過一個不小心就會往上移。時間 30 分鐘。\n今天一開始，推雪橇跟熊抱槓深蹲時感覺特別累心肺，有點受不了。\n後面的項目就還好，大致上正常\n", "2026-03-11": "# 2026年3月11日星期三\n\n今天的熱身：\n1.滾筒（放鬆背部與開胸）\n2.推雪橇：40 公斤，兩趟共 30 米\n3.壺鈴擺盪：12 公斤，一組 20 下，做 3 組\n\n今天教練課內容：\n\n之前有做過的一個動作：\n1. 單腳腳跟離地，踩在小斜板上\n2. 雙手扶牆，後腳往後朝天，前腳微彎\n3. 往上蹬時，後腳往前、向上，並且骨盆往內旋轉，再返回\n\n1. RDL\n(a)重量在 30 公斤左右\n(b)出槓時還有起來的時候要注意，上半身不要想要去把槓拉起來，要用腿往上蹬\n(a)屁股不要往前，只有腳往上踩\n(b)往下的時候，膝蓋微彎，身體前傾多一點就可以過膝蓋了\n(c)呼吸要撐住核心，才不會因為核心鬆掉而產生代償\n\n4.後腳抬高蹲\n(a)用坐姿測量腿的站距，這個站距會比日常做的後腳抬高蹲還要來得長一些，會感受到腿後側在用力\n(b)身體直直向下，後腳靠在墊子上的中心點\n(c)比例也會比較高，比之前做的方式高\n(d)做完後腳確實蠻有感覺，但腰有點酸\n\n3.呼吸調整\n(a)做上半身靠牆的呼吸時，要確保肋骨擴張\n(b)肩部跟肚子不要收縮，確保力量不要往肩上去，或是往肚子\n\n3.呼吸調整與 90-90 呼吸法：\n(a)躺在地上，讓上半身貼地，髖部與膝蓋皆呈 90 度彎曲。\n(b)雙腳踩在牆上，膝蓋中間夾著墊子，並保持膝蓋與身體同寬。\n(c)腳對著牆踩，感覺像是腿部在用力，但注意不要讓骨盆跑掉。\n(d)過程中上半身要持續貼著地板，特別是腰部的地方，不能讓手伸進去（保持平貼）。\n(e)進行呼吸練習時，全程都要把核心撐住。\n\n跑步機用走的：\n1.速度：4 公里\n2.坡度：3\n3.時間：30 分鐘\n4.心跳：130 左右\n", "2026-03-12": "# 2026年3月12日星期四\n\n今天的熱身：\n1.滾筒放鬆背部、開胸\n2.放鬆大腿前側\n3.推雪橇：\n(a) 44公斤：兩趟，共30米\n(b) 48公斤：兩趟，共30米\n4. 90/90呼吸：\n(a) 5組，每組10次\n(b)多做了兩組找一下感覺\n(c)做完感覺核心有點酸\n(d)飛鳥夾胸三組：\n1.前面兩組：45公斤，10下\n2.第三組：38公斤，10下最後幾下行程變短了，夾不到中間而且胸部有一種塌掉的感覺，撐不起來。\n站姿提踵機：\n1.第一組：59公斤，10下\n2.第二組：79公斤，10下\n3.第三組：100公斤，10下\n4.第四組：120公斤，10下\n5.第五組：120公斤，10下\n感覺這個重量已經快要到上半身的極限了，小腿還是沒辦法10下力竭\n機械胸推共4組：\n1.前面兩組45公斤，10下\n2.後面兩組38公斤，10下\n今天胸的發力感非常好。\n機械肩推32公斤：\n1.三組，每組10下\n3.前面兩組肩的發力感還不錯\n但就是右手肘關節還是有點卡卡的，要一直放鬆三頭才能改善，但還是無法完全消除卡卡的感覺\nCable二頭：25公斤，三組，每組10下\n下拉的時候覺得發力感好像沒有特別好，不過三組做完，二頭確實有充血、力竭的感覺。\n跑步機用走的，時速 4 公里、坡度 3 左右，控制心跳在 130 左右，持續 30 分鐘。\n", "2026-03-13": "今天的熱身：\n1. 滾筒放鬆、開胸\n2. 推雪橇：48 公斤，兩趟共 30 米\n3. 90-90 呼吸：三組，每組 10 次\n\n4. SSB Bar 深蹲：4 組，55 公斤，每組 10 下\n   (a) 第一組：採用「髖啟動」，上半身較沒有向前傾斜\n   (b) 後面三組：上半身稍微向前傾斜的姿勢\n   (c) 試著把 90-90 呼吸拿來做深蹲，還不太習慣，做起來卡卡的。\n   做完後腰有點疲勞，不過比之前少一些。\n\n垂直腿推：80 公斤，四組，每組 10 下\n   第一組之前先推了兩下 90 公斤。\n   發現在頂端停留一兩秒，不要太快往下，心肺跟燃燒感比較不會那麼受不了。\n   左膝內側一樣有輕微軟組織彈響。今天做完，有久違的腿軟感。\n\n趴式腿勾三組：\n   前面兩組：23 公斤，10 下\n   第三組：18 公斤，10 下（最後三下做不太完）\n\n直臂下壓：\n   前兩組：32 公斤，10 下\n   第三組：32 公斤 6 下，接 25 公斤 4 下\n   第四組：25 公斤，10 下，最後 3、4 下拉不太動\n   整體背闊肌的發力感還不錯。\n\n坐姿外展肌：52 公斤，三組，每組 10 下\n   應該下次可以再加重。\n\n哥本哈根側棒式：兩組，每組 30 秒\n\n跑步機用走的速度 4 公里，坡度 0。\n前面 15 分鐘心跳在 135 上下，後面 15 分鐘在 130 上下。", "2026-03-14": "今天的熱身：\n1. 滾筒放背、開胸\n2. 槓鈴放斜方\n3. 筋膜球放臀肌\n4. 90-90 呼吸：三組，十次\n   做 90-90 呼吸時，會有一點不知道骨盆正確的位置在哪裡；股四頭肌有點用力但不知道怎麼放鬆。\n\n地板槓鈴臥推（正式組）：\n   1. 50 公斤，10 下兩組\n   2. 45 公斤，10 下兩組\n   胸的發力感還可以，全程基本上胸可以往上挺著，沒有塌掉。\n   不過三頭做完之後還是有點痠。\n\n負重棒式：四組 15 公斤，每組 40 秒\n   前三組蠻抖的，最後一組雙腳稍微張開與肩同寬，就沒有那麼抖了。\n   今天心肺刺激比之前小很多，不會一直有要加速換氣的感覺。\n\n機械坐姿提踵：40 公斤，三組，每組 10 下\n   這個重量好像也沒辦法讓小腿 10 下力竭；重量壓著大腿不是很舒服。\n\n以下是教練課內容：\n1. 單腳踩在斜板上扶牆的單腳 RDL\n   腳趾要張開抓地，後腳往天花板頂，前腳微蹲。\n   用前腳用力蹬，後腳往前往上帶，再做髖內轉。\n\n2. 趴姿腿後側拉伸（跪姿進入，骨盆後傾把屁股向上頂，膝蓋離地往後撐直）\n   腿後側會覺得非常用力拉伸，維持 20 秒，這個姿勢會覺得非常喘。\n\n3. 六角槓硬拉（動作學習）\n   由髖主導到膝蓋平行時再一起往下；膝蓋微微往前，雙手輕輕提著槓不要用力抓。\n   眼睛要平視，脖子不能往下，不然胸口會塌掉。\n   拉起來時要感覺是腿往上踩，大腿後側感受最強烈，前側跟臀部也要有感，避免變成深蹲蹲姿。\n\n4. 趴姿腿勾姿勢校正：上半身胸椎以上撐起來，頭要平視，配合 90-90 呼吸。\n5. 坐姿腿勾姿勢矯正：啟動時只有大腿後側往下，避免股四頭肌撐墊子產生槓桿代償；\n   感受要集中在靠近臀部的大腿後側而非膝蓋附近。\n\n教練課後做跑步機，用走的速度 4 公里、坡度 3，心跳在 130 左右，持續 30 分鐘。", "2026-03-16": "今天的熱身\n1. 熱身：滾筒放鬆背、開胸。\n2. 趴姿屁股朝天拉腿後：3 組，每組 20 秒。\n3. 90/90 呼吸：躺姿，3 組，每組 10 次呼吸。\n\n熊抱槓深蹲，4組。每組10下，45公斤。\n前面還有一個熱身組，60公斤，4下。\n盡量避免上半身用力把身體帶起來，注意要用腳踩。\n後面兩組做完，心率飆到 170 左右，不過很快就回去了。\n\n滑輪下拉，熱身組，59公斤，2下。\n覺得屁股有點坐不住會離開凳子，要把大腿塞進去頂住。\n正式組，3組：前面兩組 54公斤 10下，第三組 45公斤 10下。\n\n坐姿划船熱身組，59公斤，2下。\n1組 54公斤 10下，後面兩組 45公斤 10下。\n後面兩組的最後一兩下都有點做不完的感覺。\n\n坐姿踢腿機，熱身 72公斤 2下，正式 59公斤，3組每組10下。\n坐起來感受還可以，算適中。\n\n繩索三頭下拉，共3組。\n第一組 32公斤 10下，後面兩組 25公斤 10下。\n今天感受非常好。\n\n跑步機：時速 4 公里，坡度 0，控制心跳在 130 左右，時間 30 分鐘。", "2026-03-17": "熱身\n滾筒開胸。俯身後腳交叉拉伸臀肌。俯身跪姿屁股朝天向後挺拉伸大腿後側：3組每組20秒。90/90呼吸：3組每組10次。\n\n今天體力狀況不好，跳過後腳抬高蹲，改禮拜四或五再做。\n\n機械胸推：45kg×10×1，52kg×10×2，45kg×10×1。\n感受：胸的感覺還可以；第一組覺得有點輕所以加重；除了胸之外三頭也蠻痠的。\n\n機械肩推：32kg×10×2，25kg×10×2。\n感受：今天感覺三頭比肩多；右手肘關節沒有之前的不適感跟異響。\n\n坐姿腿後勾：32kg×10×2，25kg×10×2。\n感受：上次教練調整動作不要靠槓桿代償後，現在大概只能做這個重量，再上去勾不動了。\n\nCable 二頭：25kg×10×3。\n\n跑步機：時速4公里，坡度2，心跳130上下。", "2026-03-18": "今天的熱身：\n滾筒放背、開胸、放大腿前側。趴姿雙腳交叉拉伸臀肌。趴姿屁股朝天往後頂拉伸腿後側（3組×20秒）。90-90呼吸（3組×10次）。\n\n教練課內容：\n四足呼吸：趴姿膝蓋跪地，吸氣感覺肋骨撐開，吐氣脊椎放鬆，3組。\n\n地板槓鈴臥推：今天主要姿勢校正，確保胸口不塌，全身持續用力。推到55-60kg時前半段推不上去，可能三頭沒力。\n\n槓鈴伏地挺身：保護槓在高度8，雙手握槓與肩同寬實握，後腳腳尖著地腳跟離地，下去感覺胸碰到槓再起，位置在下胸，頭不往下掉。胸肌有拉伸感。\n\nCable 三頭動作校正：上半身前傾角度要再多，全身繃緊尤其軀幹，脖子不塌往前看，肩胛骨全程穩定。\n\nCable 二頭動作矯正：上半身微微後傾對抗Cable；挺胸胸部往後撐；全身軀幹挺直不含胸；頭往上撐。做起來會喘很累，感受度很好。\n\n教練課後：\n坐姿腿後勾：32kg×10×2，25kg×10×1。還不太習慣，小腿有點痠，後側感受度好。\n坐姿內收機：52kg×10×1，45kg×10×2。\n跑步機：時速4公里，坡度2.2，25分鐘。", "2026-03-19": "今天的熱身：\n1. 滾筒放鬆背部\n2. 滾筒開胸\n3. 滾筒放大腿前側\n4. 後腳交叉趴姿，拉伸臀肌\n5. 趴姿跪姿（屁股朝天）伸展，拉伸臀肌（三組，每組 20 秒）\n6. 90/90 呼吸（三組，每組 10 次）\n7. 前後站距較長的後腳抬高蹲，雙手各握 7.5 公斤啞鈴，四組每組 10 下，今天的心肺感覺比之前好一些，但最後一組還是很喘\n\nRDL 動作練習：40 公斤三組，每組 6 下\n\n六角槓硬拉動作練習：49.2 公斤三組，每組 6 下，感覺刺激沒有上次上課那麼強，不知道是次數不夠還是姿勢不對\n\n坐姿提踵：40 公斤，每組 10 下，共 4 組，一個不小心，腳趾一用力抓地，就會變成足弓在施力\n\n跑步機：速度 4 公里，坡度 3，時間 30 分鐘，心跳維持在 130 以內", "2026-03-20": "熱身：滾筒放鬆背部、開胸、大腿前側。趴姿後腳交叉拉伸臀肌。趴跪姿屁股朝天拉伸臀肌 3組每組20秒。90/90呼吸 3組每組10次。\n\nSSB 深蹲：熱身組 70kg×2，正式組 55kg×10×3（少做一組，有點沒力，盡量不讓上半身主導往上）\n\n垂直腿推：熱身組 90kg×2，正式組 80kg×10×4。今天座椅躺正，頂端停留1-2秒再下來，大腿前後側刺激好很多，做完超喘腿軟。屁股黏在靠墊上但腰還是有點痠。行程從5加到4。\n\nCable直臂下拉（與Cable三頭超級組）：32kg×10×2，第三組 32kg×4接25kg×6，第四組 25kg×10（分兩次做完）。蠻喘的。\n\nCable三頭 25kg×10×3（第三組分兩次做）。繃緊全身三頭感覺好非常多。與直臂下拉超級組。\n\n趴姿腿勾：23kg×10、18kg×10×2。每組第7下開始勾不太起來開始代償，做完腿後側非常痠。\n\n哥本哈根側棒式：40秒×2組。用Eleiko凳子高度不同，前10-20秒上面腿內側就很痠，40秒勉強撐過。\n\n跑步機：時速3km 坡度0 舒緩20分鐘 心跳130", "2026-03-21": "今天的熱身：\n1. 滾筒放鬆背\n2. 滾筒開胸\n3. 後腳交叉趴姿拉伸臀大肌\n4. 俯身跪姿（屁股往前、往天上蹬）拉伸臀肌，三組每組 20 秒\n90-90 呼吸，五組每組 10 次\n\n教練課：\n臀肌放鬆動作修正：兩腳膝蓋都要跪地，腳尖蹬地，撐地的手離身體近一點，遠端手往前拉伸並往耳朵靠攏，臀肌跟後背同時被拉伸。\n\n類似側棒式的髖屈與髖伸：手肘朝地，膝蓋彎曲 45 度，屁股往上蹬，上方的腳保持騰空。做髖屈跟髖伸，髖伸時除了往前還要往上。啟動靠地板側臀肌，感受度強，左側比較沒力。\n\n飛機（髖部旋轉）：先做單腳 RDL，做骨盆內轉（右後腳膝蓋收到前腳膝蓋後方），前腳膝蓋微微前蹲，內轉後再往外做「小狗尿尿」姿勢，訓練髖關節內外轉活動度。\n\nRDL 動作要點：大拇指握緊避免出力不均；上半身放鬆下垂讓側邊肌肉支撐；槓鈴過膝蓋膝蓋才微微往前；感受上半身盡可能垂直地面再往上拉。今天臀肌感受比較好，大腿後側沒那麼緊繃。\n\n器械腿踢：走勢跟腿勾相同，容易用大腿後側槓桿代償，需改進。做法：往上踢時大腿後側有浮起感，不要用力下沉。40幾公斤就覺得踢起來挺酸。腿踢要放慢速度，感受大腿燃燒感，不要用爆發力。\n\n垂直腿推身體歪一邊的感覺：可能是雙腳兩邊活動度不一樣造成，教練說沒什麼好擔心的。\n\n教練課後自主訓練：\n地板槓鈴臥推 55 公斤三組：第一組 6 下，第二組 10 下，第三組 8 下。感覺要繃住全身，腰、腿、手全部都要用力，這樣 55 公斤可以做完 8-10 下。", "2026-03-23": "熱身：滾筒放鬆背部、開胸、大腿前側。\n\n滑輪下拉四組：熱身 36kg×10，52kg×10×2，45kg×10×2。\n\n坐姿踢腿機四組：38kg×10×2，45kg×10×2。腿後不用力靠著椅子，有浮起感，股四頭感受落在較中間位置，沒那麼靠近膝蓋。下次一樣從38kg開始找感覺。\n\n坐姿划船三組：52kg×10×2，45kg×10。有點吃力。\n\nCable二頭 25kg×10×3。上半身微微往後撐住，全身繃緊挺胸，二頭感覺很好。\n\n跑步機：時速3km 坡度6 心跳130 15分鐘（趕時間）", "2026-03-24": "熱身：滾筒放鬆背部、開胸。趴姿後腳交叉拉伸臀肌。跪趴姿屁股頂天拉伸臀肌 3組每組20秒。90-90呼吸 3組每組10次。\n\n熊抱槓深蹲：45kg×10×4組。\n飛機式髖關節內外轉：3組每組10次。\n側棒式髖屈髖伸：2組每組10次。\n\n器械胸推：45kg×10×4組，今天肩的參與有點多。\n\n機械腿踢：32kg×10×2組，38kg×10×2組。", "2026-03-25": "熱身：滾筒放鬆背部、大腿前側、大腿內側。趴姿後腳交叉拉伸臀肌與背闊肌。趴跪姿屁股朝天拉伸腿後側 3組每組20秒。90/90呼吸 3組每組10次。\n\n教練課：\n深蹲注意力放在腳下重心，感受像腿推推地板；蹲下去要上來瞬間會軟掉導致用上半身。\n\n風車跪姿退階版：前腳站立後腳跪姿90/90度，前腳側手往上撐（可拿4kg壺鈴）往天花板推不聳肩，後腳側手沿大腿往下拉伸到極限後往前轉，上面的手持續往上推。\n\n完整版槓鈴臥推（板凳）：\n- 預備位置下巴對到槓，腳踩遠一點感覺往頭方向推維持胸口拱形\n- 握槓接近90度讓槓撐在骨頭上不壓手腕\n- 往下不夾手肘平平往下再往上，身體出力對抗不可鬆掉\n- 槓放到胸部下方輕觸不借彈力直接上推\n- 安全：躺平時槓不壓身上，只有胸口挺起時才碰到\n- 比賽槓插銷跟櫃檯借（6個）\n\n教練課後：\n坐姿腿後勾 32kg×10×3組。\nCable三頭 25kg×10×3組，感覺變輕鬆了，下次可以做一組加重試試看。\n跑步機：時速3km 坡度8 20分鐘 心跳120", "2026-03-26": "熱身：滾筒放鬆背部、開胸。趴姿後腳交叉拉伸。趴姿屁股朝天拉伸腿後側 3組每組20秒。90-90呼吸 3組每組10次。\n\nRDL 動作練習：30kg×6×2組，40kg×6×4組，50kg×6×1組。\nRDL 持槓練習：70kg 30秒×2組。\n\n坐姿提踵：40kg×10×3組。\n趴姿腿勾：18kg×10×3組，很辛苦，可能是RDL的關係。左膝內側輕微彈響仍有。\n哥本哈根側棒式：用Eleiko凳子，40秒×2組。紅色矮凳沒感覺，Eleiko才有感。\n跑步機：時速3km 坡度8 心跳130 20分鐘", "2026-03-27": "熱身：滾筒放鬆背、開胸。昨天RDL持槓練習讓今天胸背很緊繃，開胸時拉不太開。\n\n板凳槓鈴臥推：30kg×6×1組，35kg×10×4組。前面肌肉沒拉伸開感覺下不去，肩膀佔比多，後面比較好。\n\n器械輔助引體向上：負64kg×10×3組。做完三頭跟背有感覺，但跟教練課要感受大小圓肌的位置不太一樣，比較靠中間中下。\n\nCable二頭：25kg×10×3組。糾正動作後繃緊全身，全身累到冒冷汗。\n\n跑步機：時速3km 坡度9以下 心跳130 20分鐘", "2026-03-28": "熱身：滾筒放鬆背部、開胸。禮拜四70kg硬舉練習讓胸背仍緊繃。趴姿後腳交叉拉 3組每組20秒。90/90呼吸 3組每組10次。\n\n教練課：\n四足跪姿單腳髖部旋轉：單腳舉起做往外→往前→再往外的迴旋動作。\n\nSSB深蹲動作調整：\n- 出槓採四足呼吸姿勢脊椎挺直，垂直往上站直出槓，穩定後再退\n- 下蹲前先做「預髖屈」（約五分之一角度），維持角度下去上來\n- 腳掌三個點重心平穩踩地不往後偏\n- 踩上來不放掉張力\n- 不要害怕身體往前傾的剪力\n- 今天60kg×7×3-4組，腳的感覺蠻多\n\n分腿蹲走路：雙手各持5kg啞鈴，穩定後下蹲踩上來，感覺腳推地板。\n背闊肌下緣較難有感覺，教練說坐姿划船時再感受。\n\n教練課後：飛機式 5kg啞鈴×10×3組。腳踏車轉速55阻力5 20分鐘 心跳125", "2026-03-31": "# 2026年3月31日星期二\n\n今天感覺狀況沒有很好，熱身的部分直接用器械的小重量做熱身。\n\n滑輪下拉：45 公斤，每組 10 下，共 4 組\n\n坐姿划船：45 公斤，4 組，每組 10 下\n\n今天兩個拉的動作，有時候拉到一半左手腕會覺得卡卡的，停下來活動一下就正常了。\n\nCable 二頭：\n1. 三組\n2. 25 公斤\n3. 每組 10 下\n\n累了，今天就到這裡休息。\n", "2026-04-01": "# 2026年4月1日星期三\n\n今天的熱身：\n\n1. 滾筒放鬆背部\n2. 滾筒開胸\n3. 趴姿雙腿交叉拉伸\n4. 臀肌和背闊肌\n\n以下是教練課內容：\n\n1. 箱式側向的髖屈髖伸\n這項做完屁股會非常地痠。\n\n2. 注意事項\n在做髖伸的時候，雖然是往前往上，可是骨盆不能跟著開掉。\n\n3. 後腳抬高蹲\n(a) 往下的時候，要感覺像在做 RDL（羅馬尼亞硬舉）一樣髖屈。\n(b) 注意不要壓在前腳的膝蓋或大腿前側，重心要往後面去。\n(c) 下蹲時會感覺後腳的大腿前側被拉伸。\n(d) 前腳的足底三個重心應該要踩穩。\n(e) 往下蹲的時候要控制膝蓋，不要往外開。(f) 還是要一直注意骨盆的方向，要往前腳那邊轉。\n\n(g) 上半身保持挺直。\n(h) 啞鈴要握穩，上半身要放鬆。\n\n(i) 因為大腿前側接觸比較多，特別是膝蓋部位，所以在做內側滾動放鬆時，要特別滾到靠近膝蓋前側的位置。\n\n(j) 加強動作：\n將腳踝向上抬再放下，重複這個動作。做這個姿勢時，要感覺大腿是放鬆的。\n\n(k) 如果用狼牙棒無法放鬆，可以改用一般的泡沫滾筒。\n\n接著，因為在進行 90/90 呼吸時，大腿前側的張力一直跑出來，所以接下來如果要練習，建議先做站姿負重的 90/90 呼吸。\n\n另外今天學一個新的動作是臀推（ Eleiko 的凳子）：\n\n1. 設置與位置調整：\n(a) 將肩胛骨下方靠在凳子上\n(b) 不可以用聳肩的方式去對肩胛骨，應該透過身體往後、往前的移動來調整位置\n2. 腳部支撐：\n(a) 起始時前腳部分會有一點踩不牢，這點沒有關係\n(b) 重點是推上去的時候能踩得住就好\n3. 動作要領：\n(a) 往上推的時候，膝蓋的角度要維持 90 度\n(b) 往上、往下的過程中，頭部應該要跟著身體連動\n(c) 推起時是整個人向上發力，而不是向凳子的方向推\n\n注意：凳子不應該被推到有一腳翹起來。\n啞鈴放在肚子約靠上方一些，因為太靠近骨盆會夾到、會卡住，然後雙手扶著啞鈴。\n這個感覺應該會是幾乎由後側鏈在用力，大腿前側幾乎沒有介入。\n\n關於脖子後方，因為要維持平衡，所以做完會感覺到一點酸，這算是正常的。\n", "2026-04-07": "# 2026年4月7日星期二\n\n今天的熱身：\n\n1.滾筒放鬆背部\n2.滾筒放鬆大腿內側\n3.特別加強大腿前側靠近膝蓋的部分\n\n訓練項目：\n\n1.啞鈴臀推\n(a) 10公斤\n(b) 3組\n(c)每組 10 下\n\n2.熊抱槓深蹲\n(a) 60公斤\n(b) 4組\n(c)每組 7 下\n從每組 10 下減到 7 下後，感覺心肺比較沒什麼問題。此外，有感覺到整隻腳在推，而不像之前整個重心都落在後方，沒辦法踏穩。不過，這樣是不是對心肺的刺激與鍛煉效果就變差了？\n股四頭也沒有像之前介入那麼多，也沒有燃燒的感覺，但是有用力的感覺。\n\n另外，覺得腰有點痠，可是那個位置很奇妙，應該是之前說過的臀肌跟腰中間的交界那邊。要怎麼分是臀肌痠還是腰痠？是比較靠近兩側的地方。\n\n滑輪下拉 45 公斤，4 組，每組 10 下。\n這次注意：\n1.腳：大腿要塞緊\n2.腳要踩地、踩實\n3.坐骨要坐穩\n\n坐姿腿踢：\n1.第一組：38 公斤，10 下\n2.後面兩組：45 公斤，10 下\n第一次感受到股四頭肌比較完整（從中間開始往上下）的一個痠、疲勞的感覺。\n\n坐姿划船：45公斤，三組，每組10下。\n感覺是沒法再做第四組了。\n\nCable 二頭：25 公斤，10 下，共三組。\n\n跑步機：用走的，時速 4 公里，坡度 30%，時間 35 分鐘，心跳在 125 到 130 左右。\n", "2026-04-08": "# 2026年4月8日星期三\n\n今天的熱身：\n\n1.滾筒放鬆背部\n2.滾筒開胸（感覺頭快要可以碰到地板了）\n3.側棒式的髖屈髖伸：\n(a)這一項做三組\n(b)每組十下\n\n以下是今天的教練課內容：\n\n1.背靠牆的核心呼吸\n(a)骨盆微微後傾，讓整個背部（從臀部後方、臀部上緣、腰部、背部、胸口到肩膀）全部往後貼緊牆面。\n(b)吸氣時，要感覺到背部往後、往旁邊擴張。\n(c)雙腳膝蓋對準腳掌中指，帶一點微微內八的感覺。\n(d)全身保持繃緊，腹肌會有類似捲腹的發力感。\n(e)上半身與手部只是輕輕提著重量，不要出力死撐。\n\n6.風車（Windmill）\n(a)做前面的那一手（往上提的那一手）要注意往上撐。\n(b)往側下面的那一手，到最後旋轉的時候，頭要往上面手的位置看。\n\n這個動作也可以當作是上半身的熱身，可以取代原有的熱身項目。這同時也能達到訓練肩胛骨穩定的效果。\n\n槓鈴臥推今天的幾個動作調整：\n\n1.出槓與站姿\n(a)往前往上塞的時候，腳不要站得那麼開，可以站近一點\n(b)出槓後，手腕的部分要做一個「吹油門」的動作，然後固定住不要動\n\n2.呼吸與發力\n(a)先鼓一口氣再往下\n(b)往下的過程中，感覺二頭肌被切斷，直接往下壓，不要刻意去夾手臂\n(c)注意肩膀不要聳肩\n\n3.今日訓練紀錄：\n(a)做三組\n(b) 40公斤\n(c)每組六下(d) 感覺強度還可以，到最後一下都還是順利地推起來，沒有卡住\n\n教練說這個姿勢目前做起來，會感覺肩膀的活動度還是不太夠。\n然後做龍門版的動作。推龍門架時，一樣是用之前推雪橇的模式，採用胸推加肩推的組合版。\n\n動作細節如下：\n1.若感覺肩膀介入太多的話，可以將握把位置調高一點，變成有點類似上斜臥推的感覺。\n2.推的時候要注意手感：\n(a)如果用拇指握著，會更容易帶到肩膀\n(b)建議改用四指握法（空握）\n(c)胸部要靠近龍門架再往前推\n3.其餘動作與推雪橇類似。\n\n目前龍門架重量約 97 公斤，感覺有點重。\n\n另外做一個練手臂肱肌的姿勢，跟 Cable 二頭有點像。差別在於：\n\n1.坐在 Bench 上，把腳踩在橫槓上。\n2.腳要收緊、踩窄一點。\n3.把啞鈴放在大腿兩側，下去做手臂的屈伸動作。\n\n這個動作跟 Cable 有一點點類似，要注意不要聳肩，並要把肱三頭肌的位置固定住。\n\n以下是課後訓練：\n飛機做三組，每組 10 次。\n\n跑步機用走的，時速 4 公里，坡度 4，35 分鐘。\n", "2026-04-09": "# 2026年4月9日星期四\n\n今天的熱身：\n1.滾筒放鬆背\n2.滾筒開胸\n1.滾筒放鬆大腿內側及前側可能是上次腿踢發力比較完整的關係，這次整個前側其實也都蠻酸的\n3.風車三組，每組 10 下\n\nRDL：\n1.兩組 40 公斤，10 下\n2.兩組 50 公斤，10 下\n感覺 50 公斤比較能感受到腿的發力感，但是握力到最後會有一點吃力。\n\n垂直腿推 60 公斤，三組每組 10 下。今天降重量來做上次教練說的動作控制調整，放慢往上推的速度，不要依賴爆發力；用 60 公斤左右腿就蠻酸的，另外左膝的彈響仍然有一點。\n大腿前後側都蠻酸的，前側內側靠近膝蓋的地方仍然有灼燒感，而不是整個股四頭。\n\nCable三頭：25 公斤，三組，每組 10 下。\n今天三頭的發力感很好，非常酸。\n\n跑步機：用跑的或用走的，時速 4 公里，坡度 4 左右，心跳在 130 上下。30 分鐘\n", "2026-04-10": "# 2026年4月10日星期五\n\n熱身，風車三組，每組十下，手持 4 公斤壺鈴。\n\n訓練內容：\n1.槓鈴臥推 40 公斤，三組，每組 10 下\n今天選到這個凳子好滑，推一半肩膀就有一點滑走。胸的發力感還不錯，做完充血感蠻明顯的。\n今天的肩膀介入也少很多，做完主要是胸跟有一點三頭。\n\nCable直臂下壓四組：\n1.第一組：25 公斤，10 下\n2.後面三組：32 公斤，10 下\n這次感覺比較沒有那麼吃力，可以順利做完四組。\n\n槓鈴伏地挺身 3 組，每組 10 下：\n1.第一組：高度 8\n2.後面兩組：高度 6\n3.第三組：最後一兩下有一點力竭感\n\n坐姿二頭彎舉練肱肌的版本：三組，每組 10 下，10 公斤。\n第三組最後兩下有點吃力。\n\n跑步機用走的：\n1. 時速：4 公里\n2. 坡度：4\n3. 心跳：130 左右\n4. 時間：35 分鐘\n", "2026-04-11": "# 2026年4月11日星期六\n\n今天的熱身：用滾筒放鬆大腿前側以及大腿內側。\n\n特別加強內側、接近膝蓋的位置，這整個腿的緊繃感都蠻明顯的。\n1. 筋膜球放鬆：臀部\n2. 滾筒放鬆：大腿後側\n\n以下是今天教練課內容：\n\n1.趴姿的髖關節大迴旋\n(a)採趴跪姿，輪流單腳進行髖關節順時針及逆時針的大迴旋\n(b)動作要盡量做到極限\n(c)核心要繃緊，避免骨盆旋轉或傾斜\n\n2.坐姿的 90/90 髖關節活動度練習\n(a)採坐姿，雙腳與地板平行，雙腳膝蓋跟小腿角度約 90 度的姿勢往右坐，胸椎隨之往右轉\n(b)接下來左腳先往左邊往上轉，轉到極限時，右腳再跟著轉\n(c)整個轉過去會變成 90/90 的腳位，對向另外一個方向\n(d)轉動過程中要吸飽氣，直到轉到對向時才開始吐氣\n(e)會感覺是髖外側在用力\n\n(f)背槓前如果胸肌太緊，可以利用牆壁做胸部拉伸以及筋膜球放鬆\n(g)放鬆時可以把手背在背後，像警察制服歹徒的那個姿勢，然後手臂往後延展，讓胸肌拉長\n\n2.背槓深蹲\n(a)設定與起槓：\n從中指握住槓鈴的對齊線（立線）開始。上半身往下鑽到槓下時，呼吸感覺要像四足跪姿呼吸一樣。胸椎往前挺，屁股不要太往前，要稍微往後。頭向前看，腳直直地往上踩來出槓。\n(b)站距與角度：\n出槓後要對好站距。每一次蹲都要對齊站距與外八的角度，站距約略小於 1.5 倍的髖寬，外八大約是 30 度。\n(c)下蹲與發力：\n下蹲時要避免膝蓋一直往前爆衝，膝蓋要維持對著中指的方向，不要往外或往內偏，就比較不會有膝蓋的彈響，而是直直朝向中指的前後。往上的時候，感覺像是腿部推蹬一樣往下踩。預備姿勢一樣是要上半身微微向前，然後屁股向後。\n(d)訓練體感：\n這個姿勢的重心跟發力感，我覺得比 SSB還有熊抱槓深蹲都還要好控制很多。\n(e)適應狀況：\n上半身胸部跟肩部的地方還需要一點適應時間，目前感覺有點緊繃，活動度有一點點受限。\n背槓時要避免聳肩\n\n以下是教練課後的自主訓練：\n1. 坐姿提踵：40 公斤，3 組，每組 10 下\n2. 狀況回饋：坐姿提踵機的預備姿勢不是很好進去，如果之後再加重，不知道該怎麼進去。\n\n另外，跑步機用走的速度 5 公里，坡度 0，35 分鐘，心跳在 130 上下。\n", "2026-04-13": "# 2026年4月13日星期一\n\n今天的熱身滾筒放鬆，大腿前側跟內側特別加強靠近膝蓋的部位。那邊很痠，怎麼放都有一種還是很痠的感覺。\n\n後腳抬高蹲：\n兩手各 15 公斤啞鈴，三組每組 10 下。\n\n這好像是第一次做後腳抬高蹲，有感受到炸後側跟屁股\n三組蹲完覺得前後側跟屁股都沒力了，放棄第四組。\n\n風車三組，每組十下。我發現我的手掌能碰到地了！\n\n哥本哈根側棒式兩組，每組 40 秒。\n\n側棒式髖屈髖伸三組，每組 10 下。\n\n飛機徒手三組，每組 10 次。\n\n三樓捲腹機共三組：\n1. 第一組 32 公斤，10 下\n2. 後面兩組 38 公斤，10 下\n\n跑步機：用走的，時速 4.5，坡度 0，心跳 130 上下，35 分鐘\n", "2026-04-14": "# 2026年4月14日星期二\n\n今天熱身：\n1.滾筒放鬆背部\n2.滾筒開胸\n3.滾筒放鬆大腿前側與內側\n特別加強了膝蓋附近，今天滾到前側和內側時還是很酸。\n\n槓鈴臥推\n今天比賽架那邊的人練很久又一直聊天，我就去後面的深蹲架那邊做臥推：\n1.第一組：45 公斤，9 下\n2.第二組：45 公斤，10 下\n3.第三組：40 公斤，10 下\n那個 Eleiko 的凳子還是覺得背有一點滑。\n\n機械胸推：\n1.第一組：38 公斤，10 下\n2.第二組：52 公斤，10 下\n3.後面兩組：45 公斤，10 下\n今天肩、三頭還有胸都蠻多的。\n\n器械肩推 25 公斤，三組，每組 10 下。\n今天一樣覺得三頭的比例蠻高的，肩膀沒有之前的那種酸感。\n\n跑步機的速度 4.5 公里，坡度 3 左右，共走了 35 分鐘。\n今天心跳比平常低了一點，大部分的時間都在 125 以下，不知道為什麼。\n", "2026-04-15": "# 2026年4月15日星期三\n\n今天的熱身：滾筒放鬆 大腿前側跟內側。\n\n今天的教練課內容：\n\n1.坐姿的 90/90 髖關節內外旋活動度練習\n(a)這次是坐在舉重臺的邊緣，讓前腳跟後腳有個高度落差，後腳在較低處\n(b)後腳向外旋轉之後，再往內夾到前腳的前方踩地，然後再翻方向回去\n這個動作比上次的 90/90 坐姿容易做，但是髖關節更痠。\n\n接下來做四足跪姿的呼吸練習。\n\n再來做對著鏡子的肩胛骨活動訓練。\n像之前有一個趴在地上，手持槓片從背後旋轉到頭上的那個姿勢一樣，只是這次是站直做。做的時候要特別注意肩膀不要聳肩。\n然後做的時候發現右手的做起來比較不順，右手光是要把槓片放回背上就有困難。\n\n接著是背槓深蹲，這次做 45 公斤感覺還不錯。確實背槓的重心要比之前的 SSB 槓穩很多，這次感覺重量偏輕，下次可以再加重。\n\n主要調整是上半身進去背槓出槓的動作：\n1.手肘要維持在後面，不能跟著身體一起到槓鈴下方往上撐\n2.身體跟屁股不要太進去\n\n往上撐之後，要穩定地直直往後退；回槓的時候也是一樣，要先把雙腳並攏再往前撞。\n\n接下來做的是面拉，動作有點類似 Cable 二頭的站姿。\n1.用手腕把滑輪繩往耳朵後方拉\n(a)拉的時候要注意掛鉤，感覺它會往眼睛那邊去\n(b)往後拉時，要跟手肘一起向後張開\n(c)張開的角度要接近背槓時的動作\n這次做的是 18 公斤\n1.之後要做肩胛骨上方跟下方的肌肉放鬆，要含胸、靠牆用筋膜球\n2.另外還有就是胸到肩的那個位置\n\n接著是趴姿腿後勾的姿勢調整。\n預備姿勢時：\n1.膝蓋要先對好轉軸的軸心\n2.雙腳要併攏，腳背往上勾\n3.記得放鬆小腿前側和大腿後側\n大腿的放鬆順序，應該先從屁股後側、內側，再來才是前側。\n然後大腿前側要注意服貼，不要用力，特別是往下放的時候。\n\n以下是教練課後的訓練內容：\n\n1.坐姿腿踢：32 公斤\n(a)四組，每組 10 下\n(b)特別注意腳後側要有一種「浮起來」的感覺\n(c)做到 32 公斤時，會感覺到有點發抖\n\n3. 跑步機訓練感受：\n(a) 用走的速度 4 公里，坡度 3\n(b) 心跳在 130 上下\n(c) 心跳確實變得更容易往下掉，不過會有一種高高低低、不夠穩定的感覺\n", "2026-04-16": "# 2026年4月16日星期四\n\n今天的熱身：\n\n1.滾筒放鬆背部\n2.筋膜球放鬆臀肌\n3.滾筒放鬆大腿後側、內側以及前側（特別加強內側靠近膝蓋的部分）\n\n再來是風車：\n負重 4 公斤，共 3 組，每組 10 下\n\nRDL：\n1.第一組：40 公斤，6 下\n2.後面三組：50 公斤，6 下\n這次做的感覺手臂比較握得住，沒有那麼吃力\n今天穿的是慢跑鞋，感覺角度有微妙的差異。\n\n器械輔助引體向上：\n1.負 64 公斤：一組 10 下\n2.負 68 公斤：兩組各 10 下\n前面兩組手臂手握太緊，都是小手臂在出力的感覺。第三組開始，嘗試把用力的位置想像在手肘往下，感覺就有好一點了。\n\n滑輪下拉 45 公斤三組，每組 10 下。也是一樣，不要握太緊，把注意力拉回手肘往下，就不會覺得小手臂一直在出力。\n\n坐姿划船：38公斤，三組十下。\n\nCable二頭：25公斤，三組十下。\n\n跑步機：\n1. 方式：用走的\n2. 時速：5 公里\n3. 坡度：35 分鐘\n4. 裝備：穿運動鞋（換慢跑鞋確實比較舒服一點）\n5. 心跳：130 以下\n", "2026-04-17": "# 2026年4月17日星期五\n\n今天的熱身：\n\n1.筋膜球放鬆整個臀部\n2.趴姿後腳交叉，拉伸臀部\n3.跪姿屁股朝天，拉伸後側\n4.滾筒放鬆大腿內側跟大腿前側（特別加強靠近膝蓋的地方）\n\n背槓深蹲：\n1.第一組：60公斤，6下\n2.後面四組：70公斤，6下\n今天這樣的強度，感覺心肺很平穩沒有飆心跳，是不是腳有站穩、上半身沒有出來搶著發力，就比較不容易爆心跳？重心好像有偏前一點點，不過感受度前後算蠻平均的。\n\n垂直腿推：4 組，60 公斤，每組 10 下\n最近這樣放鬆、加強股四頭靠近膝蓋的那個部位，好像真的比較不會有股四內側靠近膝蓋那個部位燒到爆的狀況，但是唯獨「垂直腿推」還是會有一點燒，不知道是不是因為每次都排在深蹲後面。還是「垂直腿推」本來就那個地方會比較酸？\n\n負重是 15 公斤，1 分鐘三組。有點久沒做這個了，第一組變得很抖，不過後面兩組就還好了。\n\n哥本哈根側撐是兩組，每組 40 秒。今天做起來明顯比之前要輕鬆一些。\n\n坐姿腿勾：25 公斤，三組，每組 10 下。\n在勾起來的頂部暫停一下再放下去，這樣做起來蠻有感覺的，但小腿也很酸。\n\n跑步機用走的速度 4.5 公里，坡度 0 左右，心跳在 130 上下，35 分鐘。\n\n今天的腿推，左膝還是有卡卡的感覺。\n\n坐姿腿勾的部分，重量放得比較輕，倒是沒有感覺到不適。\n", "2026-04-18": "# 2026年4月18日星期六\n\n今天的熱身：1. 滾筒放鬆背部\n2. 滾筒開胸\n3. 筋膜球放鬆胸肌與肩胛骨周圍\n\n以下是今天的教練課內容：\n1.做 Arm Bar\n*做躺姿，單手持壺鈴，跟風車的姿勢類似，往天上頂\n*另外一手往旁邊放鬆放在地上\n*持重的同側腳呈 90 度往內側轉\n*手維持往天推，要感覺推到肩胛骨有往外移動的感覺\n*腳往身體往內側轉，轉到不行之後要感覺往下壓\n*往上推的那隻手要維持在身體上方\n*恢復的時候要恢復到三角肌後束能貼到地板上\n\n*接著做單手的四足跪姿（即原來的四足跪姿姿勢）：\n(a)將其中一隻手的手掌放到另一手的肩膀上\n(b)這個動作很累，腳尖容易浮起來，要盡量維持腳尖貼地\n(c)身體重心要再往前一點\n\n槓鈴臥推的訓練重點：\n\n1.往上往後撐的時候，要有主動的主觀意識把胸往上撐，才不會撐上去的都是肚子。\n2.如果感覺到腰會痠，或是腰的受力感跑出來，就要重新調整。把胸重新撐出來一次。\n3.握槓的角度要適中。\n4.推出去之後，不要試圖再想著轉槓。\n5.今天在推的時候，屁股比平常靠在墊子上的力氣還要小一點，這樣感覺腳支撐的力氣能夠比較好的往上傳。\n\n另外，我的大腿前側與內側靠近膝蓋的地方非常緊，要加強放鬆。深蹲時要避免腳往外蹲，也要避免蹲下去的時候膝蓋往外，要對準中指。然後上半身手肘的部分，要有意識地往後控制，不能往下掉。\n\n以下是教練課後的訓練：\n1. 直臂下壓：25公斤，十下三組\n2. Cable 三頭：25公斤，十下三組\n\n3. 爬樓梯機：速度調在第三檔左右，五分鐘，心跳約 140 幾。做起來膝蓋不太舒服，不做了。\n跑步機：\n用走的速度 5 左右，坡度 0，心跳在 130 上下，25 分鐘。\n", "2026-04-20": "# 2026年4月20日星期一\n\n今天的熱身：\n\n1. 筋膜球放鬆臀肌\n2. 後腳交叉拉伸（臀肌及背闊肌）\n3. 趴跪姿屁股向上頂（三組，每組 10 次）保持慢呼吸，拉伸後側。\n用手肘自體重按壓大腿內前側靠近膝蓋部分，非常痠。\n1. 滾筒放鬆背\n2. 滾筒開胸\n\n背槓深蹲：\n1. 第一組：70 公斤，8 下\n2. 第二、第三組：75 公斤，8 下\n3. 第四組：75 公斤，9 下\n蹲完大腿內側靠近膝蓋的部分也是有酸，但是沒有像腿推那樣燒\n\n側棒式髖屈髖伸三組，每組 10 下。\n\n啞鈴臀推 20 公斤三組，每組 10 下。\n臀推有時候還是會覺得背後面沒有辦法固定住，會動來動去。\n\n跑步機用走的速度 4.5 公里，坡度 0，心跳 130 左右，15 分鐘。\n\n昨天沒睡好，今天輕鬆練\n", "2026-04-21": "# 2026年4月21日星期二\n\n今天的熱身：\n1.風車\n重量 4 公斤，共三組，每組 10 下\n\n2.滑輪下拉\n重量 45 公斤，共三組，每組 10 下\n\n3.坐姿划船\n重量 38 公斤，共三組，每組 10 下\n\n4. Cable二頭\n第一組 25 公斤 10 下，後面兩組 32 公斤 10 下，終於能加重了。\n\n三樓的卷腹機：38 公斤，3 組，每組 10 下。\n\n跑步機用走的 時速4.5左右 坡度0 心跳130左右 35分鐘\n", "2026-04-22": "# 2026年4月22日星期三\n\n今天的熱身，滾筒放胸背、滾筒開胸。\n\n接著進行趴姿後腳交叉，放鬆屁股\n跪姿屁股朝天，放鬆後側。做三組，每組配合十次的慢呼吸。\n\n最後做滾筒的大腿內側以及前側放鬆，並加強膝蓋周圍。\n\n以下是今天的教練課內容：\n\n單腳靠牆踩斜板的 RDL，這項要特別注意大拇指球踩地的感覺。往上蹬的時候，要感覺小腿有在發力，像是踩在地上墊腳尖的那種感覺。\n\n每次深蹲或有練蹲類的動作之前都要做。\n\n第二項是前後重心轉換的肩推：\n1.先由單手持重，同側腳往前。前腳微蹲，兩腳腳跟都要離地。\n2.另一側的手肘往上，感覺肩胛骨向上旋轉，並扶著另一手持重的啞鈴上方。\n3.持重手的手肘要靠在腰際邊緣，姿勢有點像是風車向側邊伸展。\n4.接著雙腳交叉跳，讓後腳變為前腳。\n5.同時，持重手往前往上推，感覺肩胛向外延伸，另一手則將手肘收回到腰間。\n\n背槓深蹲，今天做一些動作的調整：\n\n1.背槓時，要記得胸椎要挺直往前頂\n2.站穩後，往上站穩再出槓\n3.預備動作不要半蹲，身體要微微向前傾\n\n往下蹲的時候要數 1、2、3，然後就直接往上，不要在底部停頓，會讓整個後側鬆掉。\n4.在深蹲前，可以先做空槓熱身：\n(b)三組，每組七下\n練習時做底部停留三秒，蹲到最底部之後再數三秒，然後往上，來找在底部發力的那個感覺。\n一樣要特別注意大拇指球發力，重心要踩穩，這樣就能大幅減少膝蓋附近的肌肉酸緊。\n\n要有意識地控制大拇指球及膝蓋不要往外張開，蹲下去的時候，不要往外推，也不要往前推。\n\n板凳臀推動作調整，主要要控制靠在板凳上的位置，要在下面一點（肩胛骨下方）。然後髖部要更內八一點，腳站寬一點。\n\n往下時，感覺重心在屁股上，以屁股往前、往後各 50% 的角度出力。這時應該會感覺靠在凳子上的出力方向，不會把凳子推倒。這個姿勢也要控制大拇指球踩地。\n\n教練課後的訓練：\n槓鈴臥推 50 公斤，4 組每組 6 下\n課後再練感覺注意力沒有剛開始訓練那麼好。\n", "2026-04-23": "# 2026年4月23日星期四\n\n今天的熱身：\n\n1. 筋膜球放鬆臀肌\n2. 雙腳跪姿，雙腳交叉拉伸臀肌跟闊背肌\n3. 跪姿屁股朝天頂，拉伸腿後側做三組，每組十次慢呼吸。\n\n4. 滾筒放鬆大腿內側以及前側，特別加強靠近膝蓋的地方。\n\n5. RDL 50 公斤，四組每組 6 下。今天比較用力地把拇指握起來，感覺比較有感的是小手臂。\n這個重量目前腿部感受度還是不夠明顯，主要只有一點拉伸感。第二組之後有特別再放得更下去、更深一點。\n如果我想要快速地讓 RDL 可以更好地刺激我的後側鏈，是不是應該要上拉力帶？\n\nRDL 的持槓練習：80 公斤，共三組。前面兩組各 40 秒，最後一組 30 秒。\n\n垂直腿推\n4 組 70 公斤，每組 10 下。\n做完第一組，我突然發現垂直腿推為了要加大行程，所以我的膝蓋在下來的時候，會相當大幅度地往外張開，導致膝蓋內側那邊酸爆，應該就是這個原因。\n後面幾組把注意力放在大拇指球跟膝蓋上面，控制膝蓋張開的幅度，不過因為第一組已經把膝蓋內側弄得燒爆了，所以感覺還是很燒。下次從第一組開始就注意試試看。\n不過這樣子，行程就會短很多，因為膝蓋一下來就很容易頂到肚子。\n\n側棒式髖屈髖伸：\n三組，每組 10 下。\n這個接在腿推之後做，有點硬。\n组间拉到 3-5 分钟才勉强做完。\n\n跑步機用走的速度 4.5 公里，坡度 0 左右，心跳 130 上下，20 分鐘。\n", "2026-04-24": "# 2026年4月24日星期五\n\n今天的熱身：\n\n1.風車：持重 4 公斤，3 組，每組 10 下\n2.單腳斜板 RDL：3 組，每組 10 下\n3.在舉重台高低落差進行 90/90 髖部伸展運動：3 組，每組 10 下\n\n跪姿肩推：20 公斤槓鈴空槓，3 組，每組 10 下\n坐姿提踵：50 公斤，4 組，每組 10 下\n器械胸推：38 公斤，4 組，每組 10 下\n上次說有可能太重，造成肩跟手臂參與過多，這次維持在 38 公斤，感覺胸的比例就佔大部分。\n\n坐姿腿推 32 公斤，共三組，每組 10 下。\n這次特別注意減少後撤的補償動作，做起來感覺心跳非常快。\n\n直臂下拉：\n1. 32公斤：一組\n2. 25公斤：兩組\n3. 32公斤：一組\n總共四組，每組 10 下。\n\nCable 面拉 18 公斤：三組\n每組 10 下。\n\nCable三頭 25 公斤：三組\n每組 10 下\n\n跑步機用走的：\n速度 4.5 公里，坡度 0，10 分鐘，心跳 130 左右。\n", "2026-04-25": "# 2026年4月25日星期六\n\n今天的熱身：\n\n1.滾筒放鬆背部\n2.滾筒開胸\n3.風車：持重 4 公斤，三組，每組 10 下\n4.滾筒放鬆前側與內側\n\n利用手肘放鬆膝蓋附近的酸緊感。\n\n背槓深蹲\n兩組空槓七下，在底部停留三秒的練習。\n\n1.第一組：80 公斤，4 下\n2.後面三組：80 公斤，6 下\n錄影第三組錄漏了\n盡量控制膝蓋不要往外走\n用大拇指球用力。今天大腿膝蓋附近沒有什麼酸緊感。\n\nRDL持槓練習：\n1.第一組：80 公斤，40 秒\n2.第二組：80 公斤，30 秒\n今天感覺握不太住\n\nCable二頭：\n1.前面兩組：32 公斤，10 下\n2.後面兩組：25 公斤，10 下\n\n二頭非常痠，然後肩胛骨內側也有一點痠感，但主要還是二頭的感覺比較多。\n\n坐姿內收機：45 公斤，3 組，每組 10 下\n\n跑步機：\n1. 速度：5 左右\n2. 坡度：0\n3. 時間：10 分鐘\n4. 心跳：130 多一點\n", "2026-04-27": "# 2026年4月27日星期一\n\n今天的熱身運動如下：\n\n1.風車：持重 4 公斤，共三組，每組 10 下\n2.用滾筒放鬆背部\n3.用滾筒抬胸\n4.跪姿後腳交叉：拉伸臀肌跟闊背肌\n5.跪姿屁股朝天頂：三組，每組十下，慢呼吸\n\n6.坐姿 90/90：一組 10 下（兩邊各 5 下），共 3 組\n\n後腳抬高蹲做 4 組，雙手各拿 10 公斤啞鈴，每組 10 下。\n今天蹲完屁股也炸了，股四內側膝蓋附近也炸了，心肺也炸了。\n\n滑輪下拉 45 公斤，4 組，每組 10 下\n\n坐姿划船 38 公斤，3 組，每組 10 下\n\nCable二頭，4 組：\n1.前面 3 組：32 公斤\n2.最後 1 組：25 公斤\n每組 10 下\n\n跑步機：\n1. 速度：4.5\n2. 坡度：0\n3. 心跳：130 左右\n4. 時間：20 分鐘\n", "2026-04-28": "# 2026年4月28日星期二\n\n今天的熱身：\n風車（負重 6 公斤），三組，每組十下\n\n杠铃臥推四組：\n1.第一組：6 下\n2.第二組：8 下\n3.第三、四組：6 下\n今天試了新的防滑墊，背不滑了，但在後面那個 Eleiko 的深蹲架那邊，地板好滑，踩不住。\n\n坐姿的 90/90，做三組，每組十下（一邊五下）。\n器械胸推 38 公斤，每組 10 下，共 4 組。\nCable三頭 25 公斤，4 組，每組 10 下。\n負重棒是 20 公斤，三組，每組 1 分鐘。\n\n滑步機用走的：\n1. 速度：4.5 公里\n2. 坡度：1\n3. 時間：20 分鐘\n4. 心跳：在 125 到 130 之間\n", "2026-04-30": "# 2026年4月30日星期四\n\n今天的熱身是坐姿 90/90，共做 3 組。\n每組 10 下（每邊各 5 下）\n滾筒放鬆背、滾筒開胸。\n\n今天的教練課內容：\n\n1.飛機式（往下往內轉時）：\n(a)身體要往前傾一點\n(b)手往下持重 6 公斤的壺鈴\n(c)往外轉髖時，要注意前腳膝蓋不要跟著動，要往中指的角度維持\n(d)持重的是前腳的對向手\n\n3.槓鈴深蹲的護槓設置：\n(a)位置大約在「8」的那一格下面\n(b)測量方式：以深蹲姿勢將雙手往兩側平舉，蹲到最底的高度，往前對應到架上的位置\n(c)高度建議：背著槓鈴蹲到最底下後，下方仍剩下一點點空間\n(d)安全機制：如果重量太重起不來，直接整個人往下放，槓子就會掉在護槓上\n4.訓練回饋：\n(a)今天蹲到 85 公斤，感覺還可以。\n(b)只要膝蓋有穩住、沒有往外張，且大拇指球有用力的話，這個重量可以做得蠻穩的。\n\n(c)單腳臀推\n原本靠的凳子可以改成 Eleiko 粗腳的那種，會比較穩。要確保肩胛骨下方頂在凳子上，這樣才不會移動。\n\n做單腳時的動作要領：\n1.要練的那隻腳稍微往身體中間移動，並明確感受到內八\n2.另一隻腳往上抬，膝蓋呈 90 度。\n3.啞鈴放在要練的那隻腳的大腿上，放著的手只要稍微扶著就好，不要太用力去支撐。\n\n其他動作細節跟雙腳臀推差不多。今天做 7.5 公斤就覺得屁股非常痠，過程中要確保大腿內側的感受沒有跑出來，並一直注意大拇指球要往下用力。\n\n另外，今天練習使用助力帶，主要就是要感受使用時重量會落在手腕的哪個部分比較多。拇指跟四隻手指可以不用抓得那麼緊，稍微握住即可。\n\n握的姿勢只會有兩到三隻手指握在助力帶上，比較平、沒有凹的那一邊，會是對在靠近拇指的那一側。\n\n教練課後的訓練內容：\n\n1.器械輔助引體向上\n(a)負 64 公斤\n(b)三組，每組 10 下\n\n4. Cable面拉\n(a) 18公斤\n(b)三組，每組 10 下\n5. Cable直臂下壓\n(a) 32公斤\n(b)三組，每組 10 下\n以上兩樣做超級組\n\n3. 跑步機（用走的）：\n(a) 速度 4.5\n(b) 坡度 2\n(c) 心跳在 130 出頭\n(d) 20 分鐘\n", "2026-05-01": "# 2026年5月1日星期五\n\n今天的熱身：\n\n1.風車\n持重 6 公斤，三組，每組 10 下\n2.坐姿 90/90\n三組，每組 10 下（一邊 5 下）\n3.單腳斜板 RDL\n扶牆，兩組，每組 10 下\n\nRDL 70公斤，四組每組八下。今天試用助力帶，感覺不太習慣，但是確實小手臂的負擔小很多。今天做的時候臀中肌，就是屁股的上緣，感覺很痠很有感，但是大腿後側感覺不明顯。\n\n空手 RDL 持槓練習 80 公斤：\n1.第一組：35 秒\n2.後面兩組：各 15 秒左右就握不住了\n\n3.飛機單手式啞鈴（6 公斤）：\n3組，每組 10 下\n\n4.垂直腿推（70 公斤）：\n4組，每組 10 下\n(a)這次把腳踩的位置稍微往外一點，大約有 1/3 踩在線外，但都還在板子內\n(b)控制膝蓋不要向外，往大拇指球方向出力\n(c)這樣推起來，原本大腿內側的灼燒感減少了約七成\n(d)整個股四頭肌的刺激較平均，沒有集中在內側膝蓋附近\n(e)左膝內側原本有一點卡卡的感覺，這次也沒有跑出來\n\n3.趴姿腿勾：18 公斤，三組，每組 10 下\n(a)第三組最後 4 下是硬撐完的，動作沒有很完整\n(b)腿勾時，膝蓋內側有一點輕微卡卡的感覺跑出來\n\n風扇腳踏車做 HIIT：\n1.前面兩組騎 30 秒，休 30 秒，心跳到 170 左右\n2.後面三組騎 20 秒，休 40 秒，心跳大約到 160 出頭\n\n跑步機用走的速度 4.5 公里，坡度 0，心跳在 130 上下。20 分鐘\n", "2026-05-02": "# 2026年5月2日星期六\n\n今天的熱身：\n\n1.用滾筒放鬆背部\n2.滾筒開胸\n3.用槓鈴放鬆斜方跟肩胛骨內側\n\n以下是今天的教練課內容：\n1.跪姿後腳交叉的臀肌跟闊背拉伸\n2.跪姿的啞鈴肩推\n(a)前側腳前腳跟持重，手為對向手\n(b)持重那一手的推法類似之前的坐姿肩推，從身體前方往上推\n(c)過程中要感覺到肩胛骨動作，大概到一半的時候，有肩胛骨主動往上的感覺\n(d)往下放的時候，全程也要出力，要感覺側面有在施力\n(e)剛才做左手時，有感覺到肩膀彈響。\n(f)後來改做單手跪姿支撐，針對左手加強後，彈響的情況就有改善了。\n\n接著做站立版的弓箭步。\n身體骨盆的部分會有一點往持重手那邊過去，另一側的腳會呈現打直拉伸的狀態，會拉伸到後側跟臀肌。\n動作重點如下：\n1.下面的那一手要往持重手下方的那一腳腳踝去摸。\n2.持重手那一邊的膝蓋會往前彎。\n3.會有一點屁股往後頂的感覺。\n4.一樣要感覺肩胛有主動往上推的動作。\n\n槓鈴臥推在預備姿勢時，要感覺屁股再往上頂一點，全身都要繃著用力。\n起槓時要把槓推到胸口上方，大約在肩胛骨的正上方才會有力。全身都要繃緊，不能放鬆。\n動作要領如下：\n1.往下時不要夾手肘，要直直地往下，再直直地往上\n2.往下時要一直注意控制，感受胸部發力往上推\n\n接著做器械飛鳥夾胸的動作調整，把坐姿改成像是在做器械肩推或是器械胸推的那個姿勢。就是只有肩膀上緣頂著椅子，然後把胸往前挺，那把雙手的兩邊的位置大概調到四，再打開一點。只要胸有往上挺，就可以避免聳肩的狀況。\n\n最後做一個核心的 V 字卷腹\n1.拿起 4 公斤壺鈴，輪流往身體左側及右側移動\n2.除了手部移動以外，身體也要有意識地轉動，並維持 V 字的支撐姿勢\n\n以下是教練課後的訓練內容：\n\n1. Cable二頭彎舉：32 公斤，三組，每組 10 下\n2. Cable面拉：18 公斤，三組，每組 10 下\n這兩樣做超級組\n\n最近做 Cable 類的動作，都能感覺到肩胛內側跟下方附近的肌肉在出力\n風扇自行車 HIIT 做五組，每組 20 秒衝刺、40秒輕鬆，總共 5 分鐘。前三組心跳拉到 150 幾，接近 160；後面兩組心跳拉到 165 左右。\n\n跑步機用走的速度 4 .5左右，坡度 0，時間 15 分鐘，心跳在 130 上下。\n", "2026-05-04": "# 2026年5月4日星期一\n\n今天的熱身：\n\n1.坐姿 90/90：共 3 組，每組 10 下（一邊 5 下）\n2.筋膜球放鬆臀肌\n3.趴姿後腳交叉拉伸：針對臀肌和闊背肌\n4.側棒式髖屈髖伸：1 組 10 下\n5.飛機式持啞鈴（7.5 公斤）：1 組 10 下\n\n6.後腳抬高蹲：4 組，每組 10 下\n(a)重量：雙手各持 12.5 公斤（共 25 公斤）\n(b)感受：今天做起來前側沒有什麼燃燒感，只有正常用力後的疲勞感。最痠的部分跟上禮拜做 RDL 一樣，是在臀肌、臀中肌（比較靠近上方的地方），那邊特別有燃燒感，再來是大腿後側\n(c)注意事項：今天特別注意控制膝蓋不要往前和往外，盡量維持穩定\n(d)訓練感受：今天大部分的次數都有感受到大拇指球在用力\n\n滑輪下拉 4 組 45 公斤，每組 10 下\n\n坐姿腿踢 32 公斤加 extra，4 組每組 10 下\n要控制腿後，盡量不要借力的話，感覺要蠻用力拉住把手，在這樣的前提下就會很喘、很累。\n常常會做到組數錯亂，不太確定我到底是不是做四組\n\n坐姿划船：38公斤，4組，每組10下。\n今天有感覺划船的姿勢做起來好像比較省力一點。\n\nCable二頭跟 Cable 面拉：\n1. Cable二頭：3 組，32 公斤，每組 10 下\n2.面拉：3 組，18 公斤，每組 10 下\n以上兩個動作做超級組\n\n今天後腳抬高蹲之後，就戴著手套做剩下的動作。感覺手套有止滑，做起來更順暢。\n\n跑步機用走的速度 4-4.5，坡度 0，15 分鐘，心跳在 130 出頭。\n​\n", "2026-05-05": "# 2026年5月5日星期二\n\n今天的熱身：站姿風車兩組。\n\n每組 10 下，持重 4 公斤；6 公斤有點撐不住，這次做起來很卡，沒有上次教練課時做得順暢。\n\n槓鈴臥推：\n\n1.第一組：60 公斤，5 下\n2.第二、三組：55 公斤，6 下\n3.第四組：50 公斤，8 下\n今天胸肌的充血感蠻好的。\n\n槓鈴伏地挺身（插在 11 下面），共四組：\n1. 前兩組：握在 RDL 的握距\n2. 後兩組：握在臥推的握距\n每組 10 下。\n\n3. RDL 的持槓練習：\n(a) 前面兩組：60 公斤，40 秒\n(b) 第三組：50 公斤，40 秒\n\n3. 風扇車 HIIT\n(a) 3 分鐘熱身\n(b) 20 秒衝刺，40 秒輕鬆\n(c) 做 5 個循環：\ni. 前兩次：心跳大約到 160，沒超過\nii. 第三、四次：大約到 165\niii. 第五次：173\n\niv. 跑步機用走的速度 3.5 到 4.5，坡度0 15分鐘 心跳130左右\n", "2026-05-07": "# 2026年5月7日星期四\n\n今天的熱身：\n1.滾筒放鬆背部與滾筒開胸\n2.筋膜球放鬆臀肌\n3.跪姿後腳交叉拉伸（臀肌與闊背肌）\n4. 90-90坐姿\n(a) 10下，共 3 組\n(b)每組每邊 5 下\n\n5. 四足跪姿的髖關節大迴旋\n做順時針跟逆時針的髖關節循環\n\n6. RDL（羅馬尼亞硬舉）動作調整：\n(a)上半身保持放鬆\n(b)使用拉力帶時，手腕要有「催油門」的動作，讓槓鈴處於手部正下方。避免勾住槓鈴，而是讓槓鈴自然垂吊\n(c)往上拉時，應感受背部發力將槓鈴帶起，而不是靠手臂發力\n(d)腳的部分要比平時再內八更多一點\n(e)槓往下放的時候可以放得更深，今天放到蠻接近地板的位置\n(f)做完之後，闊背肌比較靠下方的位置蠻酸的\n(g)有上半身往下、儘量到靠近水平的那一組，好像就會特別累。像今天的其中一組，最後 8 到 10 下就是靠意志力完成的\n手握不住的情況，可以稍微坐在催油門多一點的角度，讓拇指往下伸得更多，就可以握得較好一點。\n\n(g)過程中，利用休息時間做一個脫鞋的 RDL 接深蹲再往上起的動作：\n1.重心主要在腳底的前半部，也就是墊腳尖，用腳尖（尤其是內側）來承重\n2.動作流程：\n(a)先做一個 RDL\n(b)接著往下全蹲\n(c)起來的時候再銜接一個 RDL 往上的姿勢\n3.這個動作有點難控制，身體很容易會不穩\n\n4.滑輪下拉\n做完後接著做滑輪下拉，這次做了一些動作調整：\n(a)往下時要感覺手肘往肋骨方向收，也就是往下的時候會有一點稍稍向後拉的感覺，這樣能刺激到闊背肌更往下延伸一點\n(b)往上放的時候，要主動感受由肩胛骨往上再推得更多，但力量要撐住不能鬆掉\n\n3.風扇車\n(a)今天做三組：20 秒衝刺、40 秒放鬆\n(b)今天的狀況沒有很好，做到第三組休息完下來，有點眼冒金星\n(c)心跳大約也是每一組做完大概在 160 幾，第三組就破 170 了\n\n今天確實狀態沒有很好，就到這邊沒有繼續往下練了。\n", "2026-05-11": "# 2026年5月11日星期一\n\n今天的熱身：\n1.滾筒放鬆背部與滾筒開胸\n2.趴姿後腳交叉拉伸（闊背肌跟臀肌）\n3.滾筒放鬆大腿內側和前側\n4. 坐姿 90-90\n3 組，每組 10 下（每邊各 5 下）\n\n槓鈴深蹲：90 公斤，4 組，每組 8 下\n感覺腿部應該還有往上的空間，不過做完覺得背闊肌下半部有一點痠。但在做的過程中，倒是沒有覺得撐不住。\n\n垂直腿推 80 公斤，共 4 組，每組 10 下。\n這次膝蓋的軌跡有固定，不會往外開，之後整個腿前側跟後側的發力感受很好，不會像之前都集中在膝蓋旁邊，感覺快燒爆了。左膝內側卡卡的感覺，好像也幾乎沒出現了。\n\n今天深蹲跟腿推，都能感覺到膝蓋的軌跡比較穩定。\n\nCable二頭跟 Cable 三頭做超級組，共 4 組，每組 10 下，兩個都是 32 公斤\n今天前面都沒有做上半身的其他訓練，就直接做這兩個 Cable 動作，做起來感覺比較沒有那麼吃力，可以穩穩地完成四組超級組。\n\n跑步機用走的，時速 4 公里，坡度 0，心跳在 130 出頭。20 分鐘\n\n今天有輕微的呼吸道症狀，講話有鼻音、有點痰，不過整體體力還算正常，稍微有點咳嗽。\n", "2026-05-12": "# 2026年5月12日星期二\n\n今天的熱身項目：\n\n1. 後腳交叉趴姿：拉伸圓肌和闊背肌\n2. 滾筒放鬆：大腿內側和前側\n3. 站姿風車：\n(a) 第一組持重 4 公斤做 10 下，覺得有點重\n(b) 第二組換持重 2.5 公斤啞鈴，同樣做 10 下\n\n4. 槓鈴臥推：\n(a) 前面兩組：55 公斤，6 下\n(b) 後面兩組：50 公斤，8 下\n今天推起來的感覺，明顯沒有上一次來得好\n肩膀用力的感覺多一點，而且好像也比較不穩，不知道是不是因為今天用了橘色深蹲架，一直覺得會敲到保護槓。\n今天用的是 Eleiko 那個比較輕的椅子，設定細節如下：\n1. 保護槓插在 5 的下面\n2. 槓鈴插在 11 的下面\n\n3. 滑輪下拉：4 組 45 公斤，每組 10 下\n\n4. 機械胸推：4 組 38 公斤，每組 10 下\n5. 直臂下壓：4 組\n(a) 前面 3 組：32 公斤，每組 10 下\n(b) 最後 1 組：25 公斤，10 下\n\n今天很難得地出現了大腿前側、內側，足弓，還有後側靠近內側的地方，都有一點延遲性痠痛。\n好像是第一次做，前一天做深蹲跟腿推之後，這些部位有延遲性痠痛。\n\n跑步機用走的，時速 4 公里，坡度 0，心跳不到 120。今天的心跳好像都有稍微低一點。\n", "2026-05-13": "# 2026年5月13日星期三\n\n今天的熱身：\n\n1.趴跪姿，後腳交叉拉伸臀肌和闊背肌\n2.滾筒放鬆大腿內側及前側\n3.滾筒放鬆背部以及開胸\n4.坐姿 90/90 髖關節活動度訓練：3 組，每組 10 下（一邊各 5 下）\n\n今天的教練課內容，第一項是做「90/90 坐姿」的推髖動作：\n\n1.先完成 90/90 坐姿\n2.屁股往前方腳的方向推，持續往上推到無法再往前為止\n主要重心應放在：\n(a)前側腳的膝蓋、腳跟與腳底側面\n(b)後側腳的膝蓋\n\n接著做槓鈴硬舉。\n\n預備姿勢應該稍微大約與髖同寬或略寬一點點，腳掌呈現稍微的內八。槓鈴位置大概在鞋帶中間的正上方。\n動作要領如下：\n1.前半段跟 RDL 一樣往下，下到不能再下的時候，膝蓋會往前，然後稍微往下蹲。\n2.在這個姿勢輕輕勾住槓，上半身不要用力。\n3.起始動作要由腳先往上踩，眼睛看向前方，不要往下看。\n4.腳往下踩的時候，由腳主導、腳優先，把重量往上撐，不要變成上半身主導，要由腳主導。\n5.應該要撐到上半身微微向後傾的狀態，但注意不能用屁股去夾。\n6.往上的過程應該會感覺到背闊很用力，跟 RDL 一樣\n今天有試著要把拇指放在槓的下方（從這個角度握下去），不過這樣的情況下會拉不太起來，所以後來還是稍微把拇指往後放多一點。\n今天最大重量上到 85 公斤，主要的侷限還是在手臂握力握不住。腿感覺是還有餘裕，有機會一組 8 到 10 下\n往下放的時候一樣，前半段跟 RDL 一樣，後半段槓鈴過膝之後，要把膝蓋稍微往前一點，然後往下蹲到跟預備姿勢一樣，再反過來操作。\n小手臂也要放鬆\n硬舉可以改善讓槓鈴都在底部容易鬆掉，以及整個上半身跟下半身會斷開的感覺。\n\n接著做槓鈴肩推，但因為彈響的關係，所以先做了彈力帶的 Y 字運動。\n手要伸直向斜前方大約 45 度，然後直直地往後到身體的水平面。這 45 度應該要由下斜方（大概在肩胛骨下方）來啟動。\n這個姿勢也可以用 2.5 公斤的啞鈴替代彈力帶。\n主要是要啟動下斜方，然後胸肌、前三角以及二頭、三頭肌都要放鬆，不然會越來越緊。\n槓鈴肩推是把安全槓護槓設置在大約跟身體一樣的高度，但是槓是背在前面。\n預備出槓（預備姿勢）的時候，可以稍微把槓鈴拉出來一點，然後要維持手肘在身體的前面（這個姿勢有點難維持）。\n接著頭要往後，讓出空間給槓鈴往上。\n往上推到頭的上方時，也是要感覺由肩胛骨主導往上；往下的時候則要維持張力，上下的軌跡大概跟滑輪下拉差不多。\n\n今天教練課後，左邊的髖關節外側很痠，那個狀態有點像之前做比較深行程的腿推練完的那個感覺\n\n教練課後的訓練：三樓的捲腹機，前兩組 38 公斤 10 下，後面兩組 32 公斤 10 下。\n\n跑步機用走的速度 5 左右，坡度 0，20 分鐘，心跳不到 130。\n\n不知道是不是這幾天碳水吃的比較多，訓練時的心跳好像有比較低一點。\n", "2026-05-15": "# 2026年5月15日星期五\n\n今天的熱身包含：\n\n1.滾筒放鬆背部\n2.滾筒開胸\n3.趴姿後腳交叉拉伸（針對臀肌和闊背肌）\n4.趴跪姿屁股朝天蹬做 3 組，每組 10 次，配合慢呼吸。\n接下來是：\n1.筋膜球放鬆臀肌\n2.滾筒放鬆大腿內側\n3.滾筒放鬆大腿前側\n\n4.槓鈴深蹲 90 公斤：\n4組，每組 8 下。這次特別把注意力集中在大拇指球用力，有這樣做的組數感覺做起來比較輕鬆；沒有注意到的組數，心率好像就會比較高一點。然後比較吃力一點。今天整體做起來感覺要比上次吃力一點，不知道是不是因為沒有從頭到尾一直專注在大拇指球要用力。今天的感受比較集中在臀中肌，就是屁股的上緣，然後還有大腿後側。大腿股四頭的上緣感受沒有上次好，然後膝蓋內側稍微緊一點，但是也還好。\n\n機械輔助引體向上：\n負64 公斤，4 組每組 10 下\n\n坐姿腿踢：\n38 公斤，4 組每組 10 下\n今天的兩樣練腿項目練完，頭腦都有種充血感。\n除此之外，今天的腿踢、股四頭整個的感受很好。\n坐姿划船 45 公斤，每組 10 下。\n之前划船都在滑輪下拉的後面，同一天都會有一種拉不太動的感覺，所以這次把它錯開，感覺感受好很多。\n\nCable 面拉 18 公斤，三組每組 10 下。\n\n跑步機用走的，速度 4.5 公里，坡度 0 15 分鐘，心跳不到 130。\n", "2026-05-16": "# 2026年5月16日星期六\n\n今天的熱身只有用滾筒放鬆背部和開胸。\n\n今天的教練課內容：\n1. 四足跪姿\n(a) 手稍微往下一點，有點像做伏地挺身前三分之一的樣子\n(b) 這樣撐起來會感覺很酸\n2. 前鋸肌支撐（側棒式）\n(a) 做的過程中，要感覺手肘用力推地板，這樣肩膀才不會跑出來\n(b) 要感覺是側面在用力\n\n(c) 滑輪下拉對握的版本，不是平常做的反握，它的發力模式很類似\n(d) 往下拉的時候要稍微往下多一點，直到接近脖子的地方，會感覺到是下斜方在出力\n\n3. 腹前推\n(a) 將 Cable 設置在肚臍高度，使用 D 型環\n(b) 雙手十指交握，內側與外側手都要用力\n(c) 啟動姿勢從肚臍前方開始，上半身挺直、挺胸，頭往後頂，感覺像四足跪姿那樣\n(d) 往前推時，胸不可以往前含，要維持像在做負重棒式那樣\n(e) 往前推到最後一段，胸部會介入是正常的\n如果一直找不到前鋸肌的感覺，建議先做一陣子側棒式的訓練，再來做這個動作。\n還有一個啟動動作，是將滾輪放到大約肩膀前方的位置並靠在牆上。接著雙手爬上去，注意手不要內八，由手腕左右的位置開始往上旋轉、往上推，推到手臂打直，然後再往下。\n往下的時候，應該會感覺到前鋸肌有在用力。\n\n槓鈴臥推今天的重點是打開胸椎的活動度。\n今天最重推到 62.5 公斤\n可以在臥推架上放上滾筒做開胸的動作：\n1. 將滾筒放在肩胛骨下面\n2. 身體往後靠，做一個類似臥推預備拱橋的姿勢\n3. 維持這個姿勢並配合深呼吸\n臥推的過程中，要很用力地往肩胛骨擠。在這樣的情況下，會感覺胸口比原來推得更高一點，接著整個肩膀上方與脖子附近會覺得很用力。\n腳踩的時候要踩滿，平均地踩滿，不要只有前側踩，這樣會容易滑。推的過程中拳頭要握緊，全身都要用力。\n如果推的時候覺得肩膀跑出來很多，可以回去做一組前鋸肌支撐。\n\n教練課後的訓練：\n槓鈴伏地挺身，插在 7 下面那一格。\n共 3 組，每組 10 下。\n\n哥本哈根側棒式：\n共 3 組，每組 40 秒\n\n跑步機：\n用走的速度 4.5 左右，心跳不到 125最近如果沒有特別累的話，跑步機測出的心跳好像比較低一點，共 15 分鐘。\n", "2026-05-18": "# 2026年5月18日星期一\n\n今天的熱身：\n\n1.滾筒放鬆背\n2.滾筒開胸\n坐姿 90/90，共 3 組，每組 10 次（一邊各 5 次）\n站姿風車：手持 2.5 公斤啞鈴，共 2 組，每組 10 次\n側棒式的髖屈髖伸：兩組，每組 10 次\n飛機：7.5 公斤啞鈴，共 3 組，每組 10 下\n\n硬舉：\n1. 75公斤，2 組，每組 3 下\n2. 70公斤，3 組，每組 6 下\n3.做完左邊的臀肌上緣，特別酸\n\n4.坐姿腿後勾：32 公斤，2 組，每組 10 下\n(a)有點沒力\n(b)只做兩組\n\nCable二頭跟 Cable 三頭做超級組：\n1.各四組\n2.每組 10 下\n3.兩種都是 32 公斤\n\n跑步機用走的速度 4.5 公里，坡度 0心跳在 130 上下。\n", "2026-05-19": "# 2026年5月19日星期二\n\n今天的熱身：\n\n1.滾筒放鬆背\n2.滾筒開肩\n3.側棒式：左右各兩組，每組 30 秒\n4.四足呼吸：兩次，每次 8 下的慢呼吸\n\n槓鈴臥推：前面兩組 62.5 公斤，每組 3 下\n後面三組 57.5 公斤，每組 6 下\n\n滑輪下拉：\n1. 重量：45 公斤\n2. 握法：寬距對握\n3. 組數：每組 10 下，共 4 組\n\n飛鳥夾胸：\n1. 重量：38 公斤\n2. 組數：每組 10 下，共 4 組\n\n直臂滑輪下壓：\n1. 重量：32 公斤\n2. 組數：每組 10 下，共 3 組\n（與面拉 18 公斤做超級組）\n\n面拉：\n1. 重量：18 公斤\n2. 組數：每組 10 下，共 3 組\n（與直臂下壓做超級組）\n\n跑步機用走的速度 4.5 公里，坡度 0，15 分鐘，今天的心跳只有 120 出頭\n", "2026-05-20": "# 2026年5月20日星期三\n\n今天的熱身：\n1.滾筒放鬆背部\n2.滾筒開胸\n3.坐姿 90/90\n(a)四組，每組 10 下\n(b)每組每邊 5 下\n4.跪姿後腳交叉拉伸（針對臀肌與背闊肌）\n\n以下是今天教練課內容：\n5. 斜板扶牆單腳大拇趾球 RDL（腳後跟離地）\n之後有練腿，還是都要先做這個啟動大拇趾球\n\n接著做背槓深蹲，選擇在底部停一秒鐘再起來的版本。\n為了避免在底部時張力鬆掉，啟動動作時要優先感受骨盆往後，同時身體要往前傾，這樣往下蹲的時候膝蓋才不會往前太多。在底部停留一秒之後再往上。吸氣時，要感覺吸到盆底肌，整個骨盆的地方也要有繃住的感覺。\n\n接著做槓鈴的硬舉。\n腳踩的寬度要比之前略寬，大約是踩在手握槓的粗糙面與光滑面交界的中間。用這個動作往上，上半身要儘量放鬆。只有在拉起來的時候，用背部支撐，上半身放得越鬆越好。\n拉起來的時候，身體不要過度往上、往後挺，這樣就比較不會撞到。\n往下抓槓鈴的動作，應該是要先做 RDL 的動作，到下不去的時候膝蓋才微蹲，也就是要先由髖啟動。\n\n接著做上斜啞鈴臥推，用 Eleiko 那個最可以呈現坐姿的凳子，往上調一格。\n動作要領如下：\n1. 啞鈴放在雙腿上，雙腳往後蹬，手往上推。\n2. 接著做類似槓鈴臥推往後起橋的姿勢，把胸挺起來，但屁股可以往下放。\n3. 推的時候感覺是有一點往斜上方（也就是身體的斜上方），實際上大約是以垂直於地板的角度在推。\n這樣會感覺到上胸的發力比較有感。\n\n以下是教練課後的訓練：\n坐姿腿踢：38 公斤，4 組，每組 10 下\n\nCable 二頭與 Cable 三頭做超級組：\n32 公斤，4 組，每組 10 下\n\n風扇車 HIIT 衝刺 20 秒，休息 40 秒，只做兩組。做完覺得狀態沒有很好，就停了。\n\n跑步機用走的速度 4 公里，15 分鐘，坡度 0。心跳不知道，手錶沒電了。\n", "2026-05-25": "# 2026年5月25日星期一\n\n今天的熱身：\n\n1. 滾筒放鬆背部\n2. 滾筒開胸\n3. 坐姿 90/90：10 下，共兩組\n4. 斜板單腳腳跟離地的 RDL：每組 10 下，共兩組\n\n槓鈴深蹲\n1. 第一組：90 公斤，3 下\n2. 第二、三組：95 公斤，3 下\n3. 最後兩組：80 公斤，8 下\n今天深蹲完也是覺得膝蓋有一點酸軟感，那個位置比較靠近膝蓋下方的內側，靠近側面。不會痛，就是好像有點無力感\n\n4. 滑輪下拉：45 公斤\n(a) 寬距離對握 4 組\n(b) 每組 10 下\n\n3. Cable 二頭：4 組，每組 10 下，32 公斤\n4. 直臂下壓：4 組，每組 10 下，32 公斤\n這兩個動作做超級組。直臂下壓的部分，近期應該可以再加重量，下次觀察看看\n\n啞鈴上斜臥推：\n10 公斤（兩手各 10 公斤）\n兩組，每組 10 下\n\n側棒式（前鋸肌支撐）\n兩組，每組 40 秒\n\n做完左邊的肩胛骨內側有一種快抽筋的感覺，一直持續到跑步機做完還有\n\n跑步機（健走）：\n1. 速度：4.6 公里\n2. 坡度：0\n3. 時間：15 分鐘\n4. 心跳：維持在 130 左右\n", "2026-05-26": "# 2026年5月26日星期二\n\n今天的熱身：\n1.滾筒放鬆背部與滾筒開胸\n2.站姿風車\n做的時候肩膀咔啦咔啦響，只做了兩組，每組 5 下，負重 2.5 公斤。\n接著是側棒式與前鋸肌支撐，各做兩組，每組 40 秒。\n啞鈴y raise 2.5公斤 2組 每組10下\n\n槓鈴臥推 62.5 公斤，每組 3 下，共 3 組；57.5 公斤，每組 6 下，共 3 組。\n今天感覺胸跟三頭最有感，肩膀還可以。\n\n實力推 20 公斤，一組 10 下\n後面兩組 15 公斤各 10 下，第三組後面才想到要往頭上推，前面都推得太靠前了\n\n槓鈴伏地挺身固定在7以下，三組，每組 10 下\n\nRDL持槓握力練習：\n1. 40公斤：40 秒，一組\n2. 60公斤：40 秒，兩組\n\n3.風扇車 HIIT 五組：\n(a)每組衝刺 20 秒\n(b)休息 40 秒\n(c)輸出功率大約在 500-600 瓦\n\n(d)跑步機用走的\n-速度：4.5 公里\n-坡度：0\n-時間：15 分鐘\n-心跳：130 上下\n", "2026-05-27": "# 2026年5月27日星期三\n\n今天的熱身：\n\n1. 坐姿 90/90：兩組，每組 10 下\n2. 跪姿拉伸臀肌和背闊肌，後腳交叉\n2. 單腳斜板腳跟離地的 RDL：兩組，每組 10 下\n\n3. 靠牆訓練：\n1. 第一項是做「靠牆的 90/90」練習：\n(a) 保持呼吸，感覺到大腿前側跟後側都有用力\n(b) 持重位置大約在下巴以上\n2. 動作要點：\n(a) 要藉助牆的力量，吐氣的時候更努力地往牆頂\n(b) 上半身、頭、腰往後靠，肩膀也要貼在牆上\n\n3. 槓鈴深蹲\n(a) 今天的動作調整主要在於，準備下蹲時吸氣速度要放慢，大約維持 2 到 3 秒\n(b) 想像氣往盆底肌吸，像是要大便的感覺\n(c) 每一次動作間隔都要做這種慢吸氣呼吸\n這樣做完之後，確實比較沒有蹲到下面要往上起來時，上下動力鏈斷掉的感覺\n今天有蹲到 100 公斤，感覺沒想像中重，但是出槓的穩定度不好，要很慢，不然就會搖搖晃晃然後平常深蹲的左右站距稍微窄了一點，要再寬一點。但是今天蹲起來，感覺膝蓋跟重心是穩定的。\n\n接著做啞鈴的分腿蹲，這是沒有把後腳抬高的版本。整個動作邏輯跟後腳抬高蹲相當類似，只是在後側的那一腳要把腳跟離地、腳尖墊高一點。\n這樣往下蹲的時候，後側腳的大腿前側（四頭肌）上緣會很酸。前側腳的後側也會很痠。跟分腿蹲一樣，要避免把膝蓋頂出去，要往身體雙腳中間蹲。然後一樣要維持骨盆往前側腳那邊轉今天左右手都拿了 7.5 公斤啞鈴做 10 下\n教練說這個分腿蹲以後要接在深蹲後面做\n\n課後跑步機用走的：\n1. 速度：4 公里\n2. 坡度：0\n3. 時間：30 分鐘\n今天的心跳只有 120 出頭\n今天整體的狀況還算不錯，心跳好像比平常要來的低一些\n\n今天練後膝蓋內側也是有一點酸軟感\n", "2026-05-28": "# 2026年5月28日星期四\n\n今天的熱身：\n1. 滾筒放鬆背部\n2. 滾筒開胸\n3. 靠牆用滾筒的前鋸肌啟動\n4. 兩組前鋸肌支撐，每組 40 秒\n5. 2.5 公斤啞鈴 Y-Raise 兩組，每組 10 下\n在做 Y-Raise 的時候，左肩有一點卡卡的響聲的感覺。\n筋膜球放鬆胸肌\n槓鈴臥推：\n1. 65 公斤，兩組，每組 3 下\n2. 60 公斤，一組，每組 4 下\n3. 55 公斤，兩組，每組 6 下\n今天左手握的角度不知道哪裡怪怪的，手腕有點壓力其他整體的發力感還可以，胸跟三頭佔最多。\n不過腰也有一點。\n\n肩推 15 公斤，4 組，每組 10 下。\n左肩還是卡拉響，有特別去用筋膜球加強了一下左邊胸肌的放鬆，還是一樣。除此之外，真的感受度還不錯。\n\n引體向上（機械輔助）：\n1. 負 59 公斤，三組每組 10 下\n2. 負 64 公斤，一組每組 10 下\n越到後面小手臂就越酸。已經盡量在手肘往下拉了\n\nCable 三頭一組 32 公斤 10 下，今天三頭不太行，先 Pass\n\nCable 二頭跟直臂下拉做超級組：\n\n1. Cable 二頭：四組，32 公斤，每組 10 下\n2. 直臂下拉：三組，32 公斤，每組 10 下\n\n跑步機用走的，速度 4.5 公里，坡度 2，15 分鐘，心跳 130 左右。感覺加一點點的坡度，膝蓋的壓力好像小一點\n", "2026-05-29": "# 2026年5月29日星期五\n\n今天的熱身：\n\n1.趴姿後腳交叉：拉伸臀肌跟背闊肌\n2.滾筒放鬆：大腿內側跟前側\n3.後腳抬高蹲姿勢：大腿前側拉伸\n4.坐姿 90-90：共兩組，每組 10 次\n5.斜板腳跟離地單腳 RDL：兩組，每組 10 次\n\n6.槓鈴硬舉：\n85公斤，3 下 × 3 組\n77.5公斤：6 下 × 2 組\n我的站姿比之前有稍微拉寬一點點，再加上內八之後往下蹲，會有一種膝蓋要對中指有點困難的感覺，從預備姿勢開始，就會感覺稍微往內，除非要用力往外撐，是不是因為髖內轉角度受限？\n\n垂直腿推 80 公斤，4 組，每組 10 下。\n今天把原本有一點壓縮空間的軟鞋墊換掉，換成比較扁、沒有壓縮空間的硬鞋墊，感覺腳底變穩定了；但是因為鞋墊不夠寬，所以最後一組腿推直接把全部鞋墊都拿掉了，感覺最後一組推起來竟然比前面輕鬆。不過這雙鞋的布料太薄、太軟了，用力的時候會被我撐開變形。是不是該買一雙硬舉鞋了？\n\n負重棒式20 公斤，四組，每組一分鐘。\n一開始做覺得這個重量的感覺好像變輕了，不過四組做完還是蠻累的。\n\n哥本哈根側棒式有一陣子沒做了，做起來有點累，兩組各 40 秒。\n\n跑步機：\n1. 速度：4.5 公里（走的速度）\n2. 坡度：2\n3. 時間：20 分鐘\n4. 心跳：130 左右\n5. 其他細節：鞋墊拿掉後，腳底就沒有那麼滑了，感覺舒服很多\n", "2026-05-30": "# 2026年5月30日星期六\n\n今天的熱身：\n1.滾筒開胸\n直接到板凳上做，但做起來卡卡的，不知道為什麼。\n2.側棒式前鋸肌支撐\n每邊兩組，每組 40 秒\n\n3.啞鈴上胸臥推\n兩組，每組 7.5 公斤，10 下\n\n以下是今天教練課內容，第一項是風車的姿勢調整與幾個注意事項：\n\n1.往正上方伸直的那隻手要從肩胛骨發力，把重量推出去，這樣在做的時候肩膀才不會卡住或產生彈響。\n2.動作過程中要很用力，做完肩膀會很痠。\n3.髖部是往持重手的那邊推，另一隻手則是往同側腳下延伸。\n只要維持從頭到尾都用力地往外撐，肩膀就不太會有彈響了。\n\n接著做槓鈴划船，整個預備姿勢跟 RDL 都一模一樣。\n一直到出槓之後，把槓往下，接下來上下半身不動，跟 RDL 一樣要維持背部跟腿部的用力，要支撐繃緊。然後感覺是用手肘跟手腕往肋骨方向拉，這個動作是要慢慢拉，會撞到肚子，不像實力推那樣有一點爆發。\n做完之後，大小圓肌、前鋸肌，還有背闊肌比較上緣的地方會比較有感覺。\n\n今天做 30 公斤，雖然重量感覺不重，但是肌肉感受度蠻好的。如果越做越覺得加重的時候，上半身越挺越高，那就是重量太重了。\n\n接著做分腿蹲的姿勢調整：\n\n1.後腳要稍微打開一點，不要太接近前腳，要維持一點寬度。\n2.後腳要墊高一點。\n3.前腳在下蹲的時候，要感覺膝蓋有一點往外。\n4.髖部是往前腳的方向轉，但要避免大拇指球沒踩穩，一定要把它踩實。\n這個姿勢會感覺到臀肌有比較大程度的拉伸，這樣可以練到髖內轉。\n\n接著做雙槓臂屈伸器械輔助的雙槓部分要轉到往外，而不是往內。然後大概跪在墊子深度的一半，後腳交叉，膝蓋要靠攏。\n上半身挺直，稍微往前傾（有點像在做髖屈），要把肩膀跟背部用力撐起。往下放的時候，像臥推一樣把手肘往外打開，下到大約會開始要聳肩的那個位置，就可以往上推。會感覺大小圓肌、前鋸肌，還有背都蠻有感覺的，以及胸的下緣。不過今天可能是接在划船後面，背的感覺比較多，之後可以做練胸肌的收尾動作\n\n教練課後的訓練：\nCable三頭（32 公斤）與 Cable 面拉（18 公斤）做超級組，各 4 組，每組 10 下\n\n坐姿划船：45 公斤，3 組，每組 10 下\n跑步機（用走的）：\n1.速度：4.5 公里\n2.時間：15 分鐘\n", "2026-06-01": "# 2026年6月1日星期一\n\n今天的熱身：\n坐姿的 90/90 加寬伸，兩三組，每組 10 下\n採跪姿，後腳交叉，拉伸臀肌跟闊背肌\n\n背槓深蹲：\n1. 100公斤\n(a)第一組：2 下\n(b)第二組：3 下\n2. 95公斤：一組 5 下\n3. 90公斤：兩組 6 下\n第四組開始就好喘，不知道為什麼\n\n滑輪下拉寬距對握：\n1. 45公斤：兩組，每組 10 下\n2. 52公斤：兩組，每組 10 下\n卡45好一陣子了今天加重還可以\n3. RDL 60公斤：三組，每組 5 下\n\n分腿蹲：\n1.雙手各 7.5 公斤：10 下\n2.雙手各 10 公斤：10 下\n共兩組\n\n跑步機：\n用走的速度 4 公里，坡度 2，心跳 130 左右，25 分鐘\n", "2026-06-02": "# 2026年6月2日星期二\n\n今天的熱身：\n滾筒開胸\n站姿的風車（三組，每組各 10 次）\n\n槓鈴臥推：\n1. 65公斤：一組 3 下\n2. 67.5公斤：一組 2 下\n3. 70公斤：一組 2 下\n\n肩推：\n1. 第一組：15 公斤，10 下\n2. 後面三組：20 公斤，10 下\n最後一組才想到，小手臂要往前推\n前面三組左肩的彈響蠻多的。最後一組小手臂稍微做了一點點調整之後，有好一點點，不過最後一組做起來沒有很穩。\n\n哥本哈根側棒式兩組，一組 40 秒。\n\n器械輔助雙槓臂屈伸 4 組：\n1. 第一組：負 64 公斤，10 下\n2. 後面三組：負 59 公斤，10 下\n下胸的發力在過程中還是稍微模糊了點，可能需要一點時間適應。不過做完是有充血感，蠻好的。\n\nCable 二頭，四組：\n1. 第一組 32 公斤 10 下\n2. 第二組 38 公斤 10 下\n3. 第三組 38 公斤 8 下\n4. 第四組 32 公斤 8 下\nCable 面拉，四組：\n18 公斤，每組 10 下\n這兩項做超級組。\n\n跑步機（用走的）：\n1. 速度：4 公里\n2. 坡度：3\n3. 時間：15 分鐘\n4. 心跳：130 上下\n", "2026-06-03": "# 2026年6月3日星期三\n\n今天的熱身：\n\n1.滾筒放鬆背部\n2.滾筒開胸\n坐姿的 90/90 加髖伸：3 組，每組 10 下\n\n今天的教練課內容：\n\n1.靠牆的 90/90 呼吸\n這項在之後的深蹲之前要記得做。動作是背靠著牆，膝蓋與牆、地板約成 90 度，然後持重物在胸口前方，做往後跟側面擴張的呼吸。\n\n2.槓鈴深蹲\n今天做到 102.5 公斤。蹲之前的呼吸要維持，吸氣要慢，往盆底肌吸，以維持全行程的張力。\n可能是昨天有做哥本哈根側棒式的關係，今天教練幫忙做了分腿蹲的大腿外側啟動：\n1.套著彈力繩，把前腳往內側施一個力\n2.往下蹲時，大腿要往外側用力\n\n接著做坐姿腿踢，主要重點也是著重在大腿後側。\n注意事項如下：\n1.不要向凳子施加過多壓力\n2.要雙手緊握著扶手\n會很喘是正常的。\n\n3.接著做腹部往下、靠近大腿位置的按壓拉伸。可以拿那個小的鑄鐵壺鈴把手，然後平躺著壓，會覺得痠痠的。做多了核心的支撐跟腹式的呼吸，那邊會緊繃。\n\n如果深蹲或其他動作做著做著，覺得核心支撐變差的話，可以去做一次靠牆的 90/90 呼吸，然後再接著做。\n\n做實力推時，如果肩膀彈響，可以做槓片的環繞動作：從身體後方繞到側面，再到身體上方。\n\n以下是教練課後的訓練內容：\n\n1.器械輔助的引體向上\n(a) 負 59 公斤：2 組，每組 10 下\n(b) 負 54 公斤：2 組，每組 10 下\n感覺後面兩組加了手套之後，手握的變得沒辦法那麼滿，導致小手臂反而發力更多。\n\n坐姿划船 45 公斤，4 組，每組 10 下。\n今天縮短一點休息時間，從 2 分鐘縮到 1 分半左右。再加上接在引體向上後面做，所以比平常更疲勞一些。\n\nCable 山頭 32 公斤，3 組每組 10 次。同樣縮短組間時間，從 2 分鐘減到 1 分半，今天少做一組。\n\n感覺兩項縮短組間時間的項目，充血感好像都比平常更好。\n\n跑步機用走的速度 4 公里，坡度 3，時間 15 分鐘，心跳不到 130。\n", "2026-06-04": "# 2026年6月4日星期四\n\n今天的熱身：\n1.滾筒放鬆背部\n2.滾筒開胸\n3. Shoulder CARs（三組）\n(a)第一組：1.25 公斤，10 下\n(b)後面兩組：1 公斤，10 下\n這個在側面跟地板平行的角度，要換面的那個動作，肩膀會卡一下，兩邊都會\n\n站姿風車，持重 2.5 公斤，三組每組 10 下\n今天風車做完還是滿身大汗，不過有比較流暢一點\n\n槓鈴臥推：\n1. 第一組：70 公斤，2 下（第三下沒推起來）\n2. 第二組：62.5 公斤，6 下\n3. 第三組：60 公斤，5 下\n今天推到兩手手腕都不太舒服，就沒繼續推了。\n\n實力推20 公斤：3 組，每組 10 下\n右手手腕真的受傷了，拿東西的角度會有點痛，所以不練了。\n\n跑步機用走的：\n1. 速度：4.5 公里\n2. 坡度：3\n3. 時間：20 分鐘\n4. 心跳：都在 120 出頭\n", "2026-06-08": "# 2026年6月8日星期一\n\n今天的熱身：\n坐姿的 90/90 加髖屈伸共三組，每組 10 下左右各 5 下\n\n背槓深蹲 85 公斤，共三組：\n1. 第一組 7 下\n2. 後面兩組各 6 下\n\nRDL 3 組 50 公斤，每組 6 下。\n測試一下現在手腕的狀態能不能拉，感覺是沒什麼影響\n\n滑輪下拉：\n1. 第一組：45-50 下\n2. 第二組：50-52 下\n3. 第三、第四組：45-50 下\n感覺手腕好像也沒有不舒服只要手腕有固定好\n\n坐姿腿屈伸三組：\n1. 前面兩組：32 公斤，10 下\n2. 最後一組：38 公斤，10 下\n這個抓握把也還可以，手腕不至於會痛\n\n直臂下壓跟 Cable 二頭沒法做，會痛。\n\n器械辅助引体 -59 公斤，四组每组十下。\n\n跑步機：\n1. 速度：4 公里\n2. 坡度：3\n3. 心跳：135 左右\n4. 時間：30 分鐘\n", "2026-06-10": "# 2026年6月10日星期三\n\n今天的熱身：\n90/90，坐姿的 90/90 加髖屈伸，共三組：\n1.每組 10 下\n2.每邊 5 下\n\n今天的教練課內容：\n\n首先要著重做四足跪姿。在做四足跪姿的時候，上半身的手應該要感覺是四個手指的根部往地板用力，但我會習慣性地變成手掌根部用力。這個要改善，支撐的時候整個脊椎要放鬆、往下放鬆，然後頭要抬起來，與地板平行。\n\n每次訓練都要做靠牆的 90-90 呼吸。在吸氣時要放鬆，才能把氣傳得更往下。\n\n接著做背槓深蹲。\n第一個是起槓時要鑽進去，身體要先進去，手再握，這樣就不會有先握槓、導致身體進去時會轉動到槓鈴的動作。\n再來是要找起槓的支撐點：\n1.可以先用單腳鑽進去，找好骨頭的支撐點\n2.接著將頭向上延伸，往上轉\n3.最後把另外一隻腳跟著進去\n這個還要再多試幾次，今天練習的時候，可能還是會有一部分壓在骨頭上。\n呼吸一樣要慢，膝蓋也要控制好，不要過度往前或左右晃動。\n\n接著做雙腳都站在地上的啞鈴單腳 RDL（直腿硬舉）。\n後腳可以靠前腳近一點，預備姿勢時，感覺重心都在前腳上，後腳只有腳尖點地。\n動作要領如下：\n1.往下做單腳 RDL 時，會感覺臀肌外側跟足弓特別痠。\n2.骨盆要往前側腳的方向轉，膝蓋不能往前爆衝。\n3.要用腳把身體踩起來。\n4.往下時，後腳要跟著膝蓋彎曲，這樣重心才能盡量穩定在前腳。\n5.要在大拇趾球可以穩定踩在地上的情況下，將膝蓋往外用力\n\n6.坐姿側平舉：\n(a)現在坐在紅色的椅子上，腳踩在腳踏上，往後坐一點，身體維持前傾。\n(b)從 2.5 公斤的啞鈴開始，往身體前方約 45 度平舉。\n(c)要感覺到肩膀在用力，往下放的時候不要放到最底端，要維持張力的狀況再往回舉。\n(d)動作時應該是三角肌的前束跟中束會酸，而不應該是斜方肌酸\n(e)動作過程中不可以用甩的\n(f)肩膀很容易冷掉，所以組間休息最好抓在一分鐘左右就好\n\nCable三頭下壓（意外的手腕是沒有受到影響的動作）\n這個動作要注意，需要特別沈肩，三頭感受度會更好。教練說我右邊會跑掉，所以可以右邊對著鏡子看自己的動作\n\n以下是教練課後的訓練：\n\n1.滑輪下拉\n(a)第一組：45 公斤\n(b)第二、三組：52 公斤\n(c)最後一組：45 公斤\n(d)每組次數：10 下\n\n2.坐姿划船\n(a)手腕會痛，沒法做。\n\n3. 器械飛鳥夾胸\n(a) 終於找到一個我現在能做的跟胸有關的訓練\n(b) 第一組：25 公斤，10 下\n(c) 第二組跟第三組：32 公斤，10 下\n\n2. 坐姿腿屈伸\n(a) 38 公斤，10 下，共兩組\n\n3. 器械：飛鳥夾胸\n(a) 再補三組\n(b) 32 公斤，每組 10 下\n感覺這重量有點偏輕了\n\n2. 跑步機：\n(a) 用走的速度：4 公里\n(b) 坡度：3\n(c) 時間：15 分鐘\n(d) 心跳：130 左右\n", "2026-06-11": "# 2026年6月11日星期四\n\n今天的熱身：\n1.滾筒放鬆背部\n2.滾筒開胸\n3.站姿風車：4 組，每組 10 次（持重 2.5 公斤啞鈴）\n4.坐姿啞鈴側平舉：2.5 公斤，4 組，每組 10 下\n5. 90/90靠牆呼吸：持重 4 公斤，2 組，每組 10 次呼吸\n\n硬舉 80 公斤，3 組，每組 6 下，用助力帶，手腕沒有不適\n\n器械輔助引體向上：\n禮拜一做的時候手腕不會不舒服，不過今天不知道為什麼覺得怪怪的，就不做了。\n\n跑步機用走的速度 4 公里，坡度 5，持續 15 分鐘，心跳在 130 左右\n這次買的新鞋，鞋底明顯比較硬一點，感覺蠻好的。\n", "2026-06-16": "# 2026年6月16日星期二\n\n今天的熱身：\n坐姿的 90/90 加髖屈伸，共三組。每組 10 次（每邊 5 下）。\n滾筒放鬆背部與開胸\n靠牆的 90/90，手持 4 公斤壺鈴做一組 10 次呼吸\n\nRDL 50 公斤：\n1. 第一組 6 下\n2. 後面兩組 8 下\n今天還是覺得腰跟屁股交界那邊疲勞感\n\n機械輔助引體向上：\n1. 第一組：-50 公斤，10 下\n2. 第二組：-50 公斤，10 下\n3. 第三組：-54 公斤，10 下\n\n滑輪下拉想用助力帶，所以今天換用銀色橫桿。\n握法：\n握在轉角處，拇指放在轉角光滑處。\n訓練內容：\n1. 45 公斤：10 下，2 組\n2. 38 公斤：10 下，3 組\n這個角度感覺只能拉到眼睛到鼻子的位置，再往下就很困難。45 公斤有點拉不太下來大概都是眼睛到鼻子的那個位置，38 公斤則勉強還可以再往下一點\n\n飛鳥夾胸 38 公斤，三組，每組 10 下。這個重量比上一次更合理一點\n\n器械側飛鳥機 11 公斤，每組 10 下，共 5 組。\n這個機器做起來有點奇妙，下放一點點手就靠在身上，沒張力了。\n\n飛鳥夾胸 38 公斤，10 下，再補 3 組。\n最後兩組的最後幾下有點吃力。\n\n大概從滑輪下拉開始，又會感覺到左右背不太平衡，左邊比較酸，好像做滑輪下拉時比較常會有這個感覺。\n\n另外，在做夾胸的時候，也會覺得後面支撐的感覺是左邊會酸。不知道是不是歪一邊，可是看鏡子都看不出來。\n\n跑步機用走的：\n1. 時速 4公里\n2. 坡度 5\n3. 時間 15 分鐘\n4. 心跳在 130 到 135之間\n", "2026-06-17": "# 2026年6月17日星期三\n\n今天的熱身內容：\n\n1. 滾筒放鬆背部與滾筒開胸\n2. 坐姿 90/90 加髖屈伸\n三組，每組 10 次（一邊 5 次）\n3. 靠牆 90/90 呼吸\n兩組，每組 10 次呼吸\n\n以下是教練課內容：\n1. 扶牆單腿小腿提踵\n用兩塊斜板堆成平的，遠端放壺鈴壓住，然後在上面做單腳的提踵\n\n接著做另外一種後腳抬高蹲，做法是把前側腳的腳跟離地抬高做分腿蹲，對側手持重 4 公斤壺鈴。\n要注意一下，往下放時膝蓋要往外用力，但要維持大拇指球踩地，臀肌會很有感。今天這個做三組就把體力操爆了，沒法繼續進行。\n\n感覺像是做完時有一點累，臀部很痠。然後接著感覺休息兩三分鐘可以回來，但兩三分鐘後開始有一點頭昏眼花、無力然後看手錶，發現心跳感覺是往下掉的，掉到 90 幾。最後是喝了飲料後有好很多。\n\n接著針對躺平時腿後側沒法靠牆、沒法貼緊的問題，要做「靠牆 90/90 呼吸」。\n要點如下：\n1. 著重在大腿。\n2. 腳要蹬地。\n3. 腿後側要有發力感，要很用力，不能只是維持姿勢。\n然後臀肌周圍，跟上次做的一樣，用壺鈴放鬆\n靠近鼠蹊部的部位要持續放鬆。\n\n接著做了一下器械，是肩部有墊子的那種飛鳥。\n做的時候要注意以下幾點：\n1. 要找到坐骨支撐。\n2. 飛鳥器械要在身體正側面。\n3. 下放時稍微靠到身上沒關係，只要維持肩部張力就可以了。\n4. 往上時大概到平舉就行，再往上就會有大量的斜方肌介入。\n", "2026-06-20": "# 2026年6月20日星期六\n\n今天的熱身：\n\n1.滾筒放鬆背部與開胸（今天胸椎感覺比較緊一點）\n2.筋膜球放鬆屁股\n3.趴姿後腳交叉，拉伸臀肌跟背闊肌\n4.坐姿 90/90 夾髖屈伸：兩組，每組 10 次（每邊 5 次）\n5. 90/90靠牆呼吸：持重 4 公斤，兩組，每組 10 次慢呼吸，要維持大腿後側張力\n\n背槓深蹲：\n1. 100 公斤：3 下，兩組\n2. 90 公斤：6 下，兩組\n3. 85 公斤：6 下，一組\n前面幾組到最後也是有點忘記要特別 cue 大拇指球，到最後一組才想起來。\n今天的熱身重量太多種、太多組了，有點浪費時間跟體力。\n\n垂直腿推：\n1. 80 公斤：10 下，一組\n2. 90 公斤：10 下，兩組\n換新鞋後，這個做起來腳底的部分感覺比較有安全感，沒有那種整雙鞋好像要解體的感覺。\n\n器械輔助引體：\n1. 負 50 公斤，兩組 10 下\n2. 負 54 公斤，兩組 10 下\n\n3. 器械飛鳥夾胸：38 公斤，10 下，3 組\n\n4. Cable 三頭下拉：\n(a) 第一組：25 公斤，10 下\n(b) 後續三組：32 公斤，10 下\n\n3. 跑步機：\n(a) 用走的，時速 3 公里\n(b) 坡度 15，持續 15 分鐘\n(c) 心跳 130 左右\n", "2026-06-22": "# 2026年6月22日星期一\n\n今天的熱身：\n\n1. 筋膜球放鬆臀部\n2. 靠牆 90/90 呼吸：10 次為一組，共兩組\n3. 趴姿後腳交叉，拉伸臀肌跟背闊。\n4. 滾筒放鬆大腿前側跟外側\n\n槓鈴硬舉：\n1. 90 公斤：2 組，每組 3 下\n2. 90 公斤：1 組，6 下\n最後是握不住，還有就是屁股上緣也就是一直說的，身體正後方跟腰的交界附近。應該是在骨盆的位置，高度沒有高過骨盆很痠。有特別 cue 大拇指球要用力，但是整個做完腿的刺激還是不多，不知道是重量問題還是姿勢問題。\n最後一組用拉力帶\n\n垂直腿推：\n1. 90 公斤，一組 12下\n2. 100 公斤，一組 10 下\n3. 90 公斤，兩組 10 下\n鞋子比較穩之後，感覺重量可以開始往上加\n久違的腿軟感出現了\n\n器械輔助引體：\n1. 負 54 公斤，3 組，每組 10 下\n2. 負 59 公斤，1 組，7 下\n3. 負 64 公斤，1 組，7 下\n\n坐姿腿後勾：\n1. 32 公斤，1 組 10 下\n2. 25 公斤，1 組 10 下\n3. 18 公斤，1 組 10 下\n太久沒做了，這個做得好吃力\n\n滑輪下拉（寬握對掌）：\n1. 第一組：52 公斤，10 下\n2. 第二組：45 公斤，10 下\n3. 後面兩組：38 公斤，10 下\n\n跑步機用走的速度，總共 20 分鐘：\n1. 前面 9 分鐘：速度 4，坡度 5，心跳 140 出頭\n2. 後面：速度 3，坡度 3，心跳降到不到 130\n", "2026-06-25": "# 2026年6月25日星期四\n\n今天的熱身：\n\n1. 滾筒開胸椎\n2. 趴跪姿後腳交叉\n3. 拉伸臀肌和背闊肌\n4. 坐姿 90-90加寬屈伸：兩組，各 10 次\n5. 靠牆 90-90 呼吸：兩組，各 10 次\n\n6. 小手臂訓練：\n(a) 小手臂手掌向下支撐的側放式\n(b) 與原來的前鋸肌側放式基本一樣，只是手掌轉向下方，要往地上支撐手掌要出力今天做起來，右手手掌有點沒辦法處理，左手可以。\n\n(c) 彈力繩加壺鈴的倒水姿勢：\n用彈力繩穿過壺鈴把手，雙手手臂與手肘固定在身體兩側，接著用手腕往內做倒水的動作，再往上轉回去時，要注意是小手臂在動作，手肘不能動\n\n接著做背槓的深蹲。\n今天的重點問題是：下去時還是會鬆掉，所以要做在下面停頓一秒的版本來改善。另外，出槓時還是沒有很穩，且今天做起來感覺比平常稍微喘一點。\n\n接著做一樓的哈克深蹲，靠外側的那一台。腳踩在大約第三條或第四條線下方，向下放的時候要放到水平，甚至稍微再往下點。\n動作要領如下：\n1. 髖部不動、固定住\n2. 整個背要貼牆，像在做靠牆呼吸那樣\n骨四頭很有感，尤其是下趨的那一段，是不太熟悉的发力位置，20 公斤就蠻有感的。\n\n接著做 45 度的腿推，大致上跟垂直腿推其實沒什麼不同，就是角度不太一樣。\n關於保護槓的設置：\n1. 除了踢到最上方有一段之外\n2. 中間還有一段\n3. 接下來就是要放到最低了\n這臺好像沒有線，位置比較不好對。\n\n器械輔助引體向上：\n負重 59 公斤，共 4 組\n1. 前面兩組：12 下\n2. 後面兩組：10 下\n\n滑輪下拉：\n1. 第一組：45 公斤，8 下\n2. 後面三組：38 公斤，10 下\n引體向上：\n1. 第一組：10 下\n2. 接在引體後面沒有額外休息，做起來有點吃力\n", "2026-06-27": "# 2026年6月27日星期六\n\n今天的熱身：\n\n1.先用筋膜球放鬆臀部\n2.做趴跪姿的臀部跟後背拉伸\n3.做 90-90 的靠牆呼吸\n(a)持重 4 公斤\n(b)做兩組，每組 10 次呼吸\n4.做後腳抬高蹲姿勢的大腿前側拉伸\n5.啞鈴 Y-Raise：\n(a)兩組，2.5 公斤\n(b)每組 10 下\n\n以下是今天的教練課內容：\n\n1.站姿風車（用壺鈴 4 公斤）\n(a)感覺這個動作用壺鈴做好像比較順暢一點，跟之前用啞鈴 2.5 公斤做起來的感受差不多\n(b)上面的那隻手手肘要微彎，不能靠反打撐著負重，要讓手也參與負重\n(c)在微彎的狀態下，要感覺肩膀往上推，這部分感覺比較困難一點\n\n接著做 cable 的 Y-raise，發力角度跟啞鈴有一點點不太一樣，主要是感受到下斜方、中下斜方在發力。\n今天做左邊的時候覺得會發抖，感覺左邊弱很多，以後要從左邊先做。這次用的是那個迷你啞鈴的塑膠握把\n\n接著嘗試做槓鈴的臥推，但在推到最上面的時候，那個角度對我現在的手腕傷還是有點壓力，所以就沒做了。\n\n接著做地雷管的肩推，有幾個重點：\n1.身體要維持與地板垂直\n2.手送出去直到手臂伸直時，才把身體送出去\n3.骨盆也要控制維持（穩定）\n4.腳的重心大概是前後各一半\n\n5.器械輔助引體有幾個重點：\n(a)要拉到下巴超過握把的高度\n(b)手肘要在身體前面\n(c)頭要挺直\n(d)上半身是微微向後折的感覺\n(e)握的角度\n現在我會太過強烈，想要把手指握得更多，應該要回正一點。一開始可能會覺得比較沒有安全感，但實際拉起來時，並不會覺得不穩。\n接著嘗試做窄握、反握的引體，不過手有點不太舒服，就沒做了\n\n教練課後的訓練內容：\n1.坐姿划船\n(a) 38公斤：1 組 10 下\n(b) 45公斤：3 組 10 下\n感覺這動作現在可以做了，手沒有壓力也不會痛\n\nCable三頭跟器械飛鳥夾胸做超級組：\n1. Cable三頭\n(a)前面三組：32 公斤，10 下\n(b)最後一組：25 公斤，8 下\n2.飛鳥夾胸\n(a)前面兩組：38 公斤，12 下\n(b)第三組：38 公斤，10 下\n\n試了一下，直臂下壓，最後身體稍微往上改變角度，增加行程的那一段手會痛，就沒做了\n\n哈克深蹲 30 公斤，四組，每組 10 下。股四頭的充血感非常好，好久沒這麼脹了\n\n全程都要把注意力放在大拇指球上，只要大拇指球一偷懶，膝蓋就會覺得壓力非常大\n\n另外會覺得它對於股四頭靠近骨盆那一段的刺激比較小，不如坐姿腿伸展\n", "2026-06-29": "# 2026年6月29日星期一\n\n今天的熱身：\n\n1.筋膜球放鬆臀部\n2.趴跪姿後腳交叉，拉伸臀部和背闊\n3.滾筒放鬆背部與開胸\n(a)今天換了新滾筒，感覺更硬，效果更好\n4.滾筒放鬆大腿前側跟內側\n\n5.垂直腿推 100 公斤\n(a)前面三組，每組 10 下\n(b)第四組 8 下\n(c)今天測試，下放時吸氣，不要閉氣；到底時直接往上推並吐氣，就沒有頭脹的感覺了不過今天的重心感覺踩在前側太多，腳跟沒有用力的比例有點低，所以今天感覺股四頭肌的比例比較多。\n\n器械輔助引體：\n1.負 54 公斤，3 組 10 下\n2.負 59 公斤，1 組 10 下\n(a) 今天做起來，二頭有一點酸，不過主要的感受度還是在背的上半部\n\n哈克深蹲：\n40 公斤，3 組，每組 10 下\n做起來確實感覺膝蓋有一點壓力\n\n坐姿划船 45 公斤，4 组，每组 10 下。\n\n跑步機用走的速度 4 公里，坡度 4，20 分鐘。心跳在 140 左右，降到 136 左右\n", "2026-06-30": "# 2026年6月30日星期二\n\n今天的熱身滾筒開胸椎。這滾筒比較厚一點，做起來感覺不太一樣\n\n以下是一樓的飛鳥機，第一項：\n飛鳥側平舉\n20 公斤，四組，每組 10 下\n飛鳥夾胸：\n1. 第一組 35 公斤，10 下\n2. 第二組 40 公斤，10 下\n3. 第三組 45 公斤，10 下\n4. 第四組 50 公斤，10 下\n5. 第五組 50 公斤，10 下\n\n這臺機器第一次做，感覺角度抓不太到，對胸部的刺激度比較沒那麼強感覺手借力的比例比較多一點，不知道是不是姿勢沒弄對。胸部一樣是有充血感，但是沒有三樓那一臺的孤立感那麼好\n\n三樓的肩側飛鳥機：\n1. 第一組：11 公斤，10 下\n2. 後面三組：18 公斤，10 下\n\nCable 三頭，四組：\n1. 前三組：32 公斤，10 下\n2. 第四組：32 公斤 7 下，接著 25 公斤 3 下\n\n以上與 Cable Y-Raise 做超級組：\nCable Y-Raise 空重空載，6 下，共三組\n", "2026-07-01": "# 2026年7月1日星期三\n\n今天的熱身：\n1.坐姿 90-90 髖伸展加髖屈伸：兩組，每組 10 次\n2.靠牆 90-90 呼吸：持重 6 公斤，三組，每組 10 次呼吸\n3.滾筒開胸放鬆大腿前側\n\n今天的教練課內容：做背槓深蹲。\n\n做一個躺著的臀推，把腳放在那個厚的軟墊上維持 90 度，然後分別做單腳與雙腳的臀推。\n\n還有一個重點是做腳跟往下支撐的呼吸，重點都在於腳跟往下踩，讓腿後側發力。臀推時要避免用肚子往前頂，而是要讓腳發力往前帶。\n\n另外，雙腳版本的臀推中間要夾著瑜伽磚。\n\n今天有抓到那個下去之後、要在上來之前鬆掉的感覺，有找到維持張力的方式。不過這樣做起來有點累，不太適應，最後蹲到沒力起不來。\n今天做的是 95 公斤，三組六下。第三組最後第五下就起不來了\n\n另外在剛開始深蹲時，覺得胸椎活動度變差了，可能近期除了滾筒開胸椎以外，都沒有做到什麼胸椎活動度的訓練，所以今天多做了兩個。\n\n第一個是呈四足跪姿的姿勢，單手支撐，把另一手往支撐手的後側外部轉出去，帶著胸椎一起轉，然後把肩膀、手臂還有頭都著地。接著支撐手要把身體往後推，然後微微地含胸。\n\n另外一個是前後的跪姿：\n1.腳後側靠牆\n2.雙手往前平舉\n3.外側手往前延伸後，往外、向後打開\n注意髖部不能轉動，是身體連著頭一起向後轉，然後再回來。\n\n墊腳尖含上半身旋轉的分腿蹲\n前後腳都墊腳尖，前腳墊高一點並避免膝蓋爆衝，後腳膝蓋要彎，然後雙手抱瑜珈磚從前腳側的外側上方，往下蹲的時候斜向往後腳側的外側後方\n\n這個動作應該是要前腳的後側鏈上緣張力要最強，不過今天做起來股四也加入很多\n\n教練課後的訓練內容：\n\n1.滑輪下拉 45 公斤，四組每組 10 下\n2.坐姿划船\n(a) 45公斤：10 下，兩組\n(b) 52公斤：10 下，兩組\n", "2026-07-02": "# 2026年7月2日星期四\n\n今天的熱身項目：\n1.滾筒放鬆背部與開胸椎\n2.啞鈴 Y-Raise（2.5 公斤）：三組，每組 10 下\n3.站姿風車（4 公斤）：兩組，各 10 次\n4.靠牆弓箭步開胸椎：兩組，各 10 次\n\n5.上斜啞鈴胸推（7.5 公斤）：四組\n(a)前面兩組：10 下\n(b)後面兩組：15 下\n最後一組感覺肩膀有跑出來，前面還可以\n\n2.坐姿啞鈴側平舉：\n(a) 5公斤：2 組，每組 10 下\n(b) 2.5公斤：2 組，每組 10 下\n\n3.坐姿胸推機\n(a)第一組：18 公斤，15 下\n(b)後面兩組：25 公斤，15 下\n\n坐姿直立的肩推機：11 公斤，3 組，每組 15 下\n\n反向飛鳥：25 公斤，3 組，每組 10 下\n\n飛鳥夾胸 4 組：\n1.前面兩組：42 公斤，10 下\n2.第三組：38 公斤，10 下\n3.第四組：32 公斤，10 下\n跟側平舉飛鳥機做超級組\n側平舉飛鳥機：18 公斤，3 組 × 10 下\n這個要坐前面一點，要讓手放在身體的正側方。如果手在偏前面的話，就比較沒感覺。\n飛鳥夾胸：今天有發現右邊的肩胛骨一直離開靠墊\n\n器械輔助的雙槓臂屈伸：\n1. 第一組：負 73 加 extra 10 下\n2. 後面兩組：負 73 公斤 10 下\n\n今天做了一些降重的推類，做起來手大致上沒有什麼壓力跟不適感\n\n跑步機用走的 15 分鐘，速度 4 公里，坡度 4，心跳 130 左右\n", "2026-07-03": "# 2026年7月3日星期五\n\n今天的熱身：\n\n1.坐姿 90-90 加髖屈伸：兩組，每組 10 次\n2. 90-90靠牆呼吸（搭配 4 公斤壺鈴）：兩組，每組 10 次呼吸\n3.滾筒放鬆：大腿前側與內側\n\n這幾天那邊又跑出來，放鬆之後感覺好一點\n\n槓鈴深蹲 95 公斤，三組，每組 6 下。\n今天好像比較有感覺到下去之後，在底下要維持張力的感覺。\n\n哈克深蹲 40 公斤三組，每組 10 下。\n第一組靠墊角度比較高，感覺比較輕鬆；後面兩組把靠墊打到最平，股四頭肌的刺激跟孤立感差很多。做完第三組後頭有一點痛，感覺跟做垂直腿推的情況一樣可能要改成不憋氣的方法\n\n滑輪下拉：\n1.第一組：45 公斤，10 下\n2.第二、三組：52 公斤，10 下\n3.第四組：45 公斤，10 下\n之前覺得重量沒有很重，沒有把腳卡好。今天把大腿塞緊，腳掌也用力向地板貼住，做起來穩定很多，好像也沒有那麼強烈地偏向左邊，雖然感覺還是沒有很平均\n\n坐姿腿後勾（器械腿後勾）：\n1. 18公斤：兩組，每組 10 下\n2. 11公斤：兩組，每組 10 下\n感覺這次做輕一點的重量，腿後側的感受度就很好，也不會像之前加大重量那樣，感覺膝蓋不舒服，或有其他地方（像小腿之類）代償很多\n\n站姿提踵機：\n1.第一組：66 公斤，10 下\n2.第二組：79 公斤，10 下\n3.第三組：93 公斤，10 下\n雖然有一陣子沒做，但感覺刺激感變小了\n\nPanata Tbar Row：\n1.第一組：空槓 10 下\n2.第二、三組：10 公斤 10 下\n3.第四組：15 公斤 10 下\n一直覺得背闊中下部比較沒有疲勞感，但今天在做這臺機器的時候，第二組就有很明確且明顯的酸脹感。感覺這一組用對握的方式，對背闊中下段的刺激度很強，像 Cable 划船跟槓鈴划船好像都沒有這麼強。\n\n一樓的 Leg Curl 單腿腿後勾器械：\n1.前面兩組：10 公斤，10 下\n2.第三組：5 公斤，10 下\n試了一下分腿的腿後勾，才發現左右有一點落差，左腳明顯比較弱。不知道是不是因為這樣，所以左腳後勾時，膝蓋比較容易不舒服。\n", "2026-07-04": "# 2026年7月4日星期六\n\n今天的熱身：\n1. 滾筒放鬆背部\n2. 滾筒開胸\n3. 站姿風車：4 公斤壺鈴，兩組各 10 下\n用 15 公斤的槓鈴做了幾下槓鈴臥推的測試，推到最頂端會有一點緊緊的，但比上次還要再好一點。\n\n上斜啞鈴胸推：\n10 公斤，3 組各 10 下\n\nPanata Standing Multi-Flight 做飛鳥夾胸：\n1. 45 公斤：1 組 10 下\n2. 50 公斤：2 組 10 下\n3. 45 公斤：1 組 10 下\n\n器械胸推：\n1. 第一組：25 公斤，10 下\n2. 後面三組：32 公斤，10 下\n3. 最後一組：32 公斤，15 下\n\n啞鈴側平舉：5 公斤，3 組，每組 10 下\n\nPanatta Standing Fly（Standing Multi Flight）做反向飛鳥找不到角度，做起來感覺力量還是都在三角肌的前、中束。\n目前訓練狀況：\n兩組 20 公斤，各 10 下\n\n三樓坐姿肩推：\n1. 18 公斤：一組，各 10 下\n2. 25 公斤：兩組，各 10 下\n\n三樓飛鳥機的反向飛鳥：\n1. 25 公斤：1 組，10 下\n2. 32 公斤：2 組，10 下\n3. 38 公斤：1 組，10 下\n最後一組 38 公斤，比較接近應該有的正式組強度\n\nCable Y Raise 空重第一組 10 下，後面兩組 6 下。\n今天做起來很明顯感覺左邊很快就沒力了，右邊做完同樣組數都還感覺輕鬆。\n\nCable 三頭下拉：\n1. 32 公斤：2 組，每組 10 下\n2. 第 3 組：32 公斤 7 下，隨後接 25 公斤 3 下\n3. 第 4 組：25 公斤 10 下\n\n跑步機用走的，紀錄如下：\n\n1. 速度：4 公里\n2. 坡度：5\n3. 時間：15 分鐘\n4. 心跳：從 120 左右，最後拉到 130 左右\n", "2026-07-06": "# 2026年7月6日星期一\n\n今天的熱身：\n1.滾筒開胸，放鬆背部\n2.坐姿 90-90 加髖屈伸：兩組，各 10 下\n3.手拿 6 公斤壺鈴，靠牆 90-90 呼吸：兩組，各 10 下\n4.筋膜球放鬆臀部、滾筒放鬆股四頭肌\n5.靠牆半蹲開胸椎：一組，共 5 次\n\n背槓深蹲：\n1. 100公斤一下\n2. 110公斤一下\n3. 115公斤一下\n4. 120公斤一下\n5. 100公斤6下\n今天前面背起來感覺狀況不錯，就試著往上加重量，一直到 120 那一下，從底部上來的感覺好像動作沒有那麼穩好像上半身鬆了\n\n啞鈴單腳臀推 12.5 公斤，兩組各 10 下。\n感覺很久沒做，有點陌生，啞鈴放的位置有點抓不太到：\n1.放在前面：頂起來的時候，手有一點夠不到\n2.放在後面：會卡到\n\nPanatta T-Bar Row：\n1. 20公斤：1 組 10 下\n2. 30公斤：1 組 10 下\n3. 20公斤：1 組 10 下\n今天做起來好像沒有上一次對闊背中下的孤立感這麼強，這次感覺上半段也蠻多的，不知道是不是那個靠凳角度的關係\n\n坐姿腿伸展：\n1.前面三組：32 公斤，10 下\n2.調整過程：\n(a)把靠在小腿前的支撐桿往上調了一格，感覺整個力臂變短，做起來變輕鬆\n(b)但是壓在那個位置沒肉會痛\n3.最後一組：再往下放，做起來還是最後一組比較有感覺\n另外今天椅子往前坐一格實驗看看，感覺好像也還可以。\n\n器械輔助引體：\n1. 第一組：54 公斤，10 下\n2. 第二組：49 公斤，10 下\n3. 第三組：54 公斤，10 下\n今天感覺手的比例比平常多一點\n\nCable 直臂下壓：\n1. 32 公斤：一組 10 下\n2. 25 公斤：一組 10 下\n今天做起來手好像不會痛了\n\n坐姿腿後勾：18 公斤，3 組，10 下\n", "2026-07-07": "# 2026年7月7日星期二\n\n今天的熱身：\n1. 滾筒放鬆背、滾筒開胸\n2. 手持 6 公斤壺鈴的站姿風車：兩組各 10 下\n3. 空槓的 Cable Y-Raise：兩邊兩組各 10 下還是感覺得出來，左邊沒力很多。\n\n槓鈴臥推 40 公斤，3 組，每組 6 下。今天試著加一點重量推推看，手感覺是沒什麼問題，推的過程中不會痛，但是某些日常旋轉的動作還是會有點痛。\n\nPanatta Standing Multi-Flight 做飛鳥夾胸 50 公斤：\n1. 第一組：12 下\n2. 第二組：10 下\n3. 第三組：10 下\n\n3 樓的器械胸推：\n• 38 公斤：1 組 10 下\n• 32 公斤：3 組 10 下\n\n三樓的器械肩側飛鳥：\n1. 18 公斤：1 組 10 下\n2. 25 公斤：2 組 10 下\n3. 32 公斤：1 組 10 下\n今天做起來感覺肩的刺激變小了，想加重量，重量加上去，斜方就變多了肩膀的刺激，也強很多。\n\n器械蝴蝶機做反向飛鳥：32公斤，10 下，4 組。\n這個動作感覺好像斜方肌也會用力穩定。\n\n直立坐姿的肩推機：\n• 25 公斤：10 下，1 組\n• 32 公斤：10 下，2 組\n25 公斤做起來肩的疲勞感不明顯，32 公斤今天的感覺就很明顯，然後三頭也加入了。\n\nCable 三頭下拉：\n• 32 公斤：1 組 10 下\n• 25 公斤：2 組 10 下\n不知道是不是擺在練胸跟肩後面？感覺這兩次的三頭做起來都比之前吃力。\n\n風扇車 20 秒衝刺、40 秒休息，三組。今天做起來有點吃力。\n\n跑步機用走的，坡度 5、速度 4，前面心率大概接近 140，後面降到坡度 4、速度 3，心率降到 130 以下，總共 15 分鐘。\n", "2026-07-08": "# 2026年7月8日星期三\n\n今天拉肚子，來看看狀況怎麼樣。\n\n今天的熱身：跑步機速度 4 公里，坡度 6，10 分鐘。用走的\n\n哈克深蹲：20 公斤，一組 6 下。\n不知道是不是昨天做了風扇車的關係，覺得今天膝蓋軟軟的，就先不做了。\n\n器械輔助引體：負 54 公斤，4 組，每組 10 下\n\nPanatta T-Bar Row 訓練紀錄：\n\n1. 重量與次數：\n• 前面兩組：20 公斤，10 下\n• 第三、第四組：30 公斤，10 下\n• 最後一組：20 公斤，10 下\n\n2. 動作感受與調整：\n前幾次做這個動作時，一直在尋找角度，對於背闊肌中下側的精準刺激感有點找不太到。\n\n今天試起來，刺激度最強的設定與姿勢大概是：\n• 靠墊由上往下固定在第四格\n• 上半身往前傾，膝蓋微彎，腿後側稍微有拉伸的感覺。\n\n不過這好像還是沒有第一次、前幾次做那一次刺激那麼明確。\n\n今天先到這好了，體力上感覺還可以，但是汗流特別多\n今天不練腿了。\n", "2026-07-10": "# 2026年7月10日星期五\n\n今天拉肚子痊愈後，練練看體力怎麼樣。\n\n今天的熱身：\n•滾筒放鬆背跟開胸（這次是我換新滾筒後，背拉得最開的一次）\n\n訓練項目：\n1. Cable Y-Raise：\n空重 3 組，各 10 下\n\n2.器械蝴蝶機飛鳥夾胸：\n•第一組：38 公斤，10 下\n•第二組：45 公斤，10 下\n•第三組：45 公斤，10 下\n•最後一組：38 公斤，10 下\n今天把椅子往上調一格，然後手握的姿勢調整了一下。\n還是感覺右邊的肩胛會想離開座位，不知道為什麼。\n\n器械胸推 38 公斤，4 組：第一組 10 下，後面三組 15 下。\n做這個也是，右邊的肩胛骨蠢蠢欲動，要有意識地把它固定住，不然肩胛骨還是會離開凳子。\n\n肩側飛鳥機 25 公斤，4 組。\n第一組 15 下，後面三組 10 下。最後兩組的最後幾下，左邊感覺快撐不住了，開始發抖。\n\n器械輔助的雙槓臂屈伸\n第一組，負 64 公斤，15 下。\n第二、第三組：負 59 公斤，10 下。\n從第二組後面開始越到後面，感覺手臂三頭肌用得越多。\n\n機械蝴蝶機反向飛鳥：38 公斤 4 組，每組 10 下\n這個動作反而是左邊會感覺胸好像要離開墊子。\n\n今天肩的充血感很好，胸的一般。\n體力大致上還算正常。\n", "2026-07-13": "# 2026年7月13日星期一\n\n今天的熱身：\n\n1. 滾筒放鬆背、滾筒開胸\n2. 坐姿的 90-90 加髖屈伸：兩組，每組 10 下\n3. 90-90 靠牆呼吸（手持 6 公斤壺鈴）：兩組，每組 10 次呼吸\n4. 後腳交叉拉伸：拉伸臀肌和背闊肌\n\n背槓深蹲：\n• 100 公斤1下兩組。\n• 105 公斤1下\n• 110 公斤1下\n100 公斤兩下，這組有點撐不住。\n80 公斤，一組 6 下連 80 公斤做起來都有點累。\n今天很明顯，睡不好，所以狀況還是不太好。最近越來越常這樣，希望手術後能改善。今天背槓背起來之後，在吐氣、重新吸氣的時候，都覺得吸不飽。\n\n坐姿腿後勾：\n1. 第一組：25 公斤，12 下\n2. 第二組：18 公斤，10 下\n3. 第三組：11 公斤，10 下\n感覺 25 公斤的時候，小腿就開始代償很多了。\n\n器械輔助引體向上：\n負54 公斤，共做 3 組：\n• 第一組：12 下\n• 後面兩組：10 下\n\n滑輪下拉：\n1. 第一組：45 公斤，10 下\n2. 後面兩組：38 公斤，10 下\n\n做寬距的反握。手受傷後，好久沒有做這個動作了，因為手轉不過來。今天做起來還算可以，但是我把腳固定好，還是覺得歪一邊，左邊比較痠。\n\n一樓的站姿分腿腿後勾：\n1. 第一組：10 公斤，10 下\n2. 第二組：5 公斤，10 下\n3. 第三組：空重，10 下\n感覺做起來，左腳那個有點卡的感覺又出現了，然後右腳好像也有一點\n\n槓鈴划船：40 公斤、4 組、每組 10 下。\n也是有好一陣子沒做這個動作了，是不是久沒做，突然做感受度都會很好？今天也是闊背的中下部感覺很好。\n", "2026-07-14": "# 2026年7月14日星期二\n\n今天的熱身：\n1.滾筒放鬆背和胸椎\n2.站姿風車：持 6 公斤啞鈴，兩組，每組 10 次\n3. Cable Y Raise（空重無負載）：\n(a)第一組：8 下\n(b)第二組：6 下\n(c)第三組：8 下\n今天下斜方的感覺很明顯，前兩次好像都沒那麼明顯然後左邊也是很快就覺得沒力了\n\n今天的訓練：\n蝴蝶機飛鳥夾胸，38 公斤，四組，第一組 15 下，後面三組 10 下。還是右邊的肩胛容易有要離開靠墊的感覺？第一組做完，覺得肘關節有很大壓力。後面幾組縮短行程，好像就比較不會。\n\n機械胸推\n第一組：38 公斤，15 下\n第二組 38 公斤 10 下\n第三、第四組：38 公斤，10 下。\n後面試著把氣吸飽一點再推，感覺推起來比較輕鬆。\n\n肩側飛鳥機：\n1. 32公斤：\n(a)第一組：15 下\n(b)後面三組：都是 10 下\n2. 25公斤：\n(a)第三組跟第四組的最後兩下只做了一半，起不來\n(b)感覺左手比右手要吃力\n這是第一次做這臺機器做到力竭。\n\n蝴蝶機反向飛鳥：\n1.第一組：38 公斤 15 下\n2.第二、第三組：38 公斤 10 下（這兩組最後兩下做不完，都只做半程）\n3.第四組：32 公斤 10 下\n\n雙槓臂屈伸（器械輔助）：\n1.第一組：負 54 公斤，12 下\n2.第二組：負 50 公斤，10 下\n第三組負 50 公斤 7 下\n第四組負 54 公斤 7 下\n後面兩組，試著把身體傾斜多一點、前傾多一點，然後下去的深度深一點，胸部的感覺才比較能跑出來。但推起來也比較累。\n\nCable的手腕尺偏下拉，空重無負載，兩組 10 下，兩組 20 下。\n\nCable的手腕橈偏下拉，空重無負載，3 組 20 下\n", "2026-07-15": "# 2026年7月15日星期三\n\n今天的熱身：\n1.趴跪姿後腳交叉拉伸臀肌跟背闊肌\n2.滾筒放鬆背跟抬胸椎\n3.滾筒放鬆大腿內側跟大腿前側\n\n再來做：\n1.坐姿的 90-90，加快屈伸，兩組各 10 次\n2.靠牆的 90-90 呼吸，6 公斤，兩組各 10 次呼吸\n今天在做這個的時候，覺得呼吸吸氣有一點受限\n\n今天的教練課內容：\n\n第一項做躺著的臀推。把厚軟墊放在腳跟底下，身體呈 90/90 躺著的姿勢，膝蓋中間夾一塊瑜伽磚。然後用腳尖、小腿向上勾（腳尖朝天），再用腳跟用力把屁股頂起來。\n\n注意屁股不要夾，上半身也不要用力。\n做分腿跟單腿的，這個動作可以放鬆後側跟屁股。\n\n接著做靠牆 90-90 呼吸的調整。\n主要是手和肩膀不要用力，要感覺到放鬆，只是把壺鈴推起來。\n另外，6 公斤可能太重，要先改用 4 公斤的。\n\n接著做抱藥球的分腿蹲加旋轉。\n主要是分腿蹲向前走，往下蹲的時候，身體要直直向下，不要讓膝蓋往前，重心在雙腳中間。\n往下蹲到底的時候，身體向外轉。一樣抱著藥球的時候，肩膀不要聳肩、不要用力，要放鬆。\n最後踩上來的時候，吐氣。\n\n然後做一個躺姿的開胸動作：\n1.身體側躺，在上面的腳往前呈 90/90（髖關節與膝關節各彎曲 90 度），在下面的腳與身體保持平行。\n2.在下面的手往外開，在上面的手拿著壺鈴往上頂，然後往外面開（動作像是在做臥推的下放姿勢）。\n3.讓上半身胸椎往外轉，手要往下打直呈 90 度。\n要感覺是胸小肌、胸肌部分有拉伸感，而不是隻有背部有感覺，背部的部分要控制住。\n以上兩個跟旋轉相關的，可以幫助開胸椎，改善呼吸受限的問題。\n\n以下是教練課後的訓練內容\n坐姿腿伸展 32 公斤，四組每組 10 下。最後一組，RIR應該還有 3 以上\n今天控制後側、不要往下壓的那個感覺，比平常好很多。\n\n坐姿划船：\n1.第一組：45 公斤，10 下\n2.後面三組：52 公斤，10 下\n3.最後一組：RIR 1 到 2 左右\n\nCable三頭下拉跟直臂下壓做超級組。\n\n三頭：\n1.第一組：25 公斤 10 下\n2.第二組：32 公斤 10 下\n3.第三組：32 公斤 8 下（RIR 接近 0）\n\n直臂下壓：\n1.第一組：32 公斤，10 下\n2.第二組：32 公斤，8 下\n第三組 25 公斤，10 下。大概 RIR 1 下\n\n坐姿腿後勾：\n• 第一組：18 公斤，13 下\n• 第二、第三組：18 公斤，10 下\n第二組開始，小腿就也跟著好酸最後一組 RIR 1 到 2\n\n站姿提踵機 93 公斤，3 組，每組 10 下，最後一組 RIR 大概 2 到 3\n\nPanatta T-Bar 划船 20 公斤，兩組，每組 10 下。第二組 RIR 大概還有 3 到 4 下。\n\n今天帶小柚來給教練做評估肩胛骨功能\n\n斜方肌跟菱形肌太過緊繃沒出來做事\n主要要做斜方肌的放鬆，然後做菱形肌的拉伸（四足跪姿，單手穿過另外一隻手後方，肩膀跟頭著地）。\n\n另外還有以下動作調整：\n1. 側棒式：可以做退階版（膝蓋著地，大腿小腿呈 90 度）\n2. 正面棒式：可以做膝蓋著地、腳尖抬起離地的版本\n這兩個動作都要用力推，讓肩胛不要翹起來。\n\n另外可以做自重的 Y-raise，Y 的角度要稍微大一點，要感受斜方肌在動作。\n", "2026-07-16": "# 2026年7月16日星期四\n\n今天的熱身：\n1. 滾筒放鬆背、滾筒開胸\n2. 趴姿的穿針式\n3. 側躺的拿啞鈴開胸\n4. 槓鈴放鬆斜方肌\n5. 啞鈴 2.5 公斤的 Y-Raise（今天做角度比較大、比較開一點的）\n然後做筋膜球，放鬆上背、斜方肌、菱形肌肩胛內側。\n\n啞鈴上斜胸推：15 公斤，4 組，每組 10 下。\n最後一組 RIR 應該還有 4 到 5 下以上，但是覺得啞鈴的軌跡沒有很穩定，且兩邊的軌跡好像略有不同。主要是穩定啞鈴的疲勞感比較重，胸還好。\n\nPanatta 的 Standing Multi Flight 做飛鳥夾胸：\n• 55 公斤：2 組，各 10 下\n• 50 公斤：1 組，10 下（最後一組 RIR 大概 1 左右）\n今天做這一組的感受度還不錯，胸的孤立感也蠻好的上半身做類似 RDL 的微微前傾，加微蹲\n\n地雷管肩推 20 公斤兩組 10 下，22.5 公斤兩組 10 下。最後一組 RIR 應該還有 3 到 4 下。最後兩組肩的感覺就比較明顯，但一樣是穩定的疲勞感較重\n\n啞鈴側飛鳥：\n• 5 公斤：3組，10 下\n• 2.5 公斤：1 組，17 下（最後一組 RIR 2 到 3）\n\n機械蝴蝶機做反向飛鳥：\n1. 38 公斤：1 組 10 下\n2. 45 公斤：1 組 10 下\n3. 38 公斤：1 組 10 下\n4. 38 公斤（最後一組）：1 組 10 下\n最後一組是吸飽氣、憋著氣，一口氣做完。實驗一下，好像覺得做起來比較輕鬆一點，因為少了換氣的節奏，比較快。就是有點喘\nRIR大概 1 到 2\n\nCable 手腕尺偏的下拉：\n• 前面兩組：11 公斤，20 下\n• 第三組：18 公斤，10 下\n最後一組右邊 RIR 2-3 以上，左邊 RIR 0\n\nCable 手腕橈偏的下拉：\n• 第一組：11 公斤，20 下\n• 第二組：11 公斤，20 下\n• 第三組：11 公斤，12 下\n• 最後一組：RIR 應該還有 3 以上，不過手臂有點燒\n", "2026-07-17": "# 2026年7月17日星期五\n\n今天的熱身：\n板凳的躺姿臀推，雙腳一組 10 下，單腳兩組 10 下。\n槓鈴放鬆上斜方\n\n澤奇深蹲 60 公斤：\n 公斤，1 分鐘\n感覺沒有掉太多，10 公斤做起來還算蠻輕鬆的，但是槓片一直滑一開始要撐的時候，位置很容易跑掉\n\n三樓的坐姿捲腹機\n第一組 32 公斤，15 下\n第二組 32 公斤 12 下\n\n參加20:00-20:50的飛輪課\n", "2026-09-09": "# 2026年9月9日星期三\n\n今天的熱身：\n1. 第一項：滾筒放鬆背跟開胸椎\n2. 第二項：下犬式（兩組，各 10 次呼吸）\n3. 第三項：趴跪姿的後腳交叉（放鬆臀肌和擴背）\n\n以下是今天的教練課內容：\n第一個是做站姿的風車，做一個姿勢的調整：\n1. 膝蓋微彎，把重點放在上半身。\n2. 舉壺鈴的手，從原來的手掌向內，到往下時會旋轉到手掌向外，然後上來時再轉回來。\n用這個方式做之後，肩膀非常酸，酸到受不了。\n這是為了調整我的左肩彈響的問題。\n\n然後抬手往後拉的姿勢，應該要有主觀的意識。往後拉時，是要做一個肩胛下轉的動作，要控制好肩胛。\n\n接著處理左膝後側彈響的問題，要放鬆小腿的三條肌肉（膕肌、腓腸肌，比目魚姬），然後還要放鬆到大腿後側。\n\n接著做 RDL。\nRDL 的握力問題可以靠鎂粉來改善，確實穩定很多。\n然後膝蓋在預備姿勢就要固定好，後面就是只能往後，膝蓋不能往前，不然膝蓋往前太多會變成蹲了。\n\n接著做槓鈴的硬舉，一樣用鎂粉來改善握力的問題，確實好很多。\n\n起槓時的預備動作：\n1. 大腿後側拉到不能再拉的時候，屁股跟膝蓋要一起往下。此時膝蓋會往前，感覺後側會拉得很緊繃。\n2. 接著再去握槓，不要一往下就急著找槓。\n3. 要拉起來的時候，身體稍微向後移，膝蓋稍微向前。\n這樣的姿勢，就不會一直有想要上半身幫忙拉的那種感覺。\n\n最後做一個「山岳呼吸」。\n\n第一個是站姿：\n把手撐在肋骨下方側面，把胸挺出來做呼吸。\n\n第二個是趴姿（三角形呼吸）：\n身體趴直，雙手呈一個三角形，接著用前臂把身體撐起來。用這個姿勢做呼吸，可以把呼吸肌拉開。\n\n接著 7 點上今天的飛輪課。\n今天的飛輪課，教練帶的節奏跟禮拜二的比起來稍微差了點，比較沒有跟著音樂在跑，但是內容的強度比禮拜二的更強。強度交錯控制得還不錯，沒有爆掉\n中間有一段要求用鼻子吸、鼻子吐，感覺還不錯\n", "2026-09-10": "# 2026年9月10日星期四\n", "2026-09-11": "# 2026年9月11日星期五\n\n今天的熱身：\n\n滾筒放鬆背跟開胸椎。\n啞鈴的 Y-Raise，2.5 公斤做一組 10 下。左邊真的注意力集中在肩胛上，就不會彈響了，但是其實也說不上來到底是對肩胛做了什麼控制，感覺很抽象，只知道全程要求肩胛用力的感覺。\n\n分腿蹲走路：\n第一組：雙手各 5 公斤，15 米\n第二組：雙手各 5 公斤，15 米\n第三組，雙手各 5 公斤，15 米。\n第四組，雙手各 5 公斤，15 米。\n今天做這個，感覺大腿前後側都蠻酸的\n\n機械輔助引體：\n第一組，-54 公斤，12 下\n第二組：負 54 公斤，12 下\n第三組：負 54 公斤，12 下\n第四組：負 54 公斤，12 下\n昨天前臂練得太累，今天前臂撐不住了。\n\n站姿的分腿腿後勾，左腳先：\n1. 第一組：器械空重 15 下\n2. 第二組：器械空重 12 下\n做兩組，腿後整個沒力了\n\n槓鈴划船：\n第一組：50 公斤，12 下\n第二組：50 公斤，12 下\n第三組：50 公斤，10 下\n\n接著上七點的階梯有氧，這個裡面一直轉來轉去，完全跟不上且小碎步偏多，膝蓋壓力不小\n\n然後上 8 點的「流動與平衡」，進去才知道是瑜伽課，有點硬。\n", "2026-09-12": "# 2026年9月12日星期六\n\n今天跑操場 25 圈\n大約 43 分半\n", "2026-09-13": "# 2026年9月13日星期日\n\n今天跑操場 20 圈，大概接近 40 分鐘。跑完膝蓋內側下緣有點痛\n", "2026-09-14": "# 2026年9月14日星期一\n\n今天的熱身：\n1. 滾筒放鬆背與滾筒開胸椎（頭已經可以碰到地板了，這是我用加粗滾筒後的第一次）\n2. 用肘關節放鬆大腿前側、內側和小腿\n3. 下犬式：兩組，每組 10 次呼吸\n第四項是鴿式，也是兩組，每組 10 次呼吸。\n單腳的臀橋一組 6下\n\n分腿蹲走路：\n1. 第一組：兩手各 7.5 公斤啞鈴，15 米\n2. 第二組：兩手各 7.5 公斤啞鈴，15 米\n第三組：兩手各 7.5 公斤，15 米。\n第四組：兩手各 7.5 公斤，15 米。\n六日跑完步，膝蓋有一點不舒服，所以今天一樣是做分腿蹲走路，感覺膝蓋壓力比較 ，要把手臂、手指握緊。往下時要挺胸，往上時要微微含胸。\n平常在做，手指都沒握緊，現在握緊，感覺前臂特別酸，前臂先力竭了\n\n接著做蝴蝶機的反向飛鳥，手肘要彎、不能打太直。往後使行程不用像平常那麼多，大約到側向的 60 度左右。然後注意，肩胛不能往后夾不然原本練到的都是三頭肌止點，手肘微彎之後，感受度會再更往後一點，也就是要越過衣服縫線再靠近身體的那個位置。做起來很抖但是重量卻跟原本加的差不多，是 32 公斤。\n\n面拉、引體向上、直臂下壓，這些都是可以特別改善肱骨前移問題的動作。\n\n教練課後的訓練：\n繩索直臂下壓\n第一組 38 公斤 10 下\n第二組 38 公斤 10 下。\n第三組 38 公斤 8 下，RIR 1 左右。\n\n坐姿划船：\n1. 第一組：45 公斤 / 10 下\n2. 第二組：45 公斤 / 10 下\n3. 第三組：45 公斤 / 10 下RIR 應該還有 3 或以上\n有一段時間沒有做這個了，這次做起來雖然重量沒有加重，但是比較能拉到肚臍附近。之前在拉都偏高還有後面姿勢也比較能維持，也比較有餘裕\n\n樓梯機：\n第一組：速度 2，10 分鐘（組間休息 3 分鐘）\n第二組：速度 2，10 分鐘（組間休息 2 分鐘）\n第三組：速度 2，10 分鐘\n", "2026-10-01": "# 2026年10月1日星期四\n\n今天的熱身：\n\n1.滾筒放鬆背\n2.滾筒開胸椎\n3.側躺持 6 公斤壺鈴的開胸椎：兩組各 10 下\n4.哥本哈根側棒式：第一組做小腿肚上緣的支撐，難度高很多，勉強撐了 30 秒\n第二組拉高到膝蓋下緣、不壓迫膝蓋的位置，也是勉強撐了 30 秒。\n這個位置稍微調整之後，難度就提高好多\n這樣的強度感覺全身處處都跑出來幫忙，沒有精準刺激到內收肌。\n\n啞鈴上斜胸推\n第一組20 公斤10 下\n第二組 20 公斤 10 下\n第三組 20 公斤 10 下。RIR 應該還有空間，但是穩定槓鈴已經變得有點難了\n\n槓鈴的實力推\n第一組 20 公斤 10 下\n第二組 25 公斤 10 下\n第三組，25 公斤，10 下\n做完才想到，之前教練有說要把手肘往前頂，讓手肘的軌跡是直上直下。看影片才發現角度有點落差\n做完後覺得肘部有一點點壓力\n\n坐姿的啞鈴側平舉\n第一組 5 公斤 12 下\n第二組 5 公斤 12 下\n第三組 5 公斤 12 下，RIR 3 左右\n往下放的時候，不要放到張力全無，就要趕快再起來，這樣很有感\n雖然 RIR 最後一組還有 3，但是做完整個肩超級酸，持續了好幾分鐘\n\n繩索的夾胸高度在 26，一下用 D 型手把：\n• 第一組：單邊 11 公斤，10 下\n• 第二組：單邊 11 公斤，12 下\n• 第三組：單邊 11 公斤，12 下\n第四組：單邊 11 公斤，12 下，RIR 3 以上\n感覺胸的外側跟內側都有感，外側好像比較多\n夾胸儘可能網內夾到肘關節交叉，但是沒辦法真的做到交叉（活動度不足）。\n\n繩索二頭彎舉：\n1. 第一組：45 公斤，10 下\n2. 第二組：45 公斤，10 下\n3. 第三組：38 公斤，10 下RIR 2 左右\n這個感覺做起來，也都會覺得肩胛的內側、菱形肌那附近很用力在穩定。\n\n繩索三頭下壓：\n第一組 38 公斤 10 下\n第二組 38 公斤 10 下\n第三組 38 公斤 10 下，RIR 0 到 1\n往上放的時候稍微放得高一點，好像就會做不完。平常行程好像被我偷掉了一點。\n\n繩索前臂旋後 11 公斤：\n第一組 15 下\n第二組 15 下\n\n肩側飛鳥機\n第一組 18 公斤 15 下\n第二組 18 公斤15 下\n第三組 18 公斤，15 下。RIR 左邊 1 到 2，右邊 3 以上\n", "2026-10-02": "# 2026年10月2日星期五\n\n今天的熱身：\n1.第一項：滾筒放鬆背跟開胸椎\n2.第二項：四足跪姿加髖關節大迴旋\n\n以下是訓練內容：\n單腳的 RDL，膝蓋微彎，對側手持啞鈴，做脛骨前後肌以及臀肌的穩定訓練。右腳先\n•第一組：7.5 公斤，10 下\n•第二組：7.5 公斤，10 下\n第三組 7.5 公斤，10 下\n前面兩組做起來，感覺只有右腳的脛骨前肌最有感，左腳不太有。\n第三組調整一下，膝蓋往前蹲的角度稍微多一點點，感覺就跑出來了。\n今天做起來也是大爆汗，但是比教練課時做起來輕鬆一點\n忘了記教練課用的重量了\n今天感覺體力狀況沒有很好\n\nPanata High Row，右手先：\n•第一組：30公斤，10 下\n•第二組：30公斤，10 下\n第三組 30公斤，10 下\n今天特別注意手指要握滿， const GROUP_ACCENT = {"腿部": "#2196F3", "背部": "#4CAF50", "胸部": "#FF9800", "肩部": "#9C27B0", "手臂": "#3F51B5", "核心": "#FFC107", "髖部": "#795548", "有氧": "#E91E63"};
const EXH_STYLE    = {"輕鬆": "background:#e8faf0;color:#1a7a3a", "普通": "background:#fff3e0;color:#b45309", "吃力": "background:#fff0eb;color:#c44a20", "力竭": "background:#ffebeb;color:#cc0000", "力竭（左）": "background:#ffebeb;color:#cc0000", "力竭（左腳）": "background:#ffebeb;color:#cc0000", "—": "background:#f2f2f7;color:#8e8e93"};
const EX_MAP = Object.fromEntries(EXERCISES.map(e => [e.id, e]));
